<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 17px; font-weight: 700">คานและการรองรับ</h2>
<div role="group" aria-label="การรองรับ" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{supports}}" as="x" hint-placeholder-count="3">
<button type="button" onClick="{{x.pick}}" aria-pressed="{{x.pressed}}" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1.5px solid {{x.border}}; background: {{x.bg}}; color: {{x.fg}}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{x.name}}</button>

<div style="display: flex; flex-direction: column; gap: 2px">

</div>
<div style="display: flex; flex-direction: column; gap: 2px">

<input id="bm-h" type="range" min="150" max="1000" step="10" value="{{H.v}}" onChange="{{setH}}">

<button type="button" onClick="{{toggleCrane}}" style="min-height: 48px; border-radius: 999px; border: 1.5px solid #0A6A94; background: {{craneBg}}; color: {{craneFg}}; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">{{craneLabel}}</button>
</div>
</div>
</div>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 24px; font-weight: 700">โปรแกรม FEA ทำงานอย่างไร</h2>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<div style="flex: 1 1 220px; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px"><div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #B04A0C">1 · Mesh</div><div style="font-weight: 700">แบ่งชิ้นงานเป็นชิ้นเล็ก</div><div style="font-size: 14px; line-height: 1.6; color: #34495A">หน้านี้แบ่งคานเป็น 40 ชิ้นต่อกันที่ 41 จุด (node) แต่ละจุดขยับได้ 2 แบบ คือขึ้นลงและหมุน</div></div>
<div style="flex: 1 1 220px; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px"><div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #B04A0C">2 · Stiffness</div><div style="font-weight: 700">สร้างเมทริกซ์ความแข็ง K</div><div style="font-size: 14px; line-height: 1.6; color: #34495A">แต่ละชิ้นมีเมทริกซ์ 4 × 4 จากค่า EI/L³ นำมาประกอบรวมเป็นเมทริกซ์ใหญ่ {{dof}} × {{dof}}</div></div>
<div style="flex: 1 1 220px; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px"><div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #B04A0C">3 · Solve</div><div style="font-weight: 700">ใส่จุดรองรับแล้วแก้ K·u = F</div><div style="font-size: 14px; line-height: 1.6; color: #34495A">ล็อกการเคลื่อนที่ที่จุดรองรับ แล้วแก้สมการเชิงเส้นได้การแอ่นและการหมุนทุกจุด ทุกครั้งที่เลื่อนแถบปรับค่า</div></div>
<div style="flex: 1 1 220px; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px"><div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #B04A0C">4 · Post-process</div><div style="font-weight: 700">คำนวณความเค้นแล้วระบายสี</div><div style="font-size: 14px; line-height: 1.6; color: #34495A">จากโมเมนต์และแรงเฉือนได้ความเค้น σ = M·y/I และ τ แล้วรวมเป็นความเค้นฟอน มิเซส (von Mises) เทียบกับกำลังของวัสดุ</div></div>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.7; color: #4A5D6A; max-width: 960px">โปรแกรมจริงอย่าง ANSYS, Abaqus หรือ CalculiX ใช้หลักเดียวกัน แต่แบ่งชิ้นงานสามมิติเป็นชิ้นนับแสนถึงหลายล้านชิ้น และคิดถึงวัสดุไม่เชิงเส้น รอยร้าว และการสั่นได้ ผลของหน้านี้ใช้ทฤษฎีคานแบบ Euler–Bernoulli เพื่อการเรียนรู้ ไม่ใช่การออกแบบจริง อาคารจริงต้องออกแบบโดยวิศวกรโยธาตามมาตรฐานและกฎหมาย</p>
</section>

</div>
</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":1900}}'>
class Component extends DCLogic {
  constructor() {
    super(...arguments);
    var reduce = false;
    try { reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) {}
    this.reduce = reduce;
    this.state = { preset: 'condo', sup: 'ss', mat: 'rc', L: 6, h: 600, w: 25, P: 0, a: 0.5, selfW: true, mesh: false, mode: 'vm', crane: false, t: 0 };
  }

  componentDidMount() {
    var self = this;
    this._alive = true;
    this._last = null;
    var loop = function (now) {
      if (!self._alive) return;
      if (self._last === null) self._last = now;
      var dt = Math.min((now - self._last) / 1000, 0.1);
      self._last = now;
      if (self.state.crane) { var t = self.state.t + dt; self.setState({ t: t, a: 0.5 - 0.45 * Math.cos(t * 0.6) }); }
      self._raf = requestAnimationFrame(loop);
    };
    this._raf = requestAnimationFrame(loop);
  }

  componentWillUnmount() {
    this._alive = false;
    if (this._raf) cancelAnimationFrame(this._raf);
  }

  presetList() {
    return [
      { id: 'condo', name: 'คานพื้นคอนโด', desc: 'คอนกรีตเสริมเหล็ก ช่วง 6 ม.', sup: 'ss', mat: 'rc', L: 6, h: 600, w: 25, P: 0, a: 0.5 },
      { id: 'crane', name: 'คานรางเครนโรงงาน', desc: 'เหล็กรูปตัว I เครนวิ่งได้', sup: 'ss', mat: 'steel', L: 8, h: 500, w: 2, P: 80, a: 0.5, crane: true },
      { id: 'balcony', name: 'ระเบียงยื่น', desc: 'คานยื่น คอนกรีต 1.8 ม.', sup: 'cant', mat: 'rc', L: 1.8, h: 350, w: 12, P: 2, a: 1 },
      { id: 'roof', name: 'คานหลังคาโกดัง', desc: 'เหล็กยึดสองปลาย ช่วง 12 ม.', sup: 'ff', mat: 'steel', L: 12, h: 450, w: 6, P: 0, a: 0.5 },
      { id: 'timber', name: 'สะพานไม้คนเดิน', desc: 'ไม้ ช่วง 4 ม.', sup: 'ss', mat: 'timber', L: 4, h: 250, w: 2, P: 5, a: 0.5 }
    ];
  }

  section(mat, hmm) {
    var h = hmm / 1000;
    if (mat === 'steel') {
      var b = 0.5 * h, tf = h / 18, tw = h / 28;
      var I = (b * h * h * h - (b - tw) * Math.pow(h - 2 * tf, 3)) / 12;
      var A = 2 * b * tf + (h - 2 * tf) * tw;
      return { I: I, A: A, h: h, b: b, tf: tf, tw: tw, E: 200e6, f: 275, unitW: 78.5, name: 'เหล็กรูปตัว I', kind: 'I', note: 'ปีกกว้าง ' + Math.round(b * 1000) + ' มม. · กำลังคราก 275 MPa' };
    }
    var bw = mat === 'timber' ? 0.4 * h : 0.5 * h;
    var I2 = bw * h * h * h / 12;
    if (mat === 'timber') return { I: I2, A: bw * h, h: h, b: bw, E: 11e6, f: 24, unitW: 5, name: 'ไม้', kind: 'R', note: 'กว้าง ' + Math.round(bw * 1000) + ' มม. · กำลังรับแรงดัด 24 MPa' };
    return { I: I2, A: bw * h, h: h, b: bw, E: 30e6, f: 13.5, unitW: 24, name: 'คอนกรีตเสริมเหล็ก', kind: 'R', note: 'กว้าง ' + Math.round(bw * 1000) + ' มม. · ใช้ค่ายอมให้ 13.5 MPa (0.45 f′c ของ 30 MPa)' };
  }

  // 1D Euler–Bernoulli beam finite elements
  solve(sec, L, sup, w, P, a) {
    var ne = 40, nn = ne + 1, nd = 2 * nn, le = L / ne, EI = sec.E * sec.I;
    var K = [], F = [], i, j;
    for (i = 0; i < nd; i++) { K.push(new Float64Array(nd)); F.push(0); }
    var ke = [[12, 6 * le, -12, 6 * le], [6 * le, 4 * le * le, -6 * le, 2 * le * le], [-12, -6 * le, 12, -6 * le], [6 * le, 2 * le * le, -6 * le, 4 * le * le]];
    var c = EI / (le * le * le);
    var feq = [-w * le / 2, -w * le * le / 12, -w * le / 2, w * le * le / 12];
    for (var e = 0; e < ne; e++) {
      var d = [2 * e, 2 * e + 1, 2 * e + 2, 2 * e + 3];
      for (i = 0; i < 4; i++) { F[d[i]] += feq[i]; for (j = 0; j < 4; j++) K[d[i]][d[j]] += c * ke[i][j]; }
    }
    // point load placed exactly with the element's Hermite shape functions
    var xp = Math.min(L - 1e-9, Math.max(0, a * L)), ep = Math.min(ne - 1, Math.floor(xp / le)), xi = (xp - ep * le) / le;
    var N = [1 - 3 * xi * xi + 2 * xi * xi * xi, le * (xi - 2 * xi * xi + xi * xi * xi), 3 * xi * xi - 2 * xi * xi * xi, le * (-xi * xi + xi * xi * xi)];
    var fp = N.map(function (n) { return -P * n; });
    for (i = 0; i < 4; i++) F[2 * ep + i] += fp[i];
    var fixed = sup === 'ss' ? [0, 2 * ne] : sup === 'cant' ? [0, 1] : [0, 1, 2 * ne, 2 * ne + 1];
    var Kf = K.map(function (r) { return Float64Array.from(r); }), Ff = F.slice();
    fixed.forEach(function (k) { for (var q = 0; q < nd; q++) { Kf[k][q] = 0; Kf[q][k] = 0; } Kf[k][k] = 1; Ff[k] = 0; });
    // Gaussian elimination (the matrix is banded and small, so this is quick)
    for (i = 0; i < nd; i++) {
      var piv = Kf[i][i];
      for (j = i + 1; j < Math.min(nd, i + 5); j++) {
        var fct = Kf[j][i] / piv;
        if (fct === 0) continue;
        for (var q2 = i; q2 < Math.min(nd, i + 6); q2++) Kf[j][q2] -= fct * Kf[i][q2];
        Ff[j] -= fct * Ff[i];
      }
    }
    var u = new Float64Array(nd);
    for (i = nd - 1; i >= 0; i--) { var sm = Ff[i]; for (j = i + 1; j < Math.min(nd, i + 6); j++) sm -= Kf[i][j] * u[j]; u[i] = sm / Kf[i][i]; }
    // internal forces per element (sagging moment positive)
    var Vs = [], Ms = [];
    for (var e2 = 0; e2 < ne; e2++) {
      var ue = [u[2 * e2], u[2 * e2 + 1], u[2 * e2 + 2], u[2 * e2 + 3]], fe = [0, 0, 0, 0];
      for (i = 0; i < 4; i++) { var s1 = 0; for (j = 0; j < 4; j++) s1 += c * ke[i][j] * ue[j]; fe[i] = s1 - feq[i] - (e2 === ep ? fp[i] : 0); }
      Vs.push([fe[0], -fe[2]]); Ms.push([-fe[1], fe[3]]);
    }
    var R = fixed.map(function (k) { var s2 = 0; for (var q3 = 0; q3 < nd; q3++) s2 += K[k][q3] * u[q3]; return s2 - F[k]; });
    return { u: u, V: Vs, M: Ms, ne: ne, le: le, nd: nd, R: R, fixed: fixed, ep: ep };
  }

  renderVals() {
    var self = this, s = this.state;
    var f1 = function (v) { return v.toFixed(1); };
    var sec = this.section(s.mat, s.h);
    var wTot = s.w + (s.selfW ? sec.unitW * sec.A : 0);
    var R = this.solve(sec, s.L, s.sup, wTot, s.P, s.a);
    var ne = R.ne;
    // stress per element and height
    var ny = 12, cells = [], maxVM = 0, maxSig = 0, maxTau = 0, maxM = 0, maxV = 0;
    var grid = [];
    for (var e = 0; e < ne; e++) {
      var Mmid = (R.M[e][0] + R.M[e][1]) / 2 + wTot * R.le * R.le / 8, Vmid = (R.V[e][0] + R.V[e][1]) / 2;
      maxM = Math.max(maxM, Math.abs(R.M[e][0]), Math.abs(R.M[e][1]), Math.abs(Mmid)); maxV = Math.max(maxV, Math.abs(R.V[e][0]), Math.abs(R.V[e][1]));
      var col = [];
      for (var k = 0; k < ny; k++) {
        var y = sec.h / 2 - (k + 0.5) * sec.h / ny;
        var sig = -Mmid * y / sec.I / 1000; // MPa (kN/m² → MPa)
        var tau;
        if (sec.kind === 'I') tau = Math.abs(y) < sec.h / 2 - sec.tf ? Vmid / (sec.tw * (sec.h - 2 * sec.tf)) / 1000 : 0.1 * Vmid / (sec.tw * (sec.h - 2 * sec.tf)) / 1000;
        else tau = Vmid * (sec.h * sec.h / 4 - y * y) / (2 * sec.I) / 1000;
        var vm = Math.sqrt(sig * sig + 3 * tau * tau);
        maxVM = Math.max(maxVM, vm); maxSig = Math.max(maxSig, Math.abs(sig)); maxTau = Math.max(maxTau, Math.abs(tau));
        col.push({ sig: sig, vm: vm });
      }
      grid.push(col);
    }
    var vmax = 0; for (var n = 0; n < R.u.length; n += 2) vmax = Math.max(vmax, Math.abs(R.u[n]));
    var X0 = 50, BW = 800, BH = 70, Y0 = 150;
    var defScale = vmax > 0 ? 40 / vmax : 0; // largest sag drawn as 40 px
    var nodeY = function (i) { return -R.u[2 * i] * defScale; };
    // colour maps
    var rainbow = function (t) {
      t = Math.max(0, Math.min(1, t));
      var stops = [[13, 71, 161], [2, 136, 209], [0, 172, 140], [124, 179, 66], [253, 216, 53], [251, 140, 0], [198, 40, 40]];
      var p = t * (stops.length - 1), i0 = Math.floor(p), i1 = Math.min(stops.length - 1, i0 + 1), fr = p - i0;
      var c = [0, 1, 2].map(function (q) { return Math.round(stops[i0][q] + (stops[i1][q] - stops[i0][q]) * fr); });
      return 'rgb(' + c.join(',') + ')';
    };
    var diverge = function (v) {
      var t = Math.max(-1, Math.min(1, v));
      var a = t < 0 ? [10, 106, 148] : [176, 74, 12], wgt = Math.abs(t);
      var c = [0, 1, 2].map(function (q) { return Math.round(248 + (a[q] - 248) * wgt); });
      return 'rgb(' + c.join(',') + ')';
    };
    var ref = s.mode === 'vm' ? Math.max(sec.f, maxVM) : Math.max(sec.f, maxSig);
    for (var e3 = 0; e3 < ne; e3++) {
      var yOff = (nodeY(e3) + nodeY(e3 + 1)) / 2;
      for (var k2 = 0; k2 < ny; k2++) {
        var cv = grid[e3][k2];
        cells.push({
          x: f1(X0 + e3 * BW / ne), y: f1(Y0 - BH / 2 + k2 * BH / ny + yOff), w: f1(BW / ne + 0.3), h: f1(BH / ny + 0.3),
          fill: s.mode === 'vm' ? rainbow(cv.vm / ref) : diverge(cv.sig / ref), stroke: s.mesh ? '#0F2A3A' : 'none'
        });
      }
    }
    var top = [], bot = [], und = 'M' + X0 + ',' + (Y0 - BH / 2) + ' h' + BW + ' v' + BH + ' h' + (-BW) + ' Z';
    for (var i2 = 0; i2 <= ne; i2++) { var xx = X0 + i2 * BW / ne, yo = i2 < ne ? (nodeY(i2) + nodeY(Math.min(ne, i2 + 1))) / 2 : (nodeY(ne - 1) + nodeY(ne)) / 2; top.push(f1(xx) + ',' + f1(Y0 - BH / 2 + yo)); bot.push(f1(xx) + ',' + f1(Y0 + BH / 2 + yo)); }
    var outline = 'M' + top.join(' L') + ' L' + bot.reverse().join(' L') + ' Z';
    // supports
    var tri = function (x) { return 'M' + x + ',' + (Y0 + BH / 2) + ' l-14,22 l28,0 Z '; };
    var sup = '', walls = '';
    if (s.sup === 'ss') sup = tri(X0) + 'M' + (X0 + BW) + ',' + (Y0 + BH / 2 + 11) + ' a11,11 0 1,0 0.01,0 Z';
    if (s.sup === 'cant' || s.sup === 'ff') { walls += 'M' + X0 + ',' + (Y0 - 70) + ' v140 M' + (X0 - 14) + ',' + (Y0 - 60) + ' l14,-14 M' + (X0 - 14) + ',' + (Y0 - 30) + ' l14,-14 M' + (X0 - 14) + ',' + Y0 + ' l14,-14 M' + (X0 - 14) + ',' + (Y0 + 30) + ' l14,-14 M' + (X0 - 14) + ',' + (Y0 + 60) + ' l14,-14'; }
    if (s.sup === 'ff') { var xr = X0 + BW; walls += ' M' + xr + ',' + (Y0 - 70) + ' v140 M' + xr + ',' + (Y0 - 46) + ' l14,-14 M' + xr + ',' + (Y0 - 16) + ' l14,-14 M' + xr + ',' + (Y0 + 14) + ' l14,-14 M' + xr + ',' + (Y0 + 44) + ' l14,-14 M' + xr + ',' + (Y0 + 74) + ' l14,-14'; }
    // loads
    var loads = '';
    if (wTot > 0) for (var q = 0; q <= 16; q++) { var lx = X0 + q * BW / 16; loads += 'M' + f1(lx) + ',78 l0,' + (Y0 - BH / 2 - 84) + ' m-4,-7 l4,7 l4,-7 '; }
    if (wTot > 0) loads += 'M' + X0 + ',78 h' + BW + ' ';
    var px = X0 + s.a * BW, pyTop = 46;
    if (s.P > 0) loads += 'M' + f1(px) + ',' + pyTop + ' L' + f1(px) + ',' + f1(Y0 - BH / 2 - 4 + nodeY(Math.round(s.a * ne))) + ' m-8,-12 l8,12 l8,-12 ';
    // diagrams
    var vScale = maxV > 0 ? 45 / maxV : 0, mScale = maxM > 0 ? 55 / maxM : 0;
    var vp = ['50,60'], mp = ['50,175'];
    for (var e4 = 0; e4 < ne; e4++) {
      var xa = 50 + e4 * 800 / ne, xb = 50 + (e4 + 1) * 800 / ne;
      vp.push(f1(xa) + ',' + f1(60 - R.V[e4][0] * vScale)); vp.push(f1(xb) + ',' + f1(60 - R.V[e4][1] * vScale));
      var mmid = (R.M[e4][0] + R.M[e4][1]) / 2 + wTot * R.le * R.le / 8;
      mp.push(f1(xa) + ',' + f1(175 - R.M[e4][0] * mScale)); mp.push(f1((xa + xb) / 2) + ',' + f1(175 - mmid * mScale)); mp.push(f1(xb) + ',' + f1(175 - R.M[e4][1] * mScale));
    }
    vp.push('850,60'); mp.push('850,175');
    var dg = { v: 'M' + vp.join(' L') + ' Z', m: 'M' + mp.join(' L') + ' Z', vMax: 'V สูงสุด ' + maxV.toFixed(1) + ' kN', mMax: 'M สูงสุด ' + maxM.toFixed(1) + ' kN·m' };

    var sf = sec.f / Math.max(maxVM, 1e-9);
    var lim = s.sup === 'cant' ? s.L / 180 : s.L / 360, defMm = vmax * 1000, limMm = lim * 1000;
    var ok = sf >= 1.5 && defMm <= limMm;
    var reactions = R.R.filter(function (v, i) { return R.fixed[i] % 2 === 0; }).map(function (v) { return v.toFixed(1); }).join(' / ');
    // analytic check for the textbook case: simply supported, central point load only
    var check = '';
    if (s.sup === 'ss') {
      var EI = sec.E * sec.I, an = 5 * wTot * Math.pow(s.L, 4) / (384 * EI);
      var ap = s.a * s.L, bp = s.L - ap, x = s.L / 2;
      var pd = s.P > 0 ? (ap >= x ? s.P * bp * x * (s.L * s.L - bp * bp - x * x) / (6 * EI * s.L) : s.P * ap * (s.L - x) * (s.L * s.L - ap * ap - (s.L - x) * (s.L - x)) / (6 * EI * s.L)) : 0;
      check = 'สูตรตำราที่กลางช่วง: ' + ((an + pd) * 1000).toFixed(2) + ' มม. · FEA: ' + (Math.abs(R.u[2 * (ne / 2)]) * 1000).toFixed(2) + ' มม.';
    } else if (s.sup === 'cant') {
      var EI2 = sec.E * sec.I, ac = wTot * Math.pow(s.L, 4) / (8 * EI2) + (s.P > 0 ? s.P * Math.pow(s.a * s.L, 2) * (3 * s.L - s.a * s.L) / (6 * EI2) : 0);
      check = 'สูตรตำราที่ปลายคาน: ' + (ac * 1000).toFixed(2) + ' มม. · FEA: ' + (Math.abs(R.u[2 * ne]) * 1000).toFixed(2) + ' มม.';
    } else check = 'คานยึดสองปลายแอ่นน้อยกว่าคานวางบนจุดรองรับราว 5 เท่า เมื่อรับน้ำหนักแผ่เท่ากัน';
    var res = {
      outline: outline, undeformed: und, supports: sup || 'M0,0', walls: walls || 'M0,0', loads: loads || 'M0,0',
      pX: f1(px), pLabel: s.P > 0 ? s.P + ' kN' : '', wLabel: wTot > 0 ? 'น้ำหนักแผ่รวม ' + wTot.toFixed(1) + ' kN/ม.' : '',
      badge: sf < 1 ? 'คานวิบัติ: ความเค้นเกินกำลังวัสดุ' : !ok ? (sf < 1.5 ? 'ความปลอดภัยต่ำกว่า 1.5' : 'แอ่นเกินเกณฑ์ L/' + (s.sup === 'cant' ? 180 : 360)) : 'ผ่านทั้งกำลังและการแอ่น',
      bg: sf < 1 ? '#FCE3CF' : ok ? '#DDEFF6' : '#FFF1CC', fg: sf < 1 ? '#7E3407' : ok ? '#0A4F70' : '#6B4A00',
      aria: 'คาน' + sec.name + ' ยาว ' + s.L + ' เมตร ความเค้นสูงสุด ' + maxVM.toFixed(1) + ' MPa แอ่น ' + defMm.toFixed(1) + ' มม.',
      rows: [
        { k: 'โมเมนต์ดัดสูงสุด', v: maxM.toFixed(1) + ' kN·m', sub: 'จาก FEA ' + ne + ' เอลิเมนต์', color: '#0F2A3A' },
        { k: 'ความเค้นฟอนมิเซสสูงสุด', v: maxVM.toFixed(1) + ' MPa', sub: 'กำลังวัสดุที่ใช้เทียบ ' + sec.f + ' MPa', color: sf < 1 ? '#B04A0C' : '#0F2A3A' },
        { k: 'ค่าความปลอดภัย (กำลัง ÷ ความเค้น)', v: sf > 99 ? '> 99' : sf.toFixed(2), sub: 'หน้านี้ใช้เกณฑ์ไม่ต่ำกว่า 1.5 เพื่อการเรียนรู้', color: sf < 1.5 ? '#B04A0C' : '#0F2A3A' },
        { k: 'การแอ่นสูงสุด', v: defMm.toFixed(1) + ' มม.', sub: 'เกณฑ์ L/' + (s.sup === 'cant' ? 180 : 360) + ' = ' + limMm.toFixed(1) + ' มม. ' + (defMm > limMm ? 'เกิน: พื้นจะรู้สึกเด้งและผนังร้าว' : 'ผ่าน'), color: defMm > limMm ? '#B04A0C' : '#0F2A3A' },
        { k: 'แรงปฏิกิริยาที่จุดรองรับ', v: reactions + ' kN', sub: 'ผลรวมเท่ากับน้ำหนักทั้งหมด ' + (wTot * s.L + s.P).toFixed(1) + ' kN', color: '#0F2A3A' },
        { k: 'ตรวจกับสูตรในตำรา', v: '', sub: check, color: '#0F2A3A' }
      ]
    };
    res.scaleNote = 'การแอ่นในภาพขยายให้มองเห็น · ความลึกคานในภาพไม่ตามสเกล';
    var legend = s.mode === 'vm' ? { lo: '0 MPa', hi: ref.toFixed(0) + ' MPa', grad: 'linear-gradient(90deg, rgb(13,71,161), rgb(2,136,209), rgb(0,172,140), rgb(124,179,66), rgb(253,216,53), rgb(251,140,0), rgb(198,40,40))' }
      : { lo: 'อัด −' + ref.toFixed(0) + ' MPa', hi: 'ดึง +' + ref.toFixed(0) + ' MPa', grad: 'linear-gradient(90deg, rgb(10,106,148), rgb(248,248,248), rgb(176,74,12))' };

    var pill = function (on) { return on ? { bg: '#0A6A94', fg: '#FFFFFF', sub: '#E1F0F7', border: '#0A6A94' } : { bg: '#FFFFFF', fg: '#0F2A3A', sub: '#4A5D6A', border: '#C9D4DA' }; };
    var opt = function (list, key) { return list.map(function (x) { var on = s[key] === x.id, p = pill(on); return { name: x.name, pressed: on ? 'true' : 'false', bg: p.bg, fg: p.fg, border: p.border, pick: function () { var o = {}; o[key] = x.id; o.preset = null; self.setState(o); } }; }); };
    var set = function (k) { return function (ev) { var o = { preset: null }; o[k] = parseFloat(ev.target.value); if (k === 'a') o.crane = false; self.setState(o); }; };
    return {
      presets: this.presetList().map(function (p) { var on = s.preset === p.id, q = pill(on); return { name: p.name, desc: p.desc, pressed: on ? 'true' : 'false', bg: q.bg, fg: q.fg, sub: q.sub, border: q.border, pick: function () { self.setState({ preset: p.id, sup: p.sup, mat: p.mat, L: p.L, h: p.h, w: p.w, P: p.P, a: p.a, crane: !!p.crane && !self.reduce }); } }; }),
      modes: opt([{ id: 'vm', name: 'ความเค้นฟอนมิเซส' }, { id: 'sig', name: 'แรงดึง / แรงอัด' }], 'mode'),
      supports: opt([{ id: 'ss', name: 'วางบนจุดรองรับ' }, { id: 'cant', name: 'คานยื่น' }, { id: 'ff', name: 'ยึดแน่นสองปลาย' }], 'sup'),
      mats: opt([{ id: 'rc', name: 'คอนกรีตเสริมเหล็ก' }, { id: 'steel', name: 'เหล็กรูปตัว I' }, { id: 'timber', name: 'ไม้' }], 'mat'),
      cells: cells, res: res, dg: dg, legend: legend, dof: R.nd,
      L: { v: s.L, label: s.L.toFixed(1) + ' ม.' }, H: { v: s.h, label: s.h + ' มม.', section: sec.name + ' · ' + sec.note },
      W: { v: s.w, label: s.w.toFixed(1) + ' kN/ม.' }, Pp: { v: s.P, label: s.P + ' kN' }, A: { v: s.a, label: (s.a * s.L).toFixed(2) + ' ม.' },
      setL: set('L'), setH: set('h'), setW: set('w'), setP: set('P'), setA: set('a'),
      selfW: s.selfW, mesh: s.mesh,
      toggleSelf: function () { self.setState({ selfW: !self.state.selfW }); },
      toggleMesh: function () { self.setState({ mesh: !self.state.mesh }); },
      toggleCrane: function () { self.setState({ crane: !self.state.crane, P: self.state.P > 0 ? self.state.P : 60 }); },
      craneLabel: s.crane ? 'หยุดเครนเคลื่อนที่' : 'ให้น้ำหนักจุดวิ่งไปมา (เครน)',
      craneBg: s.crane ? '#0A6A94' : '#FFFFFF', craneFg: s.crane ? '#FFFFFF' : '#0A6A94'
    };
  }
}
