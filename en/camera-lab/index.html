<h1 style="margin: 0; font-size: clamp(32px, 4.5vw, 52px); line-height: 1.15; font-weight: 700">Camera Lab: from a ray of light to a finished image</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.7; color: #4A5D6A">A set of simulations you can actually adjust, from lenses, sensors and image processing to stereo cameras for 3D images, stabilisation, and designing cameras to survive their environment.</p>

<div style="flex: 1 1 150px; background: #EAF3F7; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px"><div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #0A6A94">Light</div><div style="font-size: 15px; line-height: 1.55">Photons bounce off the subject; the darker it is, the fewer there are</div></div>

<div style="flex: 1 1 150px; background: #EAF3F7; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px"><div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #0A6A94">Lens</div><div style="font-size: 15px; line-height: 1.55">Bends light so it comes together as an image on one plane</div></div>

<div style="flex: 1 1 150px; background: #EAF3F7; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px"><div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #0A6A94">Stabilisation</div><div style="font-size: 15px; line-height: 1.55">Moves the lens or sensor against the shake of your hand</div></div>
