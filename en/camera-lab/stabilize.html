<header style="display: flex; flex-direction: column; gap: 8px; max-width: 880px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #B04A0C">Experiment 05</div>
<h1 style="margin: 0; font-size: clamp(30px, 4vw, 44px); line-height: 1.2; font-weight: 700">Stabilisation: hardware (OIS) vs. software (EIS)</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #4A5D6A">Human hands shake all the time at several hertz. Turn each kind of stabilisation on and off and watch two things separately: the image “wobbling” around, and the image “blurring” within each frame.</p>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<div style="flex: 999 1 620px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; overflow: hidden">

</div>

<svg viewBox="0 0 800 450" style="display: block; width: 100%; height: auto; border-radius: 6px; background: #E9E2D6" role="img" aria-label="Simulated room scene shaking with the hand">
<g style="filter: blur({{blurPx}}px)" transform="{{sceneTransform}}">

<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">Stabilisation</h2>
<label style="display: flex; align-items: flex-start; gap: 12px; min-height: 44px; cursor: pointer"><input type="checkbox" checked="{{ois}}" onChange="{{toggleOis}}" style="width: 22px; height: 22px; margin-top: 2px; accent-color: #0A6A94"><span><strong>OIS</strong> hardware stabilisation<br><span style="font-size: 13px; color: #4A5D6A">A gyro measures the shake and a motor moves the lens the opposite way; travel is limited</span></span></label>
<label style="display: flex; align-items: flex-start; gap: 12px; min-height: 44px; cursor: pointer"><input type="checkbox" checked="{{eis}}" onChange="{{toggleEis}}" style="width: 22px; height: 22px; margin-top: 2px; accent-color: #0A6A94"><span><strong>EIS</strong> software stabilisation<br><span style="font-size: 13px; color: #4A5D6A">Keeps a cropped margin, then moves the frame according to gyro data</span></span></label>
<label style="display: flex; align-items: flex-start; gap: 12px; min-height: 44px; cursor: pointer"><input type="checkbox" checked="{{walk}}" onChange="{{toggleWalk}}" style="width: 22px; height: 22px; margin-top: 2px; accent-color: #0A6A94"><span><strong>Walking</strong><br><span style="font-size: 13px; color: #4A5D6A">Adds a slow but strong sway in step with your stride</span></span></label>
<div style="display: flex; flex-direction: column; gap: 2px; border-top: 1px solid #E3E9EC; padding-top: 12px">
<div style="display: flex; justify-content: space-between"><label for="st-a" style="font-size: 14px; font-weight: 600">Hand shake level</label><span style="font-family: 'IBM Plex Mono', monospace; color: #0A6A94">{{ampLabel}}</span></div>
<input id="st-a" type="range" min="0" max="100" step="1" value="{{amp}}" onChange="{{setAmp}}">
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; justify-content: space-between"><label for="st-s" style="font-size: 14px; font-weight: 600">Shutter speed</label><span style="font-family: 'IBM Plex Mono', monospace; color: #0A6A94">{{shutterLabel}}</span></div>
<input id="st-s" type="range" min="0" max="100" step="1" value="{{sv}}" onChange="{{setS}}">
</div>
</div>
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; padding: 16px 20px; display: flex; flex-direction: column; gap: 8px">
<div style="font-weight: 700">Shake path, last 2 seconds</div>
<svg viewBox="0 0 240 240" style="display: block; width: 100%; max-width: 280px; height: auto; align-self: center" role="img" aria-label="Plot of the hand-shake path compared with the image after stabilisation">
<rect x="0" y="0" width="240" height="240" rx="8" fill="#F3F6F7"></rect>
<line x1="120" y1="0" x2="120" y2="240" stroke="#D5DEE3"></line>
<line x1="0" y1="120" x2="240" y2="120" stroke="#D5DEE3"></line>
<path d="{{rawTrace}}" fill="none" stroke="#9AAAB4" stroke-width="1.5"></path>
<path d="{{finalTrace}}" fill="none" stroke="#B04A0C" stroke-width="2.5"></path>
</svg>
<div style="display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: #4A5D6A"><span style="display: inline-flex; gap: 6px; align-items: center"><svg width="20" height="8" aria-hidden="true"><line x1="0" y1="4" x2="20" y2="4" stroke="#9AAAB4" stroke-width="2"></line></svg>Actual hand shake</span><span style="display: inline-flex; gap: 6px; align-items: center"><svg width="20" height="8" aria-hidden="true"><line x1="0" y1="4" x2="20" y2="4" stroke="#B04A0C" stroke-width="3"></line></svg>Image after stabilisation</span></div>
</div>
</div>
</div>

<section style="background: #0F2A3A; color: #FFFFFF; border-radius: 16px; padding: clamp(18px, 3vw, 28px); display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 22px; font-weight: 700">Key observation</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.75; color: #D9E8EF">Try turning OIS off, leave only EIS on, and slow the shutter. The image stays steady in the frame but is still blurry, because EIS can only shift the image after it’s captured, while the blur already happened while the shutter was open. OIS moves the lens during the exposure, so it actually reduces blur. That’s why low-light stills rely on OIS, while video uses both (hybrid).</p>
</section>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 24px; font-weight: 700">How each kind of stabilisation works</h2>
<div style="display: flex; flex-wrap: wrap; gap: 14px">
<div style="flex: 1 1 280px; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 6px"><div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #B04A0C">Hardware</div><h3 style="margin: 0; font-size: 17px; font-weight: 700">OIS moves the lens</h3><p style="margin: 0; font-size: 14px; line-height: 1.65; color: #34495A">A MEMS gyroscope measures rotation thousands of times per second. A controller drives a voice-coil motor (VCM) to shift the lens group the opposite way, and Hall sensors measure the real lens position for closed-loop correction.</p></div>
<div style="flex: 1 1 280px; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 6px"><div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #B04A0C">Hardware</div><h3 style="margin: 0; font-size: 17px; font-weight: 700">Sensor-shift / IBIS</h3><p style="margin: 0; font-size: 14px; line-height: 1.65; color: #34495A">Moves the sensor instead of the lens, so it works with any lens attached. Some mirrorless cameras move it on 5 axes, including roll around the lens axis, which ordinary OIS can’t correct.</p></div>
<div style="flex: 1 1 280px; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 6px"><div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #B04A0C">Software</div><h3 style="margin: 0; font-size: 17px; font-weight: 700">EIS crops and warps the image</h3><p style="margin: 0; font-size: 14px; line-height: 1.65; color: #34495A">Reads gyro data matched to the timing of each pixel row, then shifts, rotates and warps the image to compensate. It also fixes the jelly effect (rolling shutter), at the cost of a narrower view. Extra-strong stabilisation modes crop even more.</p></div>
<div style="flex: 1 1 280px; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 6px"><div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #B04A0C">Mechanical</div><h3 style="margin: 0; font-size: 17px; font-weight: 700">3-axis gimbal</h3><p style="margin: 0; font-size: 14px; line-height: 1.65; color: #34495A">Three brushless motors rotate the whole camera against the motion. Used in drones, robots and phone gimbals. It handles far more shake than OIS because it can move tens of degrees.</p></div>
</div>
</section>

</div>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":1300}}'>
class Component extends DCLogic {
  constructor() {
    super(...arguments);
    var reduce = false;
    try { reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) {}
    this.state = { t: 0, ois: false, eis: false, walk: false, amp: 50, sv: 40, playing: !reduce };
    this._raw = [];
    this._fin = [];
  }

  componentDidMount() {
    var self = this;
    this._alive = true;
    this._last = null;
    var loop = function (now) {
      if (!self._alive) return;
      if (self._last === null) self._last = now;
      var dt = Math.min((now - self._last) / 1000, 0.1);
      self._last = now;
      if (self.state.playing) {
        var t = self.state.t + dt;
        var c = self.compute(t, self.state);
        self._raw.push(c.raw); self._fin.push(c.fin);
        if (self._raw.length > 120) { self._raw.shift(); self._fin.shift(); }
        self.setState({ t: t });
      }
      self._raf = requestAnimationFrame(loop);
    };
    this._raf = requestAnimationFrame(loop);
  }

  componentWillUnmount() {
    this._alive = false;
    if (this._raf) cancelAnimationFrame(this._raf);
  }

  shake(t, s) {
    var A = s.amp / 100 * 30, P = 2 * Math.PI, w = s.walk ? 1 : 0;
    return {
      x: A * (0.6 * Math.sin(P * 1.3 * t) + 0.35 * Math.sin(P * 4.7 * t + 1) + 0.2 * Math.sin(P * 9.1 * t + 2)) + w * 1.6 * A * Math.sin(P * 0.9 * t),
      y: A * (0.5 * Math.sin(P * 1.1 * t + 0.5) + 0.3 * Math.sin(P * 5.3 * t + 2.2) + 0.18 * Math.sin(P * 8.3 * t + 1)) + w * 2.0 * A * Math.sin(P * 1.8 * t + 1.2)
    };
  }

  afterOis(t, s) {
    var sh = this.shake(t, s), R = 18;
    if (!s.ois) return { x: sh.x, y: sh.y, sat: false };
    var cx = Math.max(-R, Math.min(R, 0.92 * sh.x)), cy = Math.max(-R, Math.min(R, 0.92 * sh.y));
    return { x: sh.x - cx, y: sh.y - cy, sat: Math.abs(0.92 * sh.x) > R || Math.abs(0.92 * sh.y) > R };
  }

  compute(t, s) {
    var raw = this.shake(t, s);
    var o = this.afterOis(t, s);
    var fin = { x: o.x, y: o.y };
    if (s.eis) {
      var lag = this.afterOis(t - 0.017, s), M = 40;
      fin.x = o.x - Math.max(-M, Math.min(M, lag.x));
      fin.y = o.y - Math.max(-M, Math.min(M, lag.y));
    }
    var dt = 0.004, o2 = this.afterOis(t + dt, s);
    var vel = Math.sqrt(Math.pow(o2.x - o.x, 2) + Math.pow(o2.y - o.y, 2)) / dt;
    return { raw: raw, fin: fin, vel: vel, sat: o.sat };
  }

  renderVals() {
    var self = this, s = this.state;
    var c = this.compute(s.t, s);
    var shutter = Math.pow(10, -3 + s.sv / 100 * 2.4);
    var blur = Math.min(24, c.vel * shutter);
    var tr = 'translate(' + c.fin.x.toFixed(1) + ' ' + c.fin.y.toFixed(1) + ')';
    if (s.eis) tr = 'translate(400 225) scale(1.1) translate(-400 -225) ' + tr;

    var trace = function (arr) {
      if (!arr.length) return 'M120,120';
      return 'M' + arr.map(function (p) { return (120 + p.x * 1.5).toFixed(1) + ',' + (120 + p.y * 1.5).toFixed(1); }).join(' L');
    };
    var rms = function (arr) {
      if (!arr.length) return 0;
      var sum = 0; arr.forEach(function (p) { sum += p.x * p.x + p.y * p.y; });
      return Math.sqrt(sum / arr.length);
    };
    var rRaw = rms(this._raw), rFin = rms(this._fin);
    var cut = rRaw > 0.1 ? Math.max(0, (1 - rFin / rRaw) * 100) : 0;

    var readouts = [
      { label: 'Average wobble', value: rFin.toFixed(1) + ' px', sub: rRaw > 0.1 ? 'Down ' + cut.toFixed(0) + '% from the raw hand shake' : 'Hand is still' },
      { label: 'Blur in this frame', value: blur.toFixed(1) + ' px', sub: blur < 1 ? 'Sharp' : blur < 4 ? 'Slight blur' : 'Clearly blurry: try OIS or a faster shutter' },
      { label: 'Field of view lost', value: s.eis ? '≈ 17%' : '0%', sub: s.eis ? 'EIS crops 10% off each side' : 'Full field of view' },
      { label: 'OIS status', value: !s.ois ? 'Off' : c.sat ? 'At its limit' : 'Working', sub: !s.ois ? '' : c.sat ? 'The shake exceeds how far the lens can move; the excess gets through' : 'Keeping up' }
    ];

    return {
      blurPx: blur.toFixed(2), sceneTransform: tr,
      rawTrace: trace(this._raw), finalTrace: trace(this._fin),
      readouts: readouts,
      ois: s.ois, eis: s.eis, walk: s.walk, amp: s.amp, sv: s.sv,
      ampLabel: s.amp === 0 ? 'Still' : s.amp < 35 ? 'Light' : s.amp < 70 ? 'Moderate' : 'Strong',
      shutterLabel: shutter >= 0.1 ? shutter.toFixed(2) + ' s' : '1/' + Math.round(1 / shutter) + ' s',
      playLabel: s.playing ? 'Pause' : 'Play animation',
      togglePlay: function () { self.setState({ playing: !self.state.playing }); },
      toggleOis: function () { self._raw = []; self._fin = []; self.setState({ ois: !self.state.ois }); },
      toggleEis: function () { self._raw = []; self._fin = []; self.setState({ eis: !self.state.eis }); },
      toggleWalk: function () { self._raw = []; self._fin = []; self.setState({ walk: !self.state.walk }); },
      setAmp: function (e) { self.setState({ amp: parseFloat(e.target.value) }); },
      setS: function (e) { self.setState({ sv: parseFloat(e.target.value) }); }
    };
  }
}
</script>
