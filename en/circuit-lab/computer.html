<div id="dc-root"></div>
<template id="dc-template">
<div style="font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; color: #0F2A3A; background: #F3F6F7; box-sizing: border-box; padding: 32px clamp(16px, 3vw, 40px) 64px">
<div style="max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 34px">

<header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px; max-width: 900px">
<div style="font-size: 14px; font-weight: 600; letter-spacing: 0.08em; color: #0A6A94">CIRCUIT LAB · From circuits to computers</div>
<h1 style="margin: 0; font-size: clamp(30px, 4vw, 46px); line-height: 1.2; font-weight: 700">From one tiny switch to a CPU</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #4A5D6A">Every computer is built from the same part: a transistor acting as a switch turned on and off by electricity. Connect switches into logic gates, gates into adders and memory, and all of it into a CPU. Step through each level here</p>
</div>
<a href="index.html" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 20px; border-radius: 999px; border: 1.5px solid #0F2A3A; color: #0F2A3A; font-weight: 600; text-decoration: none">← Circuit Lab</a>
</header>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 26px; font-weight: 700">1. Transistor: a switch turned on by voltage</h2>
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<div style="flex: 999 1 600px; min-width: 0; display: flex; flex-wrap: wrap; gap: 14px">
<div style="flex: 1 1 320px; min-width: 0; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; overflow: hidden">
<svg viewBox="0 0 400 300" style="display: block; width: 100%; height: auto; background: #FBFCFD" role="img" aria-label="{{tx.aria}}">
<line x1="60" y1="30" x2="300" y2="30" stroke="#B04A0C" stroke-width="3"></line>
<text x="60" y="22" font-size="12" fill="#7E3407" font-weight="700">+3.3 V</text>
<line x1="60" y1="275" x2="300" y2="275" stroke="#0A6A94" stroke-width="3"></line>
<text x="60" y="292" font-size="12" fill="#0A4F70" font-weight="700">GND 0 V</text>
<line x1="240" y1="30" x2="240" y2="60" stroke="#4A5D6A" stroke-width="3"></line>
<rect x="228" y="60" width="24" height="34" fill="#FFFFFF" stroke="#4A5D6A" stroke-width="2"></rect>
<text x="262" y="82" font-size="11" fill="#4A5D6A">100 Ω</text>
<line x1="240" y1="94" x2="240" y2="112" stroke="#4A5D6A" stroke-width="3"></line>
<circle cx="240" cy="126" r="26" fill="#F5C77A" opacity="{{tx.glow}}"></circle>
<path d="M228,114 L252,114 L240,136 Z" fill="{{tx.ledC}}" stroke="#0F2A3A" stroke-width="2"></path>
<line x1="228" y1="138" x2="252" y2="138" stroke="#0F2A3A" stroke-width="2"></line>
<text x="262" y="130" font-size="11" fill="#4A5D6A">LED</text>
<line x1="240" y1="138" x2="240" y2="170" stroke="#4A5D6A" stroke-width="3"></line>
<line x1="240" y1="170" x2="240" y2="185" stroke="#4A5D6A" stroke-width="3"></line>
<line x1="226" y1="185" x2="226" y2="235" stroke="#0F2A3A" stroke-width="4"></line>
<line x1="234" y1="185" x2="234" y2="235" stroke="{{tx.chC}}" stroke-width="5"></line>
<line x1="234" y1="190" x2="240" y2="190" stroke="#4A5D6A" stroke-width="3"></line>
<line x1="234" y1="230" x2="240" y2="230" stroke="#4A5D6A" stroke-width="3"></line>
<line x1="240" y1="185" x2="240" y2="190" stroke="#4A5D6A" stroke-width="3"></line>
<line x1="240" y1="230" x2="240" y2="275" stroke="#4A5D6A" stroke-width="3"></line>
<line x1="120" y1="210" x2="226" y2="210" stroke="#0F2A3A" stroke-width="3"></line>
<circle cx="120" cy="210" r="5" fill="#0F2A3A"></circle>
<text x="80" y="200" font-size="12" fill="#0F2A3A" font-weight="700">Gate {{tx.vgTxt}}</text>
<text x="262" y="196" font-size="11" fill="#4A5D6A">Drain</text>
<text x="262" y="236" font-size="11" fill="#4A5D6A">Source</text>
<path d="{{tx.dots}}" fill="#B04A0C"></path>
<text x="300" y="160" font-size="12" fill="#0F2A3A" font-weight="700">{{tx.iTxt}}</text>
</svg>
</div>
<div style="flex: 1 1 280px; min-width: 0; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
<span style="font-weight: 700; font-size: 14px">Current vs. gate voltage</span>
<svg viewBox="0 0 320 210" style="display: block; width: 100%; height: auto" role="img" aria-label="Graph of transistor current vs. gate voltage">
<rect x="40" y="10" width="{{tx.zone0}}" height="170" fill="#DDEFF6"></rect>
<rect x="{{tx.zone1x}}" y="10" width="{{tx.zone1w}}" height="170" fill="#FCE3CF"></rect>
<text x="44" y="24" font-size="11" fill="#0A4F70" font-weight="700">Read as 0</text>
<text x="306" y="24" font-size="11" text-anchor="end" fill="#7E3407" font-weight="700">Read as 1</text>
<line x1="40" y1="180" x2="310" y2="180" stroke="#9AAAB4"></line>
<line x1="40" y1="10" x2="40" y2="180" stroke="#9AAAB4"></line>
<path d="{{tx.curve}}" fill="none" stroke="#0F2A3A" stroke-width="2.5"></path>
<circle cx="{{tx.px}}" cy="{{tx.py}}" r="6" fill="#B04A0C"></circle>
<text x="310" y="198" font-size="11" text-anchor="end" fill="#4A5D6A">V_gate 0 → 3.3 V</text>
<text x="34" y="16" font-size="10" text-anchor="end" fill="#4A5D6A">13 mA</text>
</svg>
<span style="font-size: 13px; line-height: 1.6; color: #4A5D6A">The gap between the two zones is where digital circuits never let a signal stay, because it cannot be read as 0 or 1</span>
</div>
</div>
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; justify-content: space-between"><label for="t-vg" style="font-size: 14px; font-weight: 600">Gate voltage</label><span style="font-family: 'IBM Plex Mono', monospace; color: #0A6A94">{{tx.vgTxt}}</span></div>
<input id="t-vg" type="range" min="0" max="3.3" step="0.05" value="{{vg}}" onChange="{{setVg}}">
</div>
<div style="font-size: 15px; line-height: 1.7">{{tx.msg}}</div>
</div>
<div style="background: #0F2A3A; color: #FFFFFF; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: #9FD0E6">How a MOSFET works</div>
<p style="margin: 0; font-size: 14px; line-height: 1.7; color: #D9E8EF">The gate is separated from the silicon by a thin insulator. When the gate voltage rises above the threshold (about 0.7 V in this example), the electric field gathers electrons into a conducting channel between drain and source, closing the switch, with almost no current flowing into the gate. So one transistor can drive the next, chained billions of times over</p>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px">I_D ≈ k·(V_G − V_th)² when V_G &gt; V_th</div>
</div>
</div>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 26px; font-weight: 700">2. Logic gates: wiring transistors into decisions</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4A5D6A; max-width: 960px">Modern chips use CMOS, two kinds of transistor in pairs. PMOS conducts when its input is 0 and connects the output to the supply; NMOS conducts when its input is 1 and connects the output to ground. In every state only one path conducts, so almost no power is used while idle. Toggle inputs A and B and watch which way the current flows</p>
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<div style="flex: 999 1 600px; min-width: 0; display: flex; flex-wrap: wrap; gap: 14px">
<div style="flex: 1 1 360px; min-width: 0; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; overflow: hidden">
<div style="display: flex; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid #E3E9EC; font-size: 14px; font-weight: 700"><span>{{gt.title}}</span><span style="font-family: 'IBM Plex Mono', monospace; color: {{gt.outC}}">OUT = {{gt.out}}</span></div>
<svg viewBox="0 0 420 300" style="display: block; width: 100%; height: auto; background: #FBFCFD" role="img" aria-label="{{gt.aria}}">
<line x1="60" y1="24" x2="360" y2="24" stroke="#B04A0C" stroke-width="3"></line>
<text x="364" y="28" font-size="11" fill="#7E3407" font-weight="700">VDD (1)</text>
<line x1="60" y1="282" x2="360" y2="282" stroke="#0A6A94" stroke-width="3"></line>
<text x="364" y="286" font-size="11" fill="#0A4F70" font-weight="700">GND (0)</text>
<sc-for list="{{gt.wires}}" as="w" hint-placeholder-count="10">
<line x1="{{w.x1}}" y1="{{w.y1}}" x2="{{w.x2}}" y2="{{w.y2}}" stroke="{{w.c}}" stroke-width="{{w.sw}}" stroke-linecap="round"></line>
</sc-for>
<sc-for list="{{gt.tr}}" as="t" hint-placeholder-count="4">
<rect x="{{t.x}}" y="{{t.y}}" width="64" height="40" rx="6" fill="{{t.fill}}" stroke="{{t.stroke}}" stroke-width="2"></rect>
<text x="{{t.tx}}" y="{{t.ty}}" font-size="12" text-anchor="middle" fill="{{t.tc}}" font-weight="700">{{t.label}}</text>
<text x="{{t.tx}}" y="{{t.ty2}}" font-size="10" text-anchor="middle" fill="{{t.tc}}">{{t.state}}</text>
</sc-for>
<circle cx="{{gt.outX}}" cy="{{gt.outY}}" r="9" fill="{{gt.outC}}"></circle>
<text x="{{gt.outX}}" y="{{gt.outY}}" dx="14" dy="4" font-size="13" fill="#0F2A3A" font-weight="700">OUT</text>
</svg>
</div>
<div style="flex: 1 1 220px; min-width: 0; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; overflow: hidden">
<div role="table" aria-label="Truth table" style="display: flex; flex-direction: column; font-family: 'IBM Plex Mono', monospace; font-size: 15px">
<div role="row" style="display: grid; grid-template-columns: repeat(3, 1fr); padding: 10px 16px; background: #F3F6F7; font-weight: 700"><span role="columnheader">A</span><span role="columnheader">{{gt.bHead}}</span><span role="columnheader">OUT</span></div>
<sc-for list="{{gt.rows}}" as="r" hint-placeholder-count="4">
<div role="row" style="display: grid; grid-template-columns: repeat(3, 1fr); padding: 9px 16px; border-top: 1px solid #E3E9EC; background: {{r.bg}}; font-weight: {{r.fw}}"><span role="cell">{{r.a}}</span><span role="cell">{{r.b}}</span><span role="cell">{{r.o}}</span></div>
</sc-for>
</div>
<p style="margin: 0; padding: 12px 16px; font-size: 13px; line-height: 1.6; color: #4A5D6A; border-top: 1px solid #E3E9EC">{{gt.note}}</p>
</div>
</div>
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 600">Choose a gate</span>
<div role="group" aria-label="Choose a gate" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{gt.gates}}" as="p" hint-placeholder-count="6">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="flex: 1 1 70px; min-height: 44px; border-radius: 10px; border: 1.5px solid {{p.border}}; background: {{p.bg}}; color: {{p.fg}}; font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; cursor: pointer">{{p.name}}</button>
</sc-for>
</div>
<span style="font-size: 14px; font-weight: 600">Inputs</span>
<div style="display: flex; gap: 8px">
<sc-for list="{{gt.inputs}}" as="p" hint-placeholder-count="2">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="flex: 1 1 0; min-height: 52px; border-radius: 12px; border: 2px solid {{p.border}}; background: {{p.bg}}; color: {{p.fg}}; font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 700; cursor: pointer">{{p.name}}</button>
</sc-for>
</div>
</div>
<div style="background: #0F2A3A; color: #FFFFFF; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: #9FD0E6">Why NAND matters</div>
<p style="margin: 0; font-size: 14px; line-height: 1.7; color: #D9E8EF">NAND alone can build every logic circuit (a universal gate) and in CMOS needs only 4 transistors, while AND needs NAND followed by NOT, 6 in total. Chip designers therefore think mainly in NAND and NOR</p>
</div>
</div>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 26px; font-weight: 700">3. A 4-bit adder: gates doing arithmetic</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4A5D6A; max-width: 960px">Computers count in binary and add one digit at a time, just like adding on paper. Each digit uses one full adder: sum S = A ⊕ B ⊕ carry, and the carry to the next digit = A·B + carry·(A ⊕ B). Tap the bits to change the numbers</p>
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<div style="flex: 999 1 640px; min-width: 0; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; overflow: hidden">
<svg viewBox="0 0 900 300" style="display: block; width: 100%; height: auto; background: #FBFCFD" role="img" aria-label="{{ad.aria}}">
<sc-for list="{{ad.cols}}" as="c" hint-placeholder-count="4">
<text x="{{c.cx}}" y="22" font-size="12" text-anchor="middle" fill="#4A5D6A">{{c.place}}</text>
<rect x="{{c.ax}}" y="34" width="46" height="40" rx="8" fill="{{c.aC}}" stroke="#0F2A3A" stroke-width="1.5"></rect>
<text x="{{c.axt}}" y="60" font-size="16" text-anchor="middle" fill="{{c.aT}}" font-family="IBM Plex Mono, monospace" font-weight="700">{{c.a}}</text>
<rect x="{{c.bx}}" y="34" width="46" height="40" rx="8" fill="{{c.bC}}" stroke="#0F2A3A" stroke-width="1.5"></rect>
<text x="{{c.bxt}}" y="60" font-size="16" text-anchor="middle" fill="{{c.bT}}" font-family="IBM Plex Mono, monospace" font-weight="700">{{c.b}}</text>
<line x1="{{c.axt}}" y1="74" x2="{{c.axt}}" y2="110" stroke="{{c.aW}}" stroke-width="3"></line>
<line x1="{{c.bxt}}" y1="74" x2="{{c.bxt}}" y2="110" stroke="{{c.bW}}" stroke-width="3"></line>
<rect x="{{c.fx}}" y="110" width="130" height="80" rx="10" fill="#FFFFFF" stroke="#0F2A3A" stroke-width="2"></rect>
<text x="{{c.cx}}" y="146" font-size="13" text-anchor="middle" fill="#0F2A3A" font-weight="700">Full adder</text>
<text x="{{c.cx}}" y="166" font-size="11" text-anchor="middle" fill="#4A5D6A">{{c.detail}}</text>
<line x1="{{c.cx}}" y1="190" x2="{{c.cx}}" y2="226" stroke="{{c.sW}}" stroke-width="3"></line>
<rect x="{{c.sx}}" y="226" width="46" height="40" rx="8" fill="{{c.sC}}" stroke="#0F2A3A" stroke-width="1.5"></rect>
<text x="{{c.cx}}" y="252" font-size="16" text-anchor="middle" fill="{{c.sT}}" font-family="IBM Plex Mono, monospace" font-weight="700">{{c.s}}</text>
<line x1="{{c.cinX1}}" y1="150" x2="{{c.cinX2}}" y2="150" stroke="{{c.cW}}" stroke-width="3"></line>
<text x="{{c.cinTx}}" y="142" font-size="11" text-anchor="middle" fill="{{c.cTc}}" font-weight="700">carry {{c.cout}}</text>
</sc-for>
<text x="40" y="252" font-size="13" fill="#4A5D6A">Sum</text>
<text x="40" y="60" font-size="13" fill="#4A5D6A">A · B</text>
</svg>
</div>
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 600">Number A (tap to flip a bit)</span>
<div style="display: flex; gap: 6px">
<sc-for list="{{ad.aBits}}" as="p" hint-placeholder-count="4">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" aria-label="{{p.aria}}" style="flex: 1 1 0; min-height: 48px; border-radius: 10px; border: 2px solid {{p.border}}; background: {{p.bg}}; color: {{p.fg}}; font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 700; cursor: pointer">{{p.name}}</button>
</sc-for>
</div>
<span style="font-size: 14px; font-weight: 600">Number B</span>
<div style="display: flex; gap: 6px">
<sc-for list="{{ad.bBits}}" as="p" hint-placeholder-count="4">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" aria-label="{{p.aria}}" style="flex: 1 1 0; min-height: 48px; border-radius: 10px; border: 2px solid {{p.border}}; background: {{p.bg}}; color: {{p.fg}}; font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 700; cursor: pointer">{{p.name}}</button>
</sc-for>
</div>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 20px; text-align: center; padding: 8px 0">{{ad.eq}}</div>
<div style="font-size: 14px; line-height: 1.6; color: {{ad.noteC}}">{{ad.note}}</div>
</div>
</div>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 26px; font-weight: 700">4. Memory: circuits that remember by themselves</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4A5D6A; max-width: 960px">Feed a gate’s output back into its input and the circuit holds its state: one bit of memory. A D flip-flop stores D only at the moment the clock goes from 0 to 1, so every part of a CPU works together in step. Here 4 flip-flops form a register that stores the sum from part 3</p>
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<div style="flex: 999 1 640px; min-width: 0; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; overflow: hidden">
<div style="display: flex; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid #E3E9EC; font-size: 14px; flex-wrap: wrap; gap: 8px"><span style="font-weight: 700">Timing diagram</span><span style="font-family: 'IBM Plex Mono', monospace">{{ff.regTxt}}</span></div>
<svg viewBox="0 0 900 250" style="display: block; width: 100%; height: auto; background: #FBFCFD" role="img" aria-label="{{ff.aria}}">
<sc-for list="{{ff.lanes}}" as="l" hint-placeholder-count="3">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":3600}}'>

    var GX = function (v) { return 40 + 270 * v / 3.3; }, GY = function (i) { return 180 - 165 * i / Imax; };
    var curve = []; for (var j = 0; j <= 66; j++) { var v = 3.3 * j / 66; curve.push(f1(GX(v)) + ',' + f1(GY(Id(v)))); }
    var dots = '';
    if (I > 0) for (var q = 0; q < 6; q++) { var yy = 30 + ((s.t * 40 * (0.3 + u) + q * 41) % 245); dots += 'M' + f1(236) + ',' + f1(yy) + ' a4,4 0 1,0 8,0 a4,4 0 1,0 -8,0 '; }

    var trOut = D.tr.map(function (t, i) {
      var c = on[i] ? (toVdd(t.a) || toVdd(t.b) ? '#B04A0C' : '#0A6A94') : '#9AAAB4';

    });
    var notes = {

      nand: 'NAND uses 4: PMOS in parallel, NMOS in series. The output is 0 only when A and B are both 1',
      nor: 'NOR uses 4: PMOS in series, NMOS in parallel. The output is 1 only when A and B are both 0',
      and: 'AND = NAND followed by NOT (6 transistors). The picture shows the NAND stage, which gives ' + baseOut + ' then NOT flips it to ' + out,

    var rows = (gate === 'not' ? [[0], [1]] : [[0, 0], [0, 1], [1, 0], [1, 1]]).map(function (r) {

      return { a: r[0], b: gate === 'not' ? '–' : r[1], o: o, bg: cur ? '#FFF1CC' : '#FFFFFF', fw: cur ? 700 : 500 };
    });
    var gt = {
      title: { not: 'NOT', nand: 'NAND', nor: 'NOR', and: 'AND (NAND stage)', or: 'OR (NOR stage)', xor: 'XOR (first NAND)' }[gate] + ' · transistor level',
      out: out, outC: out ? '#B04A0C' : '#0A6A94', outX: D.outX, outY: D.outY,

    var ad = {
      cols: cols,
      aBits: s.a.map(function (v, i) { var p = bitBtn(v); return { name: v, pressed: v ? 'true' : 'false', aria: 'Bit of A, place ' + Math.pow(2, 3 - i), bg: p.bg, fg: p.fg, border: p.border, pick: function () { var n = self.state.a.slice(); n[i] = 1 - n[i]; self.setState({ a: n }); } }; }),

    var H = s.hist, t0 = s.t - 8;
    var lanes = [['CLK', 1, '#4A5D6A', 40], ['D', 2, '#0A6A94', 110], ['Q', 3, '#B04A0C', 180]].map(function (L) {
      var d = '', prevY = null;
      H.forEach(function (h, idx) { var x = 100 + (h[0] - t0) / 8 * 780, y = L[3] - h[L[1]] * 34; if (idx === 0) d = 'M' + f1(x) + ',' + y; else { if (y !== prevY) d += ' L' + f1(x) + ',' + prevY; d += ' L' + f1(x) + ',' + y; } prevY = y; });
      return { n: L[0], c: L[2], base: L[3], ty: L[3] - 10, d: d || 'M0,0' };
    });
    var edges = ''; for (var e = 1; e < H.length; e++) if (H[e][1] === 1 && H[e - 1][1] === 0) { var xe = 100 + (H[e][0] - t0) / 8 * 780; edges += 'M' + f1(xe) + ',10 L' + f1(xe) + ',200 '; }
    var ff = {
      lanes: lanes, edges: edges || 'M0,0', d: s.D, dPressed: s.D ? 'true' : 'false', dBg: s.D ? '#0A6A94' : '#FFFFFF', dFg: s.D ? '#FFFFFF' : '#0A6A94',
      regTxt: 'Q = ' + s.Q + ' · 4-bit register = ' + bin(s.reg) + ' (' + s.reg + ')', clkTxt: s.clk.toFixed(1) + ' ticks/s',
      aria: 'D flip-flop timing diagram, Q ' + s.Q
    };

    // ---------- 5. CPU ----------
    var C = this.cpuState(s.step), P = this.program(), ph = C.halted ? 'halt' : C.phase;
    var active = { fetch: ['pc', 'mem', 'ir'], decode: ['ir', 'dec'], execute: ['dec', 'alu', 'reg', 'mem'], halt: [] }[ph];
    var cur = P[Math.min(C.PC, P.length - 1)];
    if (ph === 'execute' && cur.op === 'LOAD') active = ['dec', 'reg'];
    if (ph === 'execute' && cur.op === 'STORE') active = ['dec', 'reg', 'mem'];
    if (ph === 'execute' && cur.op === 'HALT') active = ['dec'];
    var isOn = function (id) { return active.indexOf(id) >= 0; };
    var blk = function (id, name, val, x, y, w, h) { var o = isOn(id); return { x: x, y: y, w: w, h: h, tx: x + w / 2, ty: y + h / 2 - 4, ty2: y + h / 2 + 16, name: name, val: val, fill: o ? '#FFF1CC' : '#FFFFFF', stroke: o ? '#B04A0C' : '#C9D4DA', tc: '#0F2A3A' }; };
    var blocks = [
      blk('pc', 'Program counter (PC)', String(C.PC), 30, 40, 180, 70),
      blk('ir', 'Instruction register (IR)', C.IR, 250, 40, 200, 70),
      blk('dec', 'Instruction decoder', ph === 'halt' ? 'Halted' : ph === 'fetch' ? 'Waiting for an instruction' : cur.op, 250, 150, 200, 70),
      blk('reg', 'Registers A, B', 'A=' + C.A + '  B=' + C.B, 30, 250, 200, 70),
      blk('alu', 'ALU (the adder from part 3)', ph === 'execute' && cur.op === 'ADD' ? C.A + ' + ' + C.B : '–', 270, 250, 220, 70)
    ];
    var line = function (d, id1, id2) { var o = isOn(id1) && isOn(id2); return { d: d, c: o ? '#B04A0C' : '#C9D4DA', w: o ? 4 : 2 }; };
    var arrows = [
      line('M210,75 L250,75', 'pc', 'ir'), line('M450,75 L640,75', 'ir', 'mem'), line('M350,110 L350,150', 'ir', 'dec'),
      line('M300,220 L300,250 M130,220 L130,250', 'dec', 'reg'), line('M400,220 L400,250', 'dec', 'alu'), line('M230,285 L270,285', 'reg', 'alu'),
      line('M490,285 L640,285', 'reg', 'mem')
    ];
    var mem = [];
    for (var m = 0; m < 8; m++) { var y = 44 + m * 34, txt = m < P.length ? P[m].txt : m === 7 ? 'data: ' + C.M7 : '–', curRow = m === C.PC && !C.halted; mem.push({ y: y, ty: y + 20, addr: '[' + m + ']', txt: txt, bg: curRow && ph === 'fetch' ? '#FFF1CC' : m === 7 && C.M7 ? '#DDEFF6' : '#FFFFFF', fw: curRow ? 700 : 500 }); }
    var explain;
    if (C.halted) explain = 'Program finished. The sum 3 + 5 = 8 is stored in memory address [7]. It took ' + s.step + ' steps. A real CPU does these steps billions of times per second and overlaps several instructions in a pipeline';
    else if (ph === 'fetch') explain = 'Fetch: send address ' + C.PC + ' from the program counter to memory, then copy the instruction "' + cur.txt + '" into the instruction register';
    else if (ph === 'decode') explain = 'Decode: many gates read the instruction’s bits and open the paths it needs. This instruction is ' + cur.op;
    else explain = { LOAD: 'Execute: put the value ' + cur.v + ' into register ' + cur.r + ' and the program counter goes up by 1', ADD: 'Execute: send A and B into the ALU, which is the adder from part 3, and store the result in register A on the next clock edge', STORE: 'Execute: write the value in register A to memory address [7]', HALT: 'Execute: the halt instruction stops the program' }[cur.op];
    var cpu = {
      blocks: blocks, arrows: arrows, mem: mem, explain: explain,
      phaseTxt: { fetch: '1. Fetch', decode: '2. Decode', execute: '3. Execute', halt: 'Program finished' }[ph],
      cycle: 'Step ' + s.step + ' · instruction ' + C.PC,
      aria: 'CPU diagram, phase ' + ph + ' register A ' + C.A + ' B ' + C.B
    };
    var scale = [
      { t: 'Transistor', n: '1', d: 'A switch turned on and off by voltage; in modern chips only a few tens of nanometres in size' },
      { t: 'NAND gate', n: '4 transistors', d: '2 PMOS + 2 NMOS' },
      { t: '1-bit full adder', n: '~28 transistors', d: 'The common CMOS design' },
      { t: '1 bit of SRAM', n: '6 transistors', d: 'Used in CPU caches; fast but takes space' },
      { t: '1 bit of DRAM', n: '1 transistor + a capacitor', d: 'The RAM in computers and phones' },
      { t: '1 flash memory cell', n: '1 transistor (can store several bits)', d: 'SSDs and USB drives store charge in a layer surrounded by insulator, written by quantum tunnelling (see the Quantum Lab)' },
      { t: 'A whole CPU or GPU chip', n: 'Billions to tens of billions of transistors', d: 'Wired with dozens of stacked copper layers and designed with software, because drawing by hand is impossible' },
      { t: 'Software', n: 'The programs we write', d: 'A compiler turns code into machine instructions like those in part 5, and the CPU runs them step by step using all the circuits above' }
    ];

    return {
      tx: tx, gt: gt, ad: ad, ff: ff, cpu: cpu, scale: scale,
      vg: s.vg, setVg: function (e) { self.setState({ vg: parseFloat(e.target.value) }); },
      toggleD: function () { self.setState({ D: 1 - self.state.D }); },
      loadReg: s.loadReg, toggleLoadReg: function () { self.setState({ loadReg: !self.state.loadReg }); },
      clk: s.clk, setClk: function (e) { self.setState({ clk: parseFloat(e.target.value) }); },
      cpuStep: function () { if (!self.cpuState(self.state.step).halted) self.setState({ step: self.state.step + 1 }); },
      cpuReset: function () { self.setState({ step: 0 }); },
      cpuAuto: s.cpuAuto, toggleCpuAuto: function () { self.setState({ cpuAuto: !self.state.cpuAuto }); }
    };
  }
}
</script>
