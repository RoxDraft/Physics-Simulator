<!doctype html>

.ps-bar a{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:999px;

</head>

<template id="dc-template">
<div style="font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; color: #0F2A3A; background: #F3F6F7; box-sizing: border-box; padding: 32px clamp(16px, 3vw, 40px) 64px">
<div style="max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 34px">

<nav aria-label="Light & Display Lab sections" style="display: flex; flex-wrap: wrap; gap: 8px">
<a href="index.html" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #C9D4DA; background: #FFFFFF; color: #0F2A3A; font-size: 14px; font-weight: 600; text-decoration: none">Light sources & LED lamps</a>
<a href="display.html" aria-current="page" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #0A6A94; background: #0A6A94; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none">Phone & device screens</a>
<a href="sources.html" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #C9D4DA; background: #FFFFFF; color: #0F2A3A; font-size: 14px; font-weight: 600; text-decoration: none">Sources</a>
</nav>

<header style="display: flex; flex-direction: column; gap: 8px; max-width: 920px">
<div style="font-size: 14px; font-weight: 600; letter-spacing: 0.08em; color: #0A6A94">LIGHT &amp; DISPLAY LAB · DISPLAYS</div>
<h1 style="margin: 0; font-size: clamp(30px, 4vw, 46px); line-height: 1.2; font-weight: 700">Phone screens: from a single pixel to glass that survives a drop</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #4A5D6A">A phone screen has millions of light points, each controlled by its own thin-film transistor. Hundreds of screens are made at once on a large glass sheet, sealed against moisture by layers hundreds of times thinner than a hair, covered with strengthened glass, and still have to sense your finger and redraw up to 120 times a second.</p>
</header>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 26px; font-weight: 700">1. How a pixel makes colour: LCD, OLED and MicroLED</h2>
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<div style="flex: 999 1 640px; min-width: 0; display: flex; flex-wrap: wrap; gap: 14px">
<div style="flex: 1 1 380px; min-width: 0; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; overflow: hidden">
<div style="padding: 10px 16px; border-bottom: 1px solid #E3E9EC; font-weight: 700; font-size: 14px">{{px.stackTitle}}</div>
<svg viewBox="0 0 440 330" style="display: block; width: 100%; height: auto; background: #FBFCFD" role="img" aria-label="{{px.aria}}">
<sc-for list="{{px.layers}}" as="l" hint-placeholder-count="8">
<rect x="16" y="{{l.y}}" width="190" height="{{l.h}}" rx="3" fill="{{l.fill}}" stroke="#C9D4DA"></rect>
<text x="24" y="{{l.ty}}" font-size="11" fill="#0F2A3A" font-family="IBM Plex Mono, monospace">{{l.pct}}</text>
<text x="214" y="{{l.ty}}" font-size="11" fill="#0F2A3A">{{l.name}}</text>
</sc-for>
<path d="{{px.rays}}" stroke="#F5A623" stroke-width="3" opacity="0.85"></path>
</svg>
</div>
<div style="flex: 1 1 240px; min-width: 0; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<span style="font-weight: 700; font-size: 14px">Look at the pixels through a magnifier</span>
<svg viewBox="0 0 240 240" style="display: block; width: 100%; max-width: 280px; height: auto; background: #0B0F12; border-radius: 8px" role="img" aria-label="{{px.zoomAria}}">
<rect x="0" y="0" width="240" height="240" fill="{{px.leak}}"></rect>
<sc-for list="{{px.subs}}" as="q" hint-placeholder-count="27">
<rect x="{{q.x}}" y="{{q.y}}" width="{{q.w}}" height="{{q.h}}" rx="{{q.r}}" fill="{{q.c}}" opacity="{{q.o}}"></rect>
</sc-for>
</svg>
<div style="display: flex; align-items: center; gap: 10px; font-size: 14px"><span style="width: 40px; height: 40px; border-radius: 8px; background: {{px.swatch}}; border: 1px solid #D5DEE3; flex: 0 0 auto"></span>Colour the eye sees at normal distance</div>
</div>
</div>
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
<div role="group" aria-label="Display type" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{px.techs}}" as="p" hint-placeholder-count="4">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="flex: 1 1 100px; min-height: 44px; padding: 4px 10px; border-radius: 10px; border: 1.5px solid {{p.border}}; background: {{p.bg}}; color: {{p.fg}}; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{p.name}}</button>
</sc-for>
</div>
<sc-for list="{{px.sliders}}" as="x" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; justify-content: space-between; gap: 8px"><label for="{{x.id}}" style="font-size: 14px; font-weight: 600; color: {{x.c}}">{{x.name}}</label><span style="font-family: 'IBM Plex Mono', monospace; color: #0A6A94">{{x.label}}</span></div>
<input id="{{x.id}}" type="range" min="0" max="255" step="1" value="{{x.v}}" onChange="{{x.set}}">
</div>
</sc-for>
<sc-for list="{{px.stats}}" as="r" hint-placeholder-count="3">
<div style="display: flex; justify-content: space-between; gap: 10px; font-size: 14px; border-top: 1px solid #E3E9EC; padding-top: 6px"><span>{{r.k}}</span><span style="font-family: 'IBM Plex Mono', monospace; text-align: right">{{r.v}}</span></div>
</sc-for>
</div>
<div style="background: #0F2A3A; color: #FFFFFF; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: #9FD0E6">{{px.title}}</div>
<p style="margin: 0; font-size: 14px; line-height: 1.7; color: #D9E8EF">{{px.how}}</p>
</div>
</div>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 26px; font-weight: 700">2. How sharp before the eye cannot see the pixels?</h2>
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<div style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; overflow: hidden">
<svg viewBox="0 0 900 200" style="display: block; width: 100%; height: auto; background: #FBFCFD" role="img" aria-label="{{rs.aria}}">
<circle cx="60" cy="100" r="26" fill="#FFFFFF" stroke="#0F2A3A" stroke-width="2"></circle><circle cx="68" cy="100" r="10" fill="#0F2A3A"></circle>
<line x1="86" y1="100" x2="820" y2="{{rs.y1}}" stroke="#9AAAB4" stroke-dasharray="4 4"></line>
<line x1="86" y1="100" x2="820" y2="{{rs.y2}}" stroke="#9AAAB4" stroke-dasharray="4 4"></line>
<rect x="820" y="{{rs.y1}}" width="20" height="{{rs.aH}}" fill="#DDEFF6" stroke="#0A6A94"></rect>
<rect x="844" y="{{rs.py}}" width="20" height="{{rs.pH}}" fill="{{rs.pC}}"></rect>
<text x="810" y="{{rs.labY}}" font-size="12" text-anchor="end" fill="#0A4F70">The eye resolves 1 arcminute (normal vision)</text>
<text x="854" y="{{rs.labY2}}" font-size="12" text-anchor="middle" fill="#0F2A3A">1 pixel</text>
<text x="450" y="190" font-size="12" text-anchor="middle" fill="#4A5D6A">{{rs.distTxt}}</text>
</svg>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px">
<sc-for list="{{rs.stats}}" as="r" hint-placeholder-count="5">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px">
<div style="font-size: 13px; font-weight: 600; color: #4A5D6A">{{r.k}}</div>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; color: {{r.c}}">{{r.v}}</div>
<div style="font-size: 13px; line-height: 1.5; color: #4A5D6A">{{r.sub}}</div>
</div>
</sc-for>
</div>
</div>
<div style="flex: 1 1 320px; min-width: 0; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 600">Resolution</span>
<div role="group" aria-label="Resolution" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{rs.res}}" as="p" hint-placeholder-count="3">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="flex: 1 1 90px; min-height: 44px; border-radius: 10px; border: 1.5px solid {{p.border}}; background: {{p.bg}}; color: {{p.fg}}; font-family: 'IBM Plex Mono', monospace; font-size: 12px; cursor: pointer; line-height: 1.3">{{p.name}}</button>
</sc-for>
</div>
<sc-for list="{{rs.sliders}}" as="x" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; justify-content: space-between; gap: 8px"><label for="{{x.id}}" style="font-size: 14px; font-weight: 600">{{x.name}}</label><span style="font-family: 'IBM Plex Mono', monospace; color: #0A6A94">{{x.label}}</span></div>
<input id="{{x.id}}" type="range" min="{{x.min}}" max="{{x.max}}" step="{{x.step}}" value="{{x.v}}" onChange="{{x.set}}">
</div>
</sc-for>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #4A5D6A">The angle one pixel subtends at the eye = pixel size ÷ viewing distance. If it is smaller than about 1 arcminute (1/60 of a degree), a normal eye cannot separate the pixels. Going sharper helps less and less, but it still makes small text and diagonal lines crisper.</p>
</div>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 26px; font-weight: 700">3. Hundreds of screens at once: mother glass and yield</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4A5D6A; max-width: 960px">A factory builds screens on one large mother glass sheet and then cuts it into small panels. A single dust particle or defect anywhere inside a panel ruins that panel, so the clean room must be thousands of times cleaner than an operating theatre. The fraction of good panels is the yield; in the Poisson model Y = e^(−D·A).</p>
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<div style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; overflow: hidden">
<div style="display: flex; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid #E3E9EC; font-size: 14px; flex-wrap: wrap; gap: 8px"><span style="font-weight: 700">Gen 6 mother glass (1,500 × 1,850 mm)</span><span style="font-family: 'IBM Plex Mono', monospace">{{yd.head}}</span></div>
<svg viewBox="0 0 900 400" style="display: block; width: 100%; height: auto; background: #FBFCFD" role="img" aria-label="{{yd.aria}}">
<rect x="{{yd.sx}}" y="10" width="{{yd.sw}}" height="{{yd.sh}}" fill="#DDE7EC" stroke="#9AAAB4"></rect>
<path d="{{yd.good}}" fill="#7FBF9A" stroke="#FFFFFF" stroke-width="1"></path>
<path d="{{yd.bad}}" fill="#E07A5F" stroke="#FFFFFF" stroke-width="1"></path>
<path d="{{yd.defects}}" fill="#0F2A3A"></path>
</svg>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px">
<sc-for list="{{yd.stats}}" as="r" hint-placeholder-count="5">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px">
<div style="font-size: 13px; font-weight: 600; color: #4A5D6A">{{r.k}}</div>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; color: {{r.c}}">{{r.v}}</div>
<div style="font-size: 13px; line-height: 1.5; color: #4A5D6A">{{r.sub}}</div>
</div>
</sc-for>
</div>
</div>
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{yd.sliders}}" as="x" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; justify-content: space-between; gap: 8px"><label for="{{x.id}}" style="font-size: 14px; font-weight: 600">{{x.name}}</label><span style="font-family: 'IBM Plex Mono', monospace; color: #0A6A94">{{x.label}}</span></div>
<input id="{{x.id}}" type="range" min="{{x.min}}" max="{{x.max}}" step="{{x.step}}" value="{{x.v}}" onChange="{{x.set}}">
</div>
</sc-for>
<button type="button" onClick="{{newSheet}}" style="min-height: 44px; border-radius: 999px; border: 1.5px solid #0A6A94; background: #0A6A94; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Make a new sheet</button>
</div>
<div style="background: #0F2A3A; color: #FFFFFF; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: #9FD0E6">OLED panel production steps (simplified)</div>
<sc-for list="{{steps}}" as="t" hint-placeholder-count="6">
<div style="display: flex; gap: 10px; font-size: 13px; line-height: 1.6; color: #D9E8EF"><span style="font-family: 'IBM Plex Mono', monospace; color: #F5C77A; flex: 0 0 18px">{{t.n}}</span><span>{{t.t}}</span></div>
</sc-for>
</div>
</div>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 26px; font-weight: 700">4. Impact resistance: drop-testing a phone</h2>
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<div style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; gap: 14px">
<div style="flex: 1 1 260px; min-width: 0; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; overflow: hidden">
<svg viewBox="0 0 260 320" style="display: block; width: 100%; height: auto; background: #FBFCFD" role="img" aria-label="{{dr.aria}}">
<rect x="0" y="290" width="260" height="30" fill="{{dr.floorC}}"></rect>
<line x1="40" y1="{{dr.topY}}" x2="40" y2="290" stroke="#9AAAB4" stroke-dasharray="3 4"></line>
<text x="46" y="{{dr.topY}}" dy="10" font-size="11" fill="#4A5D6A">{{dr.hTxt}}</text>
<g transform="translate(130,{{dr.y}}) rotate({{dr.rot}})">
<rect x="-34" y="-62" width="68" height="124" rx="10" fill="{{dr.caseC}}"></rect>
<rect x="-30" y="-58" width="60" height="116" rx="8" fill="#0F2A3A"></rect>
<rect x="-26" y="-52" width="52" height="104" rx="4" fill="#1F4E66"></rect>
<path d="{{dr.cracks}}" fill="none" stroke="#FFFFFF" stroke-width="1.5"></path>
</g>
</svg>
</div>
<div style="flex: 1 1 340px; min-width: 0; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
<span style="font-weight: 700; font-size: 14px">Cross-section of ion-exchange strengthened glass</span>
<svg viewBox="0 0 340 128" style="display: block; width: 100%; height: auto" role="img" aria-label="Cross-section of glass with a compressed surface and a core in tension">
<rect x="10" y="20" width="320" height="100" fill="#FCE3CF"></rect>
<rect x="10" y="20" width="320" height="{{dr.dol}}" fill="#BFE0EE" opacity="{{dr.ionO}}"></rect>
<rect x="10" y="{{dr.dolB}}" width="320" height="{{dr.dol}}" fill="#BFE0EE" opacity="{{dr.ionO}}"></rect>
<path d="M160,20 l-4,{{dr.crackD}} l4,0 z" fill="#0F2A3A"></path>
<text x="16" y="14" font-size="11" fill="#0A4F70">{{dr.topTxt}}</text>
<text x="170" y="74" font-size="11" text-anchor="middle" fill="#7E3407">Core in slight tension</text>
</svg>
<span style="font-size: 12px; color: #4A5D6A">{{dr.secNote}}</span>
<span style="font-size: 13px; line-height: 1.6; color: #4A5D6A">The glass is soaked in molten potassium salt. Large potassium ions replace small sodium ions at the surface, packing it so tightly that it is permanently in compression. A tiny surface crack can only grow once the tension from an impact first overcomes this compression.</span>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px">
<sc-for list="{{dr.stats}}" as="r" hint-placeholder-count="5">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px">
<div style="font-size: 13px; font-weight: 600; color: #4A5D6A">{{r.k}}</div>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; color: {{r.c}}">{{r.v}}</div>
<div style="font-size: 13px; line-height: 1.5; color: #4A5D6A">{{r.sub}}</div>
</div>
</sc-for>
</div>
</div>
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; justify-content: space-between"><label for="d-h" style="font-size: 14px; font-weight: 600">Drop height</label><span style="font-family: 'IBM Plex Mono', monospace; color: #0A6A94">{{dr.hTxt}}</span></div>
<input id="d-h" type="range" min="0.3" max="2" step="0.1" value="{{dh}}" onChange="{{setDh}}">
</div>
<span style="font-size: 14px; font-weight: 600">Floor</span>
<div role="group" aria-label="Floor" style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{dr.floors}}" as="p" hint-placeholder-count="3">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="flex: 1 1 80px; min-height: 40px; border-radius: 999px; border: 1.5px solid {{p.border}}; background: {{p.bg}}; color: {{p.fg}}; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{p.name}}</button>
</sc-for>
</div>
<span style="font-size: 14px; font-weight: 600">Cover glass</span>
<div role="group" aria-label="Glass type" style="display: flex; flex-direction: column; gap: 6px">

      stats: [
        { k: 'Blur when the eye tracks the motion', v: Math.round(blurW / 900 * 70) + ' mm', sub: 'Ball moves at ' + Math.round(speed / 900 * 70 * 10) / 10 + ' cm/s on a 7 cm wide screen · each frame held ' + (1000 / hz).toFixed(1) + ' ms', c: '#0F2A3A' },
        { k: '120 Hz display all the time', v: Pfix.toFixed(2) + ' W', sub: 'Battery lasts about ' + (batt / (Pfix + rest)).toFixed(1) + ' h while' + C.n, c: '#0F2A3A' },
        { k: 'LTPO display at ' + ltpoHz + ' Hz', v: Pltpo.toFixed(2) + ' W', sub: 'Battery lasts about ' + (batt / (Pltpo + rest)).toFixed(1) + ' h (display saves ' + Math.round((1 - Pltpo / Pfix) * 100) + '%)', c: '#0A6A94' },
        { k: 'Pixel charge leaked per cycle', v: 'LTPS ' + Math.round(dropL * 100) + '% · oxide ' + (dropO * 100).toFixed(3) + '%', sub: 'Assuming 1 pA vs. 0.001 pA leakage and a 0.2 pF capacitor', c: '#0F2A3A' }
      ],
      rates: [1, 10, 30, 60, 90, 120].map(function (r3) { var q = pill(hz === r3); return { name: r3 + ' Hz', pressed: hz === r3 ? 'true' : 'false', bg: q.bg, fg: q.fg, border: q.border, pick: function () { self.setState({ hz: r3 }); } }; }),
      contents: Object.keys(contents).map(function (id) { var q = pill(s.content === id); return { name: contents[id].n + ' · needs ' + contents[id].need + ' Hz', pressed: s.content === id ? 'true' : 'false', bg: q.bg, fg: q.fg, border: q.border, pick: function () { self.setState({ content: id }); } }; }),
      pwms: [240, 480, 1920, 3840].map(function (p3) { var q = pill(s.pwm === p3); return { name: p3 + ' Hz', pressed: s.pwm === p3 ? 'true' : 'false', bg: q.bg, fg: q.fg, border: q.border, pick: function () { self.setState({ pwm: p3 }); } }; }),
      pwmTxt: 'Many OLED phones dim at low brightness by switching pixels on and off (PWM) at ' + pwmF + ' Hz with 100% modulation, ' + (pwmOk ? 'which is within IEEE 1789 because it is above 1,250 Hz' : 'outside the IEEE 1789 low-risk limit (≤ ' + pwmLim.toFixed(0) + '%), so some people get eye strain in the dark. Newer displays raise the PWM frequency or dim by lowering current instead'),
      pwmC: pwmOk ? '#0A4F70' : '#B04A0C',
      aria: 'Ball moving on a display refreshing at ' + hz + ' hertz'
    };

    return {
      px: px, rs: rs, yd: yd, steps: steps, dr: dr, wv: wv, env: env, tc: tc, rf: rf,
      newSheet: function () { self.setState({ seed: self.state.seed + 1 }); },
      dh: s.dh, setDh: function (e) { self.setState({ dh: parseFloat(e.target.value), trials: null }); },
      dcase: s.dcase, toggleCase: function () { self.setState({ dcase: !self.state.dcase, trials: null }); },
      drop1: function () { self._s = Math.floor(Math.random() * 1e9); self.setState({ dropT: 0, broke: Math.random() < Pf }); },
      drop100: function () { var n = 0; for (var k5 = 0; k5 < 100; k5++) if (Math.random() < Pf) n++; self.setState({ trials: n }); },
      trate: s.trate, setTrate: function (e) { self.setState({ trate: parseFloat(e.target.value) }); }
    };
  }
}
</script>
