<header style="display: flex; flex-direction: column; gap: 8px; max-width: 920px">
<div style="font-size: 14px; font-weight: 600; letter-spacing: 0.08em; color: #0A6A94">MATERIALS &amp; STRUCTURES LAB · MATERIALS TESTING</div>
<h1 style="margin: 0; font-size: clamp(30px, 4vw, 46px); line-height: 1.2; font-weight: 700">Pull, bend, crush until it breaks: what makes a material strong</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #4A5D6A">Aluminium, titanium, stainless steel and glass differ in strength because of their internal structure, and the toughness of a real part also depends on its surface, because most cracks start there. Engineers therefore heat-treat the bulk material, put the surface into permanent compression, and prove it with tension, bending, torsion and drop tests.</p>
</header>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 26px; font-weight: 700">1. The tensile testing machine: the stress–strain curve</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4A5D6A; max-width: 960px">A universal testing machine grips a dog-bone specimen and pulls it slowly, recording force and elongation the whole time. Stress = force ÷ cross-sectional area; strain = elongation ÷ original length. The first part is a straight line (elastic: it springs back when released), and its slope is Young’s modulus (E). Past the yield point the metal stretches permanently, getting stronger until it reaches its ultimate strength, then it necks in the middle and breaks. Glass breaks at once without any permanent stretch.</p>
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<div style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; overflow: hidden">

</svg>

<h2 style="margin: 0; font-size: 26px; font-weight: 700">2. Why glass breaks, and how surface compression helps</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4A5D6A; max-width: 960px">Glass does not break because the material is weak, but because of tiny surface cracks (from sand, rubbing or drops). When the glass bends, the convex surface is in tension and the crack tip sees a very high stress. If the stress intensity K = 1.12·σ·√(πa) exceeds the fracture toughness (K<sub>IC</sub>) the crack runs straight through. Putting the surface into permanent compression cancels the tension before it reaches the crack tip. This is done by quenching with cold air (tempered), by ion exchange, or with glass-ceramic whose nanocrystals block cracks.</p>
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<div style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; overflow: hidden">
<div style="display: flex; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid #E3E9EC; font-size: 14px; flex-wrap: wrap; gap: 8px"><span style="font-weight: 700">Stress vs. depth from the surface (thickness {{gl.tTxt}})</span><span style="font-family: 'IBM Plex Mono', monospace; color: {{gl.resC}}">{{gl.res}}</span></div>
<svg viewBox="0 0 900 340" style="display: block; width: 100%; height: auto; background: #FBFCFD" role="img" aria-label="{{gl.aria}}">
<rect x="70" y="20" width="800" height="{{gl.tensH}}" fill="#FCE3CF" opacity="0.45"></rect>
<rect x="70" y="{{gl.zeroY}}" width="800" height="{{gl.compH}}" fill="#DDEFF6" opacity="0.6"></rect>
<line x1="70" y1="{{gl.zeroY}}" x2="870" y2="{{gl.zeroY}}" stroke="#9AAAB4"></line>
<line x1="70" y1="20" x2="70" y2="300" stroke="#9AAAB4"></line>
<sc-for list="{{gl.ylab}}" as="t" hint-placeholder-count="5">
<text x="64" y="{{t.y}}" font-size="11" text-anchor="end" fill="#4A5D6A" font-family="IBM Plex Mono, monospace">{{t.v}}</text>
</sc-for>
<text x="76" y="34" font-size="11" fill="#7E3407">Tension (+)</text>
<text x="76" y="294" font-size="11" fill="#0A4F70">Compression (−)</text>
<path d="{{gl.crack}}" fill="#B04A0C" opacity="0.25"></path>

<text x="870" y="336" font-size="11" text-anchor="end" fill="#4A5D6A">Other surface</text>
</svg>
<div style="display: flex; flex-wrap: wrap; gap: 14px; padding: 0 16px 12px; font-size: 13px; font-weight: 600"><span style="color: #0A6A94">━ Residual stress from surface treatment</span><span style="color: #C99A1E">┅ Bending stress</span><span style="color: #0F2A3A">━ Total</span><span style="color: #B04A0C">▮ Crack</span></div>
</div>
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">

</div>
</sc-for>
</div>
</div>
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 600">Glass thickness</span>

<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #4A5D6A">The part is the anode in a sulfuric acid bath. Oxygen combines with aluminium into alumina, hard like a ceramic. Part of the oxide grows into the metal and part builds up outward, with pores running perpendicular to the surface. Dye soaks into the pores and is then sealed in, so it does not peel like paint. Thickness is estimated from the "720"rule: about 0.33 micrometres per (A/dm² × minute).</p>

    var bmax = 0, bl = Object.keys(treats).map(function (id) { var ok = tok(id), b = ok ? Math.max(0, breakS(id)) : 0; bmax = Math.max(bmax, b); return [id, ok, b]; });
    var gl = {
      tTxt: t + ' mm', res: fails ? 'Breaks' : 'Holds', resC: fails ? '#B04A0C' : '#0A6A94',
      tensH: 140, zeroY: 160, compH: 140,
      ylab: [1000, 500, 0, -500, -1000].map(function (v) { return { y: f1(gY(v) + 4), v: v }; }),
      crack: 'M70,22 h' + f1(crackW) + ' v276 h' + f1(-crackW) + ' z',
      app: 'M' + pApp.join(' L'), resid: 'M' + pRes.join(' L'), sum: 'M' + pSum.join(' L'),
      xTxt: 'Depth from the surface (0 to ' + t + ' mm) · orange band = crack depth ' + s.a + ' µm',
      aTxt: s.a + ' µm',
      bars: bl.map(function (q) { return { n: treats[q[0]].n, v: q[1] ? Math.round(q[2]) + ' MPa' : 'Not possible on glass this thin', w: q[1] ? Math.max(1, q[2] / Math.max(bmax, 1) * 100).toFixed(1) + '%' : '0%', c: q[0] === tr ? '#0A6A94' : '#9FD0E6' }; }),
      thick: Object.keys(thick).map(function (id) { var q = pill(s.thick === id); return { name: thick[id][1], pressed: s.thick === id ? 'true' : 'false', bg: q.bg, fg: q.fg, border: q.border, pick: function () { self.setState({ thick: id }); } }; }),
      treats: Object.keys(treats).map(function (id) { var ok = tok(id), q = pill(tr === id); return { name: treats[id].n + (ok ? '' : ' · needs 3 mm or thicker'), pressed: tr === id ? 'true' : 'false', bg: q.bg, fg: q.fg, border: q.border, dis: ok ? 'false' : 'true', op: ok ? 1 : 0.45, pick: function () { if (ok) self.setState({ treat: id }); } }; }),
      sliders: [
        { id: 'g-a', name: 'Surface crack depth', label: s.a + ' µm', min: 2, max: 200, step: 1, v: s.a, set: function (e) { self.setState({ a: parseFloat(e.target.value) }); } },
        { id: 'g-s', name: 'Bending stress at the surface (applied load)', label: sapp + ' MPa', min: 0, max: 1000, step: 10, v: sapp, set: function (e) { self.setState({ sapp: parseFloat(e.target.value) }); } }
      ],
      stats: [
        { k: 'K at the crack tip', v: Know.toFixed(2) + ' MPa√m', c: fails ? '#B04A0C' : '#0F2A3A' },
        { k: 'Fracture toughness K_IC', v: Kic.toFixed(2) + ' MPa√m', c: '#0F2A3A' },
        { k: 'Result', v: Know < 0 ? 'Crack squeezed shut' : fails ? 'Crack grows: breaks' : 'Crack does not grow', c: fails ? '#B04A0C' : '#0A6A94' }
      ],
      title: treats[tr].title, how: treats[tr].how,
      aria: 'Residual and bending stress vs. depth in glass ' + treats[tr].n + (fails ? ' Breaks' : ' Holds')
    };

    // ---------- 3a. anodize ----------
    var types = { II: { n: 'Type II decorative (bath about 20°C)', max: 30, hv: '≈ 200–350 HV' }, III: { n: 'Type III hard coat (bath near 0°C)', max: 110, hv: '≈ 400–500 HV' } };
    var TY = types[s.atype], raw = 0.33 * s.aj * s.at, th = TY.max * (1 - Math.exp(-raw / TY.max));
    var scl = Math.min(6, 100 / Math.max(th, 1)), inward = th * 0.5, outward = th - inward;
    var origY = 125, topY = origY - outward * scl, barY = origY + inward * scl, oxH = barY - topY;
    var pores = '', plines = '', pitch = s.atype === 'III' ? 16 : 12;
    for (var px = 26; px < 500; px += pitch) { pores += 'M' + px + ',' + f1(topY) + ' h4 v' + f1(oxH) + ' h-4 z '; plines += 'M' + (px - 3) + ',' + f1(topY) + ' V' + f1(barY) + ' '; }
    var dyes = { none: ['Undyed (silver)', '#E3E9EC'], black: ['Black', '#1B1F22'], blue: ['Blue', '#1F5FA8'], gold: ['Gold', '#C99A1E'], red: ['Red', '#B0321F'] };
    var an = {
      origY: origY - 1, origTY: f1(origY - 5), topY: f1(topY), oxH: f1(oxH), pores: pores, poreLines: plines,
      dye: dyes[s.adye][1], dyeO: s.adye === 'none' ? 0 : 0.85, sealO: s.aseal ? 1 : 0, barY: f1(barY), metY: f1(barY + 4), metH: f1(Math.max(10, 256 - barY - 4)), metTY: f1(Math.min(248, barY + 26)),
      oxTY: f1(Math.max(20, topY - 6)), oxTxt: 'Alumina layer ' + th.toFixed(1) + ' µm',
      types: Object.keys(types).map(function (id) { var q = pill(s.atype === id); return { name: types[id].n, pressed: s.atype === id ? 'true' : 'false', bg: q.bg, fg: q.fg, border: q.border, pick: function () { self.setState({ atype: id }); } }; }),
      sliders: [
        { id: 'a-j', name: 'Current density', label: s.aj.toFixed(1) + ' A/dm²', min: 0.5, max: 4, step: 0.1, v: s.aj, set: function (e) { self.setState({ aj: parseFloat(e.target.value) }); } },
        { id: 'a-t', name: 'Time in bath', label: s.at + ' min', min: 5, max: 120, step: 5, v: s.at, set: function (e) { self.setState({ at: parseFloat(e.target.value) }); } }
      ],
      dyes: Object.keys(dyes).map(function (id) { return { name: dyes[id][0], c: dyes[id][1], pressed: s.adye === id ? 'true' : 'false', border: s.adye === id ? '#B04A0C' : '#FFFFFF', pick: function () { self.setState({ adye: id }); } }; }),
      stats: [
        { k: 'Oxide thickness', v: th.toFixed(1) + ' µm', c: '#0F2A3A' },
        { k: 'Grown inward / built outward', v: inward.toFixed(1) + ' / ' + outward.toFixed(1) + ' µm', c: '#0F2A3A' },
        { k: 'Typical surface hardness', v: TY.hv, c: '#0F2A3A' },
        { k: 'Colour and stain resistance', v: s.aseal ? 'Durable' : 'Fades and stains', c: s.aseal ? '#0A6A94' : '#B04A0C' }
      ],
      aria: 'Cross-section of an anodized layer, thickness ' + th.toFixed(1) + ' µm'
    };
    if (raw > TY.max * 0.9 && s.atype === 'II') an.stats[0].v += ' (near the limit)';

    // ---------- 3b. diffusion bonding ----------
    var pairs = { titi: { n: 'Titanium + titanium (as in aircraft)', topN: 'Titanium', botN: 'Titanium', topC: '#7E3407', botC: '#C9A27E', Tmax: 1000 }, tial: { n: 'Titanium + aluminium (as in a phone frame)', topN: 'Titanium', botN: 'Aluminium', topC: '#7E3407', botC: '#B9C3C9', Tmax: 640 } };
    var PR = pairs[s.pair], TK = s.bT + 273, R = 8.314;
    var Qd = s.pair === 'tial' ? 140000 : 200000, D0 = s.pair === 'tial' ? 1e-5 : 5e-5;
    var D = D0 * Math.exp(-Qd / (R * TK)), xd = Math.sqrt(D * s.bt * 60) * 1e6;
    var Tref = s.pair === 'tial' ? 773 : 1173, cf = 1 - Math.exp(-3 * Math.pow(s.bP / 10, 1.5) * (s.bt / 60) * Math.exp(-160000 / R * (1 / TK - 1 / Tref)));
    var imT = s.pair === 'tial' ? 2.0 * Math.sqrt(s.bt / 60) * Math.exp(-180000 / (2 * R) * (1 / TK - 1 / 823)) : 0;
    var melt = s.pair === 'tial' && s.bT >= 600;
    var verdict, vC = '#B04A0C';
    if (melt) verdict = 'Close to aluminium’s melting point (660°C): the part softens and deforms';
    else if (cf < 0.9) verdict = 'Surfaces not yet fully in contact; gaps remain along the joint, so it will be weak. Increase pressure, temperature or time';
    else if (imT > 3) verdict = 'The brittle TiAl₃ compound layer is too thick; the joint may crack easily. Lower the temperature or time';
    else { verdict = 'Joint fully bonded into one piece'; vC = '#0A6A94'; }
    var voids = '', atomsA = '', atomsB = '', nV = Math.round((1 - cf) * 22);
    for (var v2 = 0; v2 < 22; v2++) { if (v2 < nV) { var vx = 34 + v2 * 21.5; voids += 'M' + vx + ',128 a8,3.5 0 1,0 16,0 a8,3.5 0 1,0 -16,0 '; } }
    var mix = Math.min(1, xd / 20);
    for (var ax2 = 0; ax2 < 24; ax2++) {
      var axx = 30 + ax2 * 19.5 + 4;
      atomsA += 'M' + axx + ',' + f1(128 + 6 + mix * 22 * ((ax2 * 7) % 5) / 4) + ' a3,3 0 1,0 6,0 a3,3 0 1,0 -6,0 ';
      atomsB += 'M' + (axx + 8) + ',' + f1(128 - 6 - mix * 22 * ((ax2 * 3) % 5) / 4) + ' a3,3 0 1,0 6,0 a3,3 0 1,0 -6,0 ';
    }
    var db = {
      topC: PR.topC, botC: melt ? '#E8B999' : PR.botC, topN: PR.topN, botN: PR.botN, topDot: '#C9A27E', botDot: '#7D8C96', voids: voids || 'M0,0', atomsA: atomsA, atomsB: atomsB,
      imY: f1(128 - Math.min(20, imT * 2) / 2), imH: f1(Math.min(20, imT * 2)), pTxt: 'Pressure ' + s.bP + ' MPa',
      pairs: Object.keys(pairs).map(function (id) { var q = pill(s.pair === id); return { name: pairs[id].n, pressed: s.pair === id ? 'true' : 'false', bg: q.bg, fg: q.fg, border: q.border, pick: function () { self.setState({ pair: id, bT: id === 'tial' ? 550 : 900 }); } }; }),
      sliders: [
        { id: 'b-T', name: 'Temperature', label: s.bT + ' °C', min: 400, max: PR.Tmax, step: 10, v: s.bT, set: function (e) { self.setState({ bT: parseFloat(e.target.value) }); } },
        { id: 'b-P', name: 'Pressure', label: s.bP + ' MPa', min: 1, max: 30, step: 1, v: s.bP, set: function (e) { self.setState({ bP: parseFloat(e.target.value) }); } },
        { id: 'b-t', name: 'Time', label: s.bt + ' min', min: 10, max: 240, step: 10, v: s.bt, set: function (e) { self.setState({ bt: parseFloat(e.target.value) }); } }
      ],
      stats: [
        { k: 'Area fully in contact', v: Math.round(cf * 100) + '%', c: cf < 0.9 ? '#B04A0C' : '#0F2A3A' },
        { k: 'Atomic diffusion distance √(D·t)', v: xd.toFixed(xd < 1 ? 2 : 1) + ' µm', c: '#0F2A3A' },
        { k: 'Brittle TiAl₃ compound layer', v: s.pair === 'tial' ? imT.toFixed(1) + ' µm' : 'None (same metal)', c: imT > 3 ? '#B04A0C' : '#0F2A3A' },
        { k: 'Diffusion coefficient D', v: D.toExponential(1) + ' m²/s', c: '#0F2A3A' }
      ],
      verdict: verdict, verdictC: vC,
      aria: 'Joint: ' + PR.n + ' in contact ' + Math.round(cf * 100) + ' percent'
    };

    // ---------- 3c. finishes ----------
    var fins = {
      polish: { n: 'Polished (Ra below 0.05 µm)', w: 4, rough: 0.3, title: 'Mirror polish', how: 'Polished with ever finer abrasives until the marks are smaller than light’s wavelength, so light reflects in one direction like a mirror. Fingerprints and scratches show clearly. Used on older stainless phone frames, watches and jewellery.' },
      brush: { n: 'Brushed', w: 18, rough: 2, title: 'Brushed finish', how: 'Abraded in one direction with a belt or brush, leaving fine parallel grooves that spread light into a streak perpendicular to them, hiding small scratches. Used on appliances, lifts and watch dials.' },
      bead: { n: 'Bead blasted', w: 55, rough: 5, title: 'Bead or sand blasting', how: 'Small glass or ceramic beads are fired at the surface with compressed air, leaving tiny random dimples that scatter light in all directions for a soft matte look that hides fingerprints. Many titanium and aluminium phone frames are blasted like this before anodizing or coating, and it also puts the surface into slight compression, like shot peening.' },
      pvd: { n: 'PVD coating (titanium nitride, etc.)', w: 10, rough: 0.6, title: 'Physical vapour deposition (PVD)', how: 'Metals or compounds such as titanium nitride are vaporized in vacuum and deposited as a layer a few micrometres thick, giving very hard gold, black or graphite colours. Used on watches, taps, drill bits and some stainless phone frames.' }
    };
    var FN = fins[s.fin], lobe = '', surf = 'M20,170 ';
    for (var sx2 = 20; sx2 <= 400; sx2 += 4) surf += 'L' + sx2 + ',' + f1(170 + FN.rough * Math.sin(sx2 * 1.7) * Math.sin(sx2 * 0.37)) + ' ';
    surf += 'L400,220 L20,220 Z';
    var spread = FN.w * Math.PI / 180, cAng = 45 * Math.PI / 180;
    lobe = 'M210,170 L' + f1(210 + 190 * Math.sin(cAng - spread)) + ',' + f1(170 - 190 * Math.cos(cAng - spread)) + ' A190,190 0 0,1 ' + f1(210 + 190 * Math.sin(Math.min(1.5, cAng + spread))) + ',' + f1(170 - 190 * Math.cos(Math.min(1.5, cAng + spread))) + ' Z';
    if (FN.w > 40) lobe = 'M210,170 L30,170 A180,180 0 0,1 390,170 Z';
    var fn = {
      lobe: lobe, surf: surf, specO: FN.w < 12 ? 1 : FN.w < 30 ? 0.5 : 0.1, title: FN.title, how: FN.how,
      list: Object.keys(fins).map(function (id) { var q = pill(s.fin === id); return { name: fins[id].n, pressed: s.fin === id ? 'true' : 'false', bg: q.bg, fg: q.fg, border: q.border, pick: function () { self.setState({ fin: id }); } }; }),
      aria: 'Light reflected from surface: ' + FN.n
    };

    var apps = [
      { c: '#0A6A94', t: 'Glass-ceramics', d: 'Electric and induction cooktops that survive rapid hot-cold cycles, fireplace windows, ceramic teeth and crowns (lithium disilicate), and telescope mirrors that barely expand when heated.' },
      { c: '#0A6A94', t: 'Ion-exchanged glass', d: 'Watch, tablet and laptop screens, car displays, ATMs, some cockpit windows, and injection vials that must not break in transit.' },
      { c: '#C99A1E', t: 'Tempered glass', d: 'Glass doors, shower screens, car side windows, glass tables and building façades (see the tall-building glass & structure page).' },
      { c: '#3F7A4F', t: 'Anodized aluminium', d: 'Laptops, cameras and lenses, aircraft and bicycle parts, hard-anodized pans, window frames and building cladding, torches and climbing gear.' },
      { c: '#7E3407', t: 'Titanium', d: 'Aircraft structures and engine blades, dental implants and joint replacements, watches, eyeglass frames and racing car parts.' },
      { c: '#7E3407', t: 'Joining dissimilar metals', d: 'Hollow titanium aircraft panels formed and diffusion-bonded together (SPF/DB), multi-ply cookware of stainless steel clad over aluminium or copper, and explosion-welded bimetal plates in chemical plants.' },
      { c: '#5A4A8C', t: 'Polished/matte/PVD stainless steel', d: 'Watches, medical instruments, kitchen and food-plant equipment, handrails, lifts, taps and decorative fins on tall-building façades.' },
      { c: '#B04A0C', t: 'Putting metal surfaces in compression (shot peening)', d: 'Gears, car springs, shafts, jet-engine blades and discs: small steel shot is fired at the surface to put it in compression, so fatigue cracks find it much harder to start. The same principle as strengthened glass.' }
    ];

    return {
      ts: ts, gl: gl, an: an, db: db, fn: fn, apps: apps,
      tsRun: function () { var mm = M[self.state.mat]; if (self.state.eps >= mm.ef) return; if (self.reduce) { self.setState({ eps: mm.ef * 1.0001, running: false }); return; } self.setState({ running: !self.state.running }); },
      tsReset: function () { self.setState({ eps: 0, running: false }); },
      setEps: function (e) { self.setState({ eps: parseFloat(e.target.value), running: false }); },
      aseal: s.aseal, toggleSeal: function () { self.setState({ aseal: !self.state.aseal }); }
    };
  }
}
