<div style="font-size: 14px; font-weight: 600; letter-spacing: 0.08em; color: #0A6A94">MATERIALS &amp; STRUCTURES LAB · TALL BUILDINGS</div>
<h1 style="margin: 0; font-size: clamp(30px, 4vw, 46px); line-height: 1.2; font-weight: 700">How tall buildings cope with wind, sway and heat</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #4A5D6A">The higher you go, the stronger the wind. The tower can sway, and the glass façade must handle wind pressure, suction, floors shifting relative to each other, and thermal expansion. This page simulates each principle, then looks at how the 828-metre Burj Khalifa used simulation, testing and purpose-designed materials.</p>
</header>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 26px; font-weight: 700">1. Wind gets stronger with height, so façade pressure varies</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4A5D6A; max-width: 960px">Near the ground, trees and buildings slow the wind; higher up it is faster, approximately V(z) = V₁₀·(z/10)^α. Wind pressure q = ½ρV² rises with the square of the speed. The windward face is pushed (about +0.8q), the back and sides are sucked outward, and at the corners suction can reach about 1.5q, so glass near the corners and on upper floors takes the most load.</p>

<h2 style="margin: 0; font-size: 26px; font-weight: 700">2. Vortices behind the tower and sway: why the Burj Khalifa is stepped</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4A5D6A; max-width: 960px">As wind passes a tower, vortices peel off alternately left and right (vortex shedding), pushing the tower sideways in rhythm at f = St·V/D. If this matches the tower’s natural frequency, the sway builds up like pushing a swing in time. A tower with the same cross-section all the way up sheds vortices in step along its whole height, while a tower that steps in has a different width D at each level, so the vortices shed out of step. The Burj Khalifa’s designers called this "confusing the wind" (confuse the wind)</p>

<h2 style="margin: 0; font-size: 26px; font-weight: 700">3. Glass panels under wind: how thick, and which glass?</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4A5D6A; max-width: 960px">A curtain wall does not carry the building’s weight, but it must resist wind and pass the load to the aluminium frame and each floor. A glass panel bends like a thin plate; the maximum stress is at the centre, σ ≈ β·q·b²/t², so it drops quickly as the glass gets thicker. Tall-building glass is usually insulated glass (two panes with an air gap), which shares the load and blocks heat. The panel in this example matches a typical Burj Khalifa panel, about 1.37 × 3.25 m.</p>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 26px; font-weight: 700">4. Towers move and heat up: the curtain wall must slide with them</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4A5D6A; max-width: 960px">When a tower sways, each floor shifts slightly relative to the one below (inter-story drift). Glass fixed rigidly to both floors would be racked until it broke. A unitized curtain wall therefore hangs each panel from one floor only and links it to its neighbours with slip joints that slide into each other (stack joints), sealed with gaskets. Heat makes the aluminium frame expand almost three times as much as the glass, so a gap is left around the glass and flexible gaskets or silicone are used.</p>
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">

<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4A5D6A; max-width: 960px">In short: computer simulation, wind tunnels and full-scale mock-ups, alternating with several rounds of reshaping. No new elements were invented, but the concrete mix, the glass and the construction methods were "tailor-made" for this tower and Dubai’s climate.</p>

      types: Object.keys(gtypes).map(function (id) { var qq = pill(s.gtype === id); return { name: gtypes[id].n, pressed: s.gtype === id ? 'true' : 'false', bg: qq.bg, fg: qq.fg, border: qq.border, pick: function () { self.setState({ gtype: id }); } }; }),
      sliders: [
        { id: 'g-q', name: 'Wind load on the panel', label: s.gq.toFixed(1) + ' kPa', min: 0.5, max: 6, step: 0.1, v: s.gq, set: function (e) { self.setState({ gq: parseFloat(e.target.value) }); } },
        { id: 'g-t', name: 'Thickness per pane', label: s.gt + ' mm', min: 4, max: 15, step: 1, v: s.gt, set: function (e) { self.setState({ gt: parseFloat(e.target.value) }); } }
      ],
      title: GT.title, how: GT.how,
      aria: 'Glass panel deflects ' + defLin.toFixed(0) + ' mm, stress ' + sigma.toFixed(1) + ' megapascals ' + (ok ? 'Pass' : 'fails')
    };

    // ---------- 4. movement ----------
    var fixes = { unit: 'Unitized wall: each panel hangs from one floor, linked by slip joints', rigid: 'Glass fixed rigidly to both the floor above and below' };
    var hS = 4.0, driftMM = hS * 1000 * s.drift / 1000, therm = 23e-6 * 3250 * s.dT, thermG = 9e-6 * 3250 * s.dT, joint = 15;
    var unit = s.fix === 'unit', exag = 6;
    var slabs = [], panels = [], joints = [];
    for (var fl = 0; fl < 4; fl++) { var off = (3 - fl) * driftMM / 1000 * exag * 50; slabs.push({ x: f1(60 + off), y: 20 + fl * 95 }); }
    var need = unit ? Math.max(driftMM, therm - thermG) : driftMM;
    var jOk = unit ? (driftMM <= joint && (therm - thermG) <= 6) : driftMM < 2;
    for (var fl2 = 0; fl2 < 3; fl2++) {
      var topOff = (3 - fl2) * driftMM / 1000 * exag * 50, botOff = (2 - fl2) * driftMM / 1000 * exag * 50, y0 = 32 + fl2 * 95, y1 = y0 + 83;
      for (var pc = 0; pc < 3; pc++) {
        var x0 = 70 + pc * 95, d;
        if (unit) d = 'M' + f1(x0 + topOff) + ',' + y0 + ' h88 v83 h-88 z';      // hangs from the slab above, moves as a rigid block
        else d = 'M' + f1(x0 + topOff) + ',' + y0 + ' h88 L' + f1(x0 + 88 + botOff) + ',' + y1 + ' h-88 z';  // racked
        panels.push({ d: d, f: '#BFE0EE', s: unit ? '#0A6A94' : (jOk ? '#0A6A94' : '#B04A0C') });
        if (unit) joints.push({ x: f1(x0 + 44 + botOff), y: y1 + 6, c: jOk ? '#3F7A4F' : '#B04A0C' });
      }
    }
    if (!unit) joints = [{ x: -20, y: -20, c: '#000' }];
    var mv = {
      slabs: slabs, panels: panels, joints: joints,
      stats: [
        { k: 'Upper floor shift relative to the one below', v: driftMM.toFixed(1) + ' mm', sub: 'Story height 4 m × drift ' + s.drift + '/1000', c: '#0F2A3A' },
        { k: 'Aluminium frame expansion (3.25 m tall panel)', v: therm.toFixed(1) + ' mm', sub: 'ΔL = α·L·ΔT, α = 23×10⁻⁶ /°C', c: '#0F2A3A' },
        { k: 'Glass expansion', v: thermG.toFixed(1) + ' mm', sub: 'α ≈ 9×10⁻⁶ /°C, a difference of ' + (therm - thermG).toFixed(1) + ' mm, so a gap is needed around the glass', c: '#0F2A3A' },
        { k: 'Effect on the glass', v: unit ? (jOk ? 'Slip joints accommodate it' : 'Beyond the joint’s range') : (jOk ? 'Still tolerable' : 'Glass racked, risk of breakage'), sub: unit ? 'Assuming joints slide ±' + joint + ' mm and 6 mm clearance around the glass' : 'The panel is forced to skew with the two floors', c: jOk ? '#0A6A94' : '#B04A0C' },
        { k: 'Frame surface temperature used', v: (25 + s.dT) + ' °C', sub: 'Assuming installation at 25°C; metal in the sun gets much hotter than the air', c: '#0F2A3A' }
      ],
      fixes: Object.keys(fixes).map(function (id) { var qq = pill(s.fix === id); return { name: fixes[id], pressed: s.fix === id ? 'true' : 'false', bg: qq.bg, fg: qq.fg, border: qq.border, pick: function () { self.setState({ fix: id }); } }; }),
      sliders: [
        { id: 'm-d', name: 'Inter-story drift', label: s.drift + '/1000', min: 0.5, max: 5, step: 0.5, v: s.drift, set: function (e) { self.setState({ drift: parseFloat(e.target.value) }); } },
        { id: 'm-t', name: 'Temperature rise since installation', label: '+' + s.dT + ' °C', min: 0, max: 60, step: 5, v: s.dT, set: function (e) { self.setState({ dT: parseFloat(e.target.value) }); } }
      ],
      aria: 'Three-storey curtain wall, floors shifting by ' + driftMM.toFixed(1) + ' millimetres'
    };

    var bk = [
      { c: '#0A6A94', tag: 'Wind tunnel', t: 'Scale model with a thousand sensors', d: 'Wind engineering firm RWDI tested models in the wind tunnel many times. The cladding-pressure model was 1:500 scale, about 1.5 m tall, with more than 1,000 pressure sensors. The results set the design load for each zone of glass panels (about 110 pounds per square foot, or 5.3 kPa, in both pressure and suction).' },
      { c: '#0A6A94', tag: 'Reshaping from test results', t: 'Step back, rotate, test again', d: 'SOM added setbacks and reoriented the tower to handle the most frequent strong winds better. As a result, even though the tower became much taller than the first design (from about 518 to 828 m), the wind loads at the foundation stayed close to the original.' },
      { c: '#3F7A4F', tag: 'Computer simulation', t: 'Finite-element model of the whole tower', d: 'Every tall building gets a finite-element model of its whole structure to compute natural frequencies, deflection under wind and earthquakes, long-term concrete shortening (creep and shrinkage) and settlement, checked against the wind-tunnel results. CFD (computational fluid dynamics) helps study wind around the tower and at pedestrian level.' },
      { c: '#3F7A4F', tag: 'Structure of', t: 'Hexagonal core buttressed by three wings', d: 'The central core is a hexagon that is stiff against twisting, buttressed by the three wings of the Y plan, like the buttresses of a Gothic cathedral. The three wings work together to resist wind from every direction.' },
      { c: '#C99A1E', tag: 'Project-specific materials', t: 'High-strength concrete pumped more than 600 m up', d: 'High-strength concrete with a mix designed to flow a long way without separating. Pours were made only at night because daytime was too hot, with ice flakes added to keep the mix cool, using an extra-high-pressure pump built for this project. It set a vertical concrete pumping record of 606 m in 2008.' },
      { c: '#C99A1E', tag: 'Foundations', t: 'Concrete raft on 194 piles', d: 'The tower stands on a concrete raft supported by 194 concrete piles, each about 45 m deep, reaching a naturally cemented soft rock beneath the sand. The whole tower settled only about 50 mm.' },
      { c: '#B04A0C', tag: 'Curtain wall', t: 'About 28,000 unitized panels', d: 'Double-glazed panels in extruded aluminium frames, with a reflective coating that lets through about 20% of visible light and about 15% of solar energy to cope with the Dubai sun. Spearhead-shaped stainless steel fins cover the vertical joints. The panels are flat glass set at angles to look curved, because curved glass was over budget.' },
      { c: '#B04A0C', tag: 'Full-scale testing', t: 'Three full-scale mock-ups', d: 'The client commissioned three full-scale wall mock-ups early in the project to test water and air leakage, wind load and movement before production. For cleaning, automated window-washing machines are stored at several levels, and the façade has no horizontal ledges for dust to collect on.' }
    ];

    return {
      wd: wd, vx: vx, gp: gp, mv: mv, bk: bk,
      v10: s.v10, setV10: function (e) { self.setState({ v10: parseFloat(e.target.value) }); },
      vtop: s.vtop, setVtop: function (e) { self.setState({ vtop: parseFloat(e.target.value) }); },
      tmd: s.tmd, toggleTmd: function () { self.setState({ tmd: !self.state.tmd }); },
      igu: s.igu, toggleIgu: function () { self.setState({ igu: !self.state.igu }); }
    };
  }
}
</script>
</body>
