<h1 style="margin: 0; font-size: clamp(30px, 4vw, 46px); line-height: 1.2; font-weight: 700">Water in pipes: water pressure in a condo, and coolant loops</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #4A5D6A">Still water gains pressure with depth, P = ρ·g·h. Water flowing in a pipe loses pressure to friction, and the faster it flows the more it loses. Every pump must be matched to its pipes, or the flow will be too low or the power wasted</p>
</header>

<h2 style="margin: 0; font-size: 26px; font-weight: 700">2. Coolant loops: pumps, pipes and the heat carried away</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4A5D6A; max-width: 960px">Every pump has its own curve: the harder it has to push, the less water flows. The pipes have a system curve: the faster the water flows, the more resistance. Where the two curves cross is the real flow rate, and that flow rate decides how much the water heats up as it carries heat away from the machine</p>

    }[id];
  }

  loopCalc(s) {
    var sc = this.scenarios()[s.scen], F = this.fluidProps(s.fluid), g = 9.81, D = s.D / 1000, A = Math.PI * D * D / 4;
    var friction = function (Re) { if (Re < 2300) return 64 / Math.max(Re, 1); var e = 0.0000015 / D; return 0.25 / Math.pow(Math.log10(e / 3.7 + 5.74 / Math.pow(Re, 0.9)), 2); };
    var sysH = function (Q) { var v = Q / A, Re = F.rho * v * D / F.mu; return (friction(Re) * s.L / D + sc.K) * v * v / (2 * g); };
    var pumpH = function (Q) { return sc.H0 * s.n * s.n * (1 - Math.pow(Q / (sc.Qmax * s.n), 2)); };
    var lo = 0, hi = sc.Qmax * s.n;
    for (var i = 0; i < 60; i++) { var mid = (lo + hi) / 2; if (pumpH(mid) > sysH(mid)) lo = mid; else hi = mid; }
    var Q = lo, H = pumpH(Q), v = Q / A, Re = F.rho * v * D / F.mu, mdot = F.rho * Q;
    var dT = s.heat * 1000 / Math.max(mdot * F.cp, 1e-6);
    var Pw = F.rho * g * Q * H / 0.55;
    return { sc: sc, F: F, Q: Q, H: H, v: v, Re: Re, dT: dT, Pw: Pw, dP: F.rho * g * H, pumpH: pumpH, sysH: sysH };
  }

  renderVals() {
    var self = this, s = this.state;
    var f1 = function (v) { return (+v).toFixed(1); };
    var pill = function (on) { return on ? { bg: '#0A6A94', fg: '#FFFFFF', border: '#0A6A94' } : { bg: '#FFFFFF', fg: '#0F2A3A', border: '#C9D4DA' }; };

    // ---------- condo water ----------
    var N = s.N, FH = 3.2, topY = 30, bH = 330, rowH = bH / N, g = 9.81, rho = 997;
    var hTop = N * FH + 4;                       // roof tank water level (m)
    var zoneTops = [];
    if (s.mode === 'zone') { for (var zt = s.zone; zt < N; zt += s.zone) zoneTops.push(zt); zoneTops.push(N); }
    var pAt = function (i) {                      // floor i (1 = ground), tap 1 m above floor
      var h = (i - 1) * FH + 1;
      if (s.mode === 'booster') return 3.0 + 0.3 - 0.012 * (i - 1);   // pressure-controlled pump with a PRV at each zone
      var src = hTop;
      if (s.mode === 'zone') { var z = zoneTops.find(function (t) { return t >= i; }); src = z * FH + 4; }
      var loss = 0.004 * (src - h);              // friction at peak hour ≈ 0.4% of the head per metre
      return Math.max(0, rho * g * (src - h) * (1 - 0.04) / 1e5 - loss);
    };
    var floors = [], pMin = 99, pMax = 0, nLow = 0, nHigh = 0;
    var px = function (p) { return 360 + Math.min(p, 10) / 10 * 500; };
    for (var i = 1; i <= N; i++) {
      var p = pAt(i); pMin = Math.min(pMin, p); pMax = Math.max(pMax, p);
      if (p < 1) nLow++; if (p > 4) nHigh++;
      var y = topY + bH - i * rowH;
      floors.push({ y: f1(y + 0.5), h: f1(Math.max(1, rowH - 1)), w: f1(Math.max(1, px(p) - 360)), c: p < 1 ? '#F5C77A' : p > 4 ? '#E07A5F' : '#7FBF9A', ty: f1(y + rowH / 2 + 3), lab: (i === 1 || i % 5 === 0) ? 'floors ' + i : '' });
    }
    var tanks = [];
    if (s.mode === 'roof') tanks.push({ y: f1(topY - 24), ty: f1(topY - 9), t: 'Roof water tank' });
    if (s.mode === 'zone') zoneTops.forEach(function (zt) { var y = topY + bH - zt * rowH; tanks.push({ y: f1(y - 22), ty: f1(y - 7), t: zt === N ? 'Roof tank' : 'Mid tank, floor ' + zt }); });
    if (s.mode === 'booster') tanks.push({ y: f1(topY + bH - 26), ty: f1(topY + bH - 11), t: 'Pressure-controlled pump' });
    var drops = '';
    for (var k = 0; k < 8; k++) { var yy = 380 - ((s.t * 60 + k * bH / 8) % bH); drops += 'M326,' + f1(yy) + ' a4,4 0 1,0 8,0 a4,4 0 1,0 -8,0 '; }
    var people = N * s.units * 2, vol = people * s.use / 1000;                // m³/day
    var Elift = rho * g * vol * (s.mode === 'zone' ? hTop * 0.75 : hTop) / 0.6 / 3.6e6;   // kWh/day
    var modes = [
      { id: 'roof', name: 'Single roof tank (gravity)' },
      { id: 'zone', name: 'Zoned, with mid-building tanks' },
      { id: 'booster', name: 'Automatic booster pump' }
    ];
    var wmsg = s.mode === 'roof' ? (nHigh > 0 ? 'With a single roof tank, the lowest ' + nHigh + ' floors get more than 4 bar, wearing out taps and hoses quickly, while the top floors near the tank only trickle. Tall buildings are therefore zoned or fitted with pressure-reducing valves (PRV)' : 'The building is low enough for a single roof tank, but the top floors near the tank trickle and usually need a booster pump just for them')
      : s.mode === 'zone' ? 'Split into zones of ' + s.zone + ' floors, each fed from its own tank, so pressure never builds up too high. Floors just below each tank are still weak, so a small pump usually helps the top 2–3 floors of each zone'
      : 'The pump adjusts its speed to the measured pressure, giving similar pressure on every floor without a roof tank. But it needs power all the time and a standby pump; in a power cut the water stops immediately';
    var wt = {
      topY: topY, bH: bH, floors: floors, tanks: tanks, drops: drops, x1bar: f1(px(1)), x4bar: f1(px(4)), labY: topY - 10,
      stats: [
        { k: 'Lowest pressure', v: pMin.toFixed(2) + ' bar', sub: nLow + ' floors below 1 bar', c: nLow ? '#B04A0C' : '#0F2A3A' },
        { k: 'Highest pressure', v: pMax.toFixed(2) + ' bar', sub: nHigh + ' floors above 4 bar', c: nHigh ? '#B04A0C' : '#0F2A3A' },
        { k: 'Water used per day', v: Math.round(vol).toLocaleString('en-US') + ' m³', sub: people.toLocaleString('en-US') + ' people × ' + s.use + ' litres', c: '#0F2A3A' },
        { k: 'Electricity to pump water up', v: Math.round(Elift).toLocaleString('en-US') + ' units/day', sub: 'ρ·g·V·H / η (pump efficiency 60%)', c: '#0F2A3A' }
      ],
      msg: wmsg,
      modes: modes.map(function (m) { var q = pill(s.mode === m.id); return { name: m.name, pressed: s.mode === m.id ? 'true' : 'false', bg: q.bg, fg: q.fg, border: q.border, pick: function () { self.setState({ mode: m.id }); } }; }),
      sliders: [
        { id: 'w-n', name: 'Number of floors', label: s.N + ' floors', min: 4, max: 60, step: 1, v: s.N, set: function (e) { self.setState({ N: parseInt(e.target.value, 10) }); } },
        { id: 'w-z', name: 'Floors per zone (if zoned)', label: s.zone + ' floors', min: 6, max: 20, step: 1, v: s.zone, set: function (e) { self.setState({ zone: parseInt(e.target.value, 10) }); } },
        { id: 'w-u', name: 'Units per floor', label: s.units + ' units', min: 2, max: 30, step: 1, v: s.units, set: function (e) { self.setState({ units: parseInt(e.target.value, 10) }); } },
        { id: 'w-c', name: 'Water per person per day', label: s.use + ' litres', min: 100, max: 300, step: 10, v: s.use, set: function (e) { self.setState({ use: parseFloat(e.target.value) }); } }
      ],
      aria: 'Condo, ' + N + ' floors, water pressure ' + pMin.toFixed(1) + ' to ' + pMax.toFixed(1) + ' bar'
    };

    // ---------- cooling loop ----------
    var C = this.loopCalc(s), sc = C.sc;
    var qUnit = s.scen === 'bldg' ? 1000 : 60000, qLab = s.scen === 'bldg' ? 'L/s' : 'L/min';
    var qMax = sc.Qmax * 1.05, hMax = sc.H0 * 1.1;
    var GX = function (q) { return 50 + 350 * q / qMax; }, GY = function (h) { return 220 - 200 * Math.min(h, hMax) / hMax; };
    var pc = [], sy = [];
    for (var j = 0; j <= 40; j++) { var q = qMax * j / 40, hp = C.pumpH(q); if (hp >= 0) pc.push(f1(GX(q)) + ',' + f1(GY(hp))); if (C.sysH(q) <= hMax) sy.push(f1(GX(q)) + ',' + f1(GY(C.sysH(q)))); }
    var loopPath = [[70, 200], [70, 60], [350, 60], [350, 200], [70, 200]], plen = [], tot = 0;
    for (var m = 1; m < loopPath.length; m++) { var dd = Math.hypot(loopPath[m][0] - loopPath[m - 1][0], loopPath[m][1] - loopPath[m - 1][1]); plen.push(dd); tot += dd; }
    var spd = Math.min(220, 20 + 60 * C.v), cold = '', hotD = '';
    for (var o = 0; o < 22; o++) {
      var u = (s.t * spd + o * tot / 22) % tot, sg = 0; while (u > plen[sg]) { u -= plen[sg]; sg++; }
      var p0 = loopPath[sg], p1 = loopPath[sg + 1], fr = u / plen[sg], xx = p0[0] + (p1[0] - p0[0]) * fr, yv = p0[1] + (p1[1] - p0[1]) * fr;
      var dot = 'M' + f1(xx - 4) + ',' + f1(yv) + ' a4,4 0 1,0 8,0 a4,4 0 1,0 -8,0 ';
      if (sg === 1 || (sg === 2 && fr < 0.7)) hotD += dot; else cold += dot;   // hot from the source (left) to the radiator (right)
    }
    var imp = ''; var a = s.t * (4 + 20 * s.n); for (var b = 0; b < 3; b++) { var th = a + b * 2.094; imp += 'M210,200 L' + f1(210 + 13 * Math.cos(th)) + ',' + f1(200 + 13 * Math.sin(th)) + ' '; }
    var Tin = 30, regime = C.Re < 2300 ? 'Laminar flow' : C.Re < 4000 ? 'Transitional' : 'Turbulent flow';
    var issues = [];
    if (C.dT > 15) issues.push('Water heats up by ' + C.dT.toFixed(1) + ' °C, too much: the flow is too low to carry the heat, and the chip or coil at the end will overheat. Try a faster pump or a bigger pipe');
    if (C.v > 3) issues.push('Water in the pipe moves at ' + C.v.toFixed(1) + ' m/s; above about 3 m/s it is noisy, erodes the pipe and wastes pressure. Use a bigger pipe');
    if (C.Re < 2300) issues.push('Smooth laminar flow transfers heat to the wall poorly');
    var clMsg = issues.length ? issues.join(' · ') : 'The system is well balanced: the water heats up by ' + C.dT.toFixed(1) + ' °C while picking up heat and the pipe velocity is in a good range. Try lowering the pump speed and see how the pump’s power drops much faster than the flow rate';
    var cl = {
      pipeW: f1(Math.max(4, Math.min(14, s.D / sc.dMax * 14))), dots: cold, dotC: '#0A6A94', hotDots: hotD, impeller: imp,
      srcName: sc.src, srcP: s.heat >= 1000 ? (s.heat / 1000).toFixed(2) + ' MW' : s.heat + ' kW', sinkName: sc.sink,
      tHot: (Tin + C.dT).toFixed(1) + ' °C', tCold: Tin + ' °C',
      pumpC: 'M' + pc.join(' L'), sysC: sy.length > 1 ? 'M' + sy.join(' L') : 'M0,0', opX: f1(GX(C.Q)), opY: f1(GY(C.H)),
      qAxis: 'Flow rate (' + qLab + ')', hAxis: 'Pump head (m of water)', hMax: hMax.toFixed(0), qMax: (qMax * qUnit).toFixed(qUnit === 1000 ? 0 : 0),
      stats: [
        { k: 'Flow rate', v: (C.Q * qUnit).toFixed(1) + ' ' + qLab, sub: 'Where the pump curve meets the system curve', c: '#0F2A3A' },
        { k: 'Velocity in the pipe', v: C.v.toFixed(2) + ' m/s', sub: 'Re = ' + Math.round(C.Re).toLocaleString('en-US') + ' · ' + regime, c: C.v > 3 ? '#B04A0C' : '#0F2A3A' },
        { k: 'Pressure the pump must provide', v: (C.dP / 1e5).toFixed(2) + ' bar', sub: C.H.toFixed(1) + ' m of water', c: '#0F2A3A' },
        { k: 'Water temperature rise ΔT', v: C.dT.toFixed(1) + ' °C', sub: 'ΔT = P / (ṁ·c_p)', c: C.dT > 15 ? '#B04A0C' : '#0F2A3A' },
        { k: 'Pump electricity', v: C.Pw >= 1000 ? (C.Pw / 1000).toFixed(2) + ' kW' : C.Pw.toFixed(1) + ' W', sub: 'Assuming 55% pump efficiency', c: '#0F2A3A' },
        { k: 'Pump power as a share of heat', v: (C.Pw / (s.heat * 1000) * 100).toFixed(2) + '%', sub: 'The lower, the more efficient', c: '#0F2A3A' }
      ],
      msg: clMsg, msgBg: issues.length ? '#FFF1CC' : '#EAF3F7', msgFg: issues.length ? '#6B4A00' : '#0F2A3A',
      scen: Object.keys(this.scenarios()).map(function (id) { var z = self.scenarios()[id], q = pill(s.scen === id); return { name: z.name, pressed: s.scen === id ? 'true' : 'false', bg: q.bg, fg: q.fg, border: q.border, pick: function () { self.setState({ scen: id, D: z.D, L: z.L, heat: z.heat, n: 0.8 }); } }; }),
      fluids: ['water', 'glycol', 'oil'].map(function (id) { var q = pill(s.fluid === id); return { name: self.fluidProps(id).name, pressed: s.fluid === id ? 'true' : 'false', bg: q.bg, fg: q.fg, border: q.border, pick: function () { self.setState({ fluid: id }); } }; }),
      sliders: [
        { id: 'p-n', name: 'Pump speed', label: Math.round(s.n * 100) + '%', min: 0.3, max: 1, step: 0.05, v: s.n, set: function (e) { self.setState({ n: parseFloat(e.target.value) }); } },
        { id: 'p-d', name: 'Pipe size', label: s.D + ' mm', min: sc.dMin, max: sc.dMax, step: 1, v: s.D, set: function (e) { self.setState({ D: parseFloat(e.target.value) }); } },
        { id: 'p-l', name: 'Total pipe length', label: s.L + ' m', min: 1, max: sc.lMax, step: 1, v: s.L, set: function (e) { self.setState({ L: parseFloat(e.target.value) }); } },
        { id: 'p-h', name: 'Heat to carry away', label: s.heat >= 1000 ? (s.heat / 1000).toFixed(2) + ' MW' : s.heat + ' kW', min: sc.hMin, max: sc.hMax, step: sc.hMin, v: s.heat, set: function (e) { self.setState({ heat: parseFloat(e.target.value) }); } }
      ],
      aria: 'Coolant loop, flow rate ' + (C.Q * qUnit).toFixed(1) + ' ' + qLab + ' Water heats up by ' + C.dT.toFixed(1) + ' degrees'
    };
    return { wt: wt, cl: cl };
  }
}
</script>
</body>
</html>
