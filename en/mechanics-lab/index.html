<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #4A5D6A">Moments, rotation, centripetal force and buoyancy, as in a physics lab, but with unlimited adjustment on a backhoe and a cargo ship. Every number is calculated directly from Physics 1 formulas</p>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 26px; font-weight: 700">1. Backhoe: moments, tipping and slewing</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4A5D6A; max-width: 920px">A load in the bucket far out creates a moment (force × distance) about the front edge of the tracks. If this moment is larger than the moment of the machine body and its rear counterweight, the machine tips over. When the upper body slews, the load in the bucket needs a centripetal force F = mω²r; the farther out and the faster it turns, the larger the force</p>
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<div style="flex: 999 1 620px; min-width: 0; display: flex; flex-direction: column; gap: 14px">

<rect x="176" y="268" width="140" height="38" rx="4" fill="#F5C77A" stroke="#0F2A3A" stroke-width="2"></rect>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 26px; font-weight: 700">2. Container ship: buoyancy and stability</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4A5D6A; max-width: 920px">A ship floats because the buoyant force equals the weight of the water it displaces (Archimedes’ principle). The more it carries, the deeper it sits. Whether it stays upright depends on where G (centre of gravity) is compared with M (metacentre). If G is above M, the ship capsizes, so stacking containers high always needs calculation</p>
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<div style="flex: 999 1 620px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; overflow: hidden">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid #E3E9EC; flex-wrap: wrap">
<span style="font-weight: 700">Midship cross-section</span>
<span style="font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: 999px; background: {{sh.bg}}; color: {{sh.fg}}">{{sh.badge}}</span>
</div>
<svg viewBox="0 0 720 400" style="display: block; width: 100%; height: auto; background: #DCEBF2" role="img" aria-label="{{sh.aria}}">
<g transform="{{sh.rot}}">
<path d="{{sh.hull}}" fill="#0F2A3A"></path>

<circle cx="360" cy="{{sh.mY}}" r="6" fill="#F5C77A" stroke="#0F2A3A" stroke-width="1.5"></circle>
<text x="374" y="{{sh.mY}}" font-size="15" font-weight="700" fill="#FFC79A" stroke="#0F2A3A" stroke-width="0.6" dy="5">M</text>
</g>
<rect x="0" y="{{sh.wl}}" width="720" height="{{sh.wh}}" fill="#2580AD" opacity="0.55"></rect>
<line x1="0" y1="{{sh.wl}}" x2="720" y2="{{sh.wl}}" stroke="#0A4F70" stroke-width="2"></line>

</svg>

<span><strong style="color: #B04A0C">G</strong> Centre of gravity of ship and cargo</span>
<span><strong style="color: #0A4F70">B</strong> Centre of buoyancy (moves with the displaced water)</span>
<span><strong style="color: #6B4A00">M</strong> Metacentre, must be above G</span>
</div>
</div>

<sc-for list="{{sh.rows}}" as="r" hint-placeholder-count="6">
<div style="flex: 1 1 190px; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 13px; font-weight: 600; color: #4A5D6A">{{r.k}}</div>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 20px; color: {{r.color}}">{{r.v}}</div>
<div style="font-size: 13px; line-height: 1.5; color: #4A5D6A">{{r.sub}}</div>
</div>
</sc-for>
</div>
</div>

<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 14px">

<h3 style="margin: 0; font-size: 17px; font-weight: 700">Cargo loading</h3>
<div style="display: flex; flex-direction: column; gap: 2px">

<input id="sh-c" type="range" min="4" max="28" step="1" value="{{boxT}}" onChange="{{setBoxT}}">
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; justify-content: space-between"><label for="sh-b" style="font-size: 14px; font-weight: 600">Ballast water in the bottom</label><span style="font-family: 'IBM Plex Mono', monospace; color: #0A6A94">{{sh.bLabel}}</span></div>

</div>
<div style="display: flex; flex-direction: column; gap: 2px">

<input id="sh-w" type="range" min="0" max="45" step="1" value="{{wind}}" onChange="{{setWind}}">
</div>

<button type="button" onClick="{{x.pick}}" aria-pressed="{{x.pressed}}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid {{x.border}}; background: {{x.bg}}; color: {{x.fg}}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{x.name}}</button>
</sc-for>
</div>
</div>
<div style="background: #0F2A3A; color: #FFFFFF; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: #9FD0E6">Formulas used</div>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; line-height: 1.8">Δ = ρ · L · B · T<br>KB = T/2 · BM = B² / (12T)<br>GM = KB + BM − KG<br>tan φ ≈ M_wind / (Δ · g · GM)</div>
<p style="margin: 0; font-size: 14px; line-height: 1.65; color: #D9E8EF">Try adding deck containers until GM is low, then add ballast water. The weight at the bottom pulls G down and the ship stands upright again</p>
</div>
</div>
</div>
</section>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":2000}}'>
class Component extends DCLogic {
  constructor() {
    super(...arguments);
    var reduce = false;
    try { reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) {}
    this.state = { a1: 20, a2: -90, load: 1500, rpm: 4, t: 0, playing: !reduce, tiers: 4, boxT: 14, ballast: 8000, wind: 15, water: 'sea' };
  }

  componentDidMount() {
    var self = this;
    this._alive = true;
    this._last = null;
    var loop = function (now) {
      if (!self._alive) return;
      if (self._last === null) self._last = now;
      var dt = Math.min((now - self._last) / 1000, 0.1);
      self._last = now;
      if (self.state.playing && self.state.rpm > 0) self.setState({ t: self.state.t + dt });
      self._raf = requestAnimationFrame(loop);
    };
    this._raf = requestAnimationFrame(loop);
  }

  componentWillUnmount() {
    this._alive = false;
    if (this._raf) cancelAnimationFrame(this._raf);
  }

  setter(k) { var self = this; return function (e) { var o = {}; o[k] = parseFloat(e.target.value); self.setState(o); }; }

  renderVals() {
    var self = this, s = this.state, PI = Math.PI, g = 9.81;
    var f1 = function (v) { return v.toFixed(1); };
    var fmt = function (v, d) { return v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }); };

    // ---------- excavator (metres; origin at slew axis on the ground; +x = forward) ----------
    var SC = 40, X0 = 240, Y0 = 330;
    var P = function (x, y) { return [X0 + x * SC, Y0 - y * SC]; };
    var pv = [0.6, 2.0], L1 = 5.7, L2 = 2.9, LB = 1.2;
    var a1 = s.a1 * PI / 180, a2 = a1 + s.a2 * PI / 180;
    var bt = [pv[0] + L1 * Math.cos(a1), pv[1] + L1 * Math.sin(a1)];
    var st = [bt[0] + L2 * Math.cos(a2), bt[1] + L2 * Math.sin(a2)];
    var a3 = a2 - 1.1;
    var bk = [st[0] + LB * Math.cos(a3), st[1] + LB * Math.sin(a3)];
    var masses = [
      { m: 16500, x: -0.7 },                                   // tracks, upper body and counterweight
      { m: 1700, x: (pv[0] + bt[0]) / 2 },                     // boom
      { m: 900, x: (bt[0] + st[0]) / 2 },                      // stick
      { m: 700, x: (st[0] + bk[0]) / 2 },                      // bucket
      { m: s.load, x: (st[0] + bk[0]) / 2 }                    // load
    ];
    var M = 0, Mx = 0;
    masses.forEach(function (q) { M += q.m; Mx += q.m * q.x; });
    var com = Mx / M, edge = 1.8;
    var stab = 0, over = 0;
    masses.forEach(function (q) { var arm = edge - q.x; if (arm > 0) stab += q.m * arm; else over += q.m * (-arm); });
    var sf = over > 0 ? stab / over : Infinity;
    var lx = masses[4].x;
    var tipLoad = lx > edge ? (masses.slice(0, 4).reduce(function (a, q) { return a + q.m * (edge - q.x); }, 0)) / (lx - edge) : Infinity;
    var rated = tipLoad * 0.75;
    // torque about the boom foot pin from boom, stick, bucket and load
    var tq = 0;
    masses.slice(1).forEach(function (q) { tq += q.m * g * (q.x - pv[0]); });
    var cyl = Math.abs(tq) / 0.9, area = PI * 0.07 * 0.07, press = cyl / area / 1e6;
    // slewing
    var w = s.rpm * 2 * PI / 60, r = Math.max(0.5, lx), Fc = s.load * w * w * r;
    var tipping = com > edge;
    var tilt = tipping ? 'rotate(' + f1(Math.min(14, (com - edge) * 6)) + ' ' + (X0 + edge * SC) + ' ' + Y0 + ')' : 'rotate(0)';
    var pp = function (a) { var q = P(a[0], a[1]); return f1(q[0]) + ',' + f1(q[1]); };
    var lp = P((st[0] + bk[0]) / 2, (st[1] + bk[1]) / 2), lw = Math.min(26, 6 + s.load / 220);
    var bucketPath = 'M' + pp(st) + ' L' + pp(bk) + ' L' + pp([bk[0] - 0.5 * Math.cos(a2), bk[1] - 0.5 * Math.sin(a2)]) + ' Z';
    var arrowTop = P(lx, (st[1] + bk[1]) / 2), aLen = Math.min(90, 12 + s.load / 60);
    var ang = (s.t * w * 180 / PI) % 360, rTop = Math.min(95, 10 + r * 10);
    var fcLen = Math.min(60, 8 + Fc / 400);
    var ex = {
      boom: 'M' + pp(pv) + ' L' + pp(bt), stick: 'M' + pp(bt) + ' L' + pp(st), bucket: bucketPath,
      loadX: f1(lp[0] - lw / 2), loadY: f1(lp[1] - lw / 2), loadW: f1(lw), loadO: s.load > 0 ? 0.9 : 0,
      pivotX: f1(P(pv[0], 0)[0]), pivotY: f1(P(0, pv[1])[1]),
      comX: f1(X0 + com * SC), tilt: tilt,
      forceArrow: 'M' + f1(arrowTop[0]) + ',' + f1(arrowTop[1] + 14) + ' l0,' + f1(aLen) + ' m-6,-10 l6,10 l6,-10',
      badge: tipping ? 'Machine tips over' : sf < 1.33 ? 'Over rated lift (more than 75% of tipping load)' : 'Stable',
      bg: tipping ? '#FCE3CF' : sf < 1.33 ? '#FFF1CC' : '#DDEFF6', fg: tipping ? '#7E3407' : sf < 1.33 ? '#6B4A00' : '#0A4F70',
      a1Label: s.a1 + '°', a2Label: s.a2 + '°', mLabel: fmt(s.load, 0) + ' kg', wLabel: s.rpm + ' rpm',
      rows: [
        { k: 'Bucket reach', v: lx.toFixed(2) + ' m', sub: 'Measured from the slew axis; the tipping edge is at 1.8 m', color: '#0F2A3A' },
        { k: 'Safety ratio against tipping', v: isFinite(sf) ? sf.toFixed(2) : '∞', sub: 'Resisting moment ÷ tipping moment, should be at least 1.33', color: sf < 1 ? '#B04A0C' : sf < 1.33 ? '#8A5A00' : '#0F2A3A' },
        { k: 'Tipping load at this reach', v: isFinite(tipLoad) ? fmt(Math.max(0, tipLoad), 0) + ' kg' : 'Does not tip', sub: isFinite(rated) ? 'Safe rated lift (75%) ≈ ' + fmt(Math.max(0, rated), 0) + ' kg' : 'Bucket is behind the tipping edge', color: '#0F2A3A' },
        { k: 'Moment about the boom foot pin', v: fmt(Math.abs(tq) / 1000, 1) + ' kN·m', sub: 'τ = Σ m·g·distance of stick, bucket and load', color: '#0F2A3A' },
        { k: 'Approximate hydraulic pressure', v: press.toFixed(1) + ' MPa', sub: 'Cylinder diameter 14 cm, moment arm 0.9 m' + (press > 35 ? ' Above normal working level (~35 MPa)' : ''), color: press > 35 ? '#B04A0C' : '#0F2A3A' },
        { k: 'Centripetal force on the load while slewing', v: fmt(Fc, 0) + ' N', sub: 'F = mω²r ≈ ' + (Fc / 9.81).toFixed(0) + ' kgf that the arm must hold', color: '#0F2A3A' }
      ],
      aria: 'Backhoe, boom angle ' + s.a1 + ' degrees, bucket load ' + s.load + ' kilograms ' + (tipping ? 'Machine tips over' : 'still stable'),
      topR: f1(rTop), topRot: 'rotate(' + f1(ang) + ' 160 110)', topEnd: f1(160 + rTop),
      topArrow: 'M' + f1(160 + rTop - 6) + ',110 l' + f1(-fcLen) + ',0 m10,-6 l-10,6 l10,6',
      topAria: 'Top view, arm slewing about the axis at ' + s.rpm + ' rpm'
    };

    // ---------- container ship (box hull, metres) ----------
    var Lh = 250, B = 40, D = 22, rho = s.water === 'sea' ? 1.025 : 1.0;
    var light = 30000, KGl = 11;                     // tonnes, metres
    var rowsX = 16, bays = 45, boxH = 2.6;
    var hold = rowsX * bays * 6 * s.boxT, KGhold = 2 + 6 * boxH / 2;
    var deck = rowsX * bays * s.tiers * s.boxT, KGdeck = D + 0.5 + s.tiers * boxH / 2;
    var bal = s.ballast, KGbal = 1.2;
    var disp = light + hold + deck + bal;
    var T = disp / (rho * Lh * B);
    var KB = T / 2, BM = B * B / (12 * T), KM = KB + BM;
    var KG = (light * KGl + hold * KGhold + deck * KGdeck + bal * KGbal) / disp;
    var GM = KM - KG;
    var fb = D - T;
    var windA = Lh * (fb + s.tiers * boxH), windArm = (fb + s.tiers * boxH) / 2 + T / 2;
    var Mw = 0.5 * 1.225 * s.wind * s.wind * 1.2 * windA * windArm / 1000; // kN·m
    var heel, cap = false;
    if (GM <= 0) { heel = 32; cap = true; }
    else { heel = Math.atan(Mw / (disp * g * GM)) * 180 / PI; if (heel > 25) cap = true; }
    var sink = fb <= 0;
    var SS = 7, cx = 360, keelY = 345, wl = keelY - Math.min(T, D + 2) * SS;
    var hullPts = [[-B / 2, 0], [B / 2, 0], [B / 2, D], [-B / 2, D]];
    var mapP = function (q) { return f1(cx + q[0] * SS) + ',' + f1(keelY - q[1] * SS); };
    var hull = 'M' + hullPts.map(mapP).join(' L') + ' Z';
    var holdP = 'M' + [[-B / 2 + 1.5, 1.5], [B / 2 - 1.5, 1.5], [B / 2 - 1.5, D - 0.5], [-B / 2 + 1.5, D - 0.5]].map(mapP).join(' L') + ' Z';
    var boxes = '', boxes2 = '', bw = 2.44;
    for (var t1 = 0; t1 < 6; t1++) for (var c1 = 0; c1 < rowsX; c1++) {
      var x0 = -rowsX * bw / 2 + c1 * bw, y0 = 2 + t1 * boxH;
      boxes2 += 'M' + mapP([x0 + 0.1, y0]) + ' L' + mapP([x0 + bw - 0.1, y0]) + ' L' + mapP([x0 + bw - 0.1, y0 + boxH - 0.1]) + ' L' + mapP([x0 + 0.1, y0 + boxH - 0.1]) + ' Z ';
    }
    for (var t2 = 0; t2 < s.tiers; t2++) for (var c2 = 0; c2 < rowsX; c2++) {
      var x1 = -rowsX * bw / 2 + c2 * bw, y1 = D + 0.5 + t2 * boxH;
      boxes += 'M' + mapP([x1 + 0.1, y1]) + ' L' + mapP([x1 + bw - 0.1, y1]) + ' L' + mapP([x1 + bw - 0.1, y1 + boxH - 0.1]) + ' L' + mapP([x1 + 0.1, y1 + boxH - 0.1]) + ' Z ';
    }
    var balH = Math.min(1.8, bal / (rho * Lh * (B - 3)) );
    var ballastP = bal > 0 ? 'M' + [[-B / 2 + 1.5, 0.4], [B / 2 - 1.5, 0.4], [B / 2 - 1.5, 0.4 + Math.max(0.3, balH)], [-B / 2 + 1.5, 0.4 + Math.max(0.3, balH)]].map(mapP).join(' L') + ' Z' : 'M0,0';
    // B shifts toward the low side when heeled (drawn in world frame)
    var phi = heel * PI / 180, bShift = BM * Math.tan(phi) * 0.5;
    var bWorld = [cx + bShift * SS, keelY - KB * SS];
    var arrowY = wl - (fb + s.tiers * boxH) * SS / 2;
    var sh = {
      rot: 'rotate(' + f1(heel) + ' ' + cx + ' ' + f1(wl) + ')',
      hull: hull, hold: holdP, boxes: boxes || 'M0,0', boxes2: boxes2, ballast: ballastP,
      gY: f1(keelY - KG * SS), mY: f1(keelY - Math.min(KM, 60) * SS),
      wl: f1(wl), wh: f1(400 - wl), bX: f1(bWorld[0]), bY: f1(bWorld[1]),
      windArrow: s.wind > 0 ? 'M30,' + f1(arrowY) + ' l' + f1(20 + s.wind * 2) + ',0 m-10,-7 l10,7 l-10,7' : 'M0,0',
      badge: sink ? 'Sinking: deck flooded' : cap ? 'Capsized: G too high' : GM < 0.15 ? 'Danger: GM below the 0.15 m criterion' : heel > 10 ? 'Heeling a lot, add ballast water' : 'Upright and safe',
      bg: sink || cap ? '#FCE3CF' : GM < 0.15 || heel > 10 ? '#FFF1CC' : '#DDEFF6', fg: sink || cap ? '#7E3407' : GM < 0.15 || heel > 10 ? '#6B4A00' : '#0A4F70',
      tLabel: s.tiers + ' floors', cLabel: s.boxT + ' tonnes', bLabel: fmt(s.ballast, 0) + ' tonnes', wLabel: s.wind + ' m/s',
      rows: [
        { k: 'Total weight (displacement)', v: fmt(disp, 0) + ' tonnes', sub: 'Containers ' + fmt(rowsX * bays * (6 + s.tiers), 0) + ' · cargo ' + fmt(hold + deck, 0) + ' tonnes', color: '#0F2A3A' },
        { k: 'Draught', v: T.toFixed(2) + ' m', sub: s.water === 'sea' ? 'In a river (fresh water) it would sit deeper ≈ ' + (T * 0.025).toFixed(2) + ' m' : 'Fresh water is lighter than seawater, so the ship sits deeper', color: '#0F2A3A' },
        { k: 'Freeboard', v: fb.toFixed(2) + ' m', sub: fb < 3 ? 'Very low, waves wash over the deck easily' : 'Height of the deck above the water', color: fb < 3 ? '#B04A0C' : '#0F2A3A' },
        { k: 'Centre of gravity height KG', v: KG.toFixed(2) + ' m', sub: 'Measured from the keel', color: '#0F2A3A' },
        { k: 'Metacentric height GM', v: GM.toFixed(2) + ' m', sub: 'IMO requires an initial GM of at least 0.15 m. More GM means more upright, but faster rolling', color: GM < 0.15 ? '#B04A0C' : '#0F2A3A' },
        { k: 'Heel angle from wind', v: cap ? 'capsized' : heel.toFixed(1) + '°', sub: 'Wind force on the hull and deck containers', color: heel > 10 || cap ? '#B04A0C' : '#0F2A3A' }
      ],
      aria: 'Ship cross-section, deck containers ' + s.tiers + ' tiers, GM ' + GM.toFixed(2) + ' m, heel ' + heel.toFixed(1) + ' degrees'
    };

    var pill = function (on) { return on ? { bg: '#0A6A94', fg: '#FFFFFF', border: '#0A6A94' } : { bg: '#FFFFFF', fg: '#0F2A3A', border: '#C9D4DA' }; };
    var waters = [{ id: 'sea', name: 'Seawater 1,025 kg/m³' }, { id: 'fresh', name: 'Fresh water 1,000 kg/m³' }];
    return {
      ex: ex, sh: sh,
      a1: s.a1, a2: s.a2, load: s.load, rpm: s.rpm, tiers: s.tiers, boxT: s.boxT, ballast: s.ballast, wind: s.wind,
      setA1: this.setter('a1'), setA2: this.setter('a2'), setLoad: this.setter('load'), setRpm: this.setter('rpm'),
      setTiers: this.setter('tiers'), setBoxT: this.setter('boxT'), setBallast: this.setter('ballast'), setWind: this.setter('wind'),
      waters: waters.map(function (x) { var p = pill(x.id === s.water); return { name: x.name, pressed: x.id === s.water ? 'true' : 'false', bg: p.bg, fg: p.fg, border: p.border, pick: function () { self.setState({ water: x.id }); } }; })
    };
  }
}
</script>
</body>
</html>
