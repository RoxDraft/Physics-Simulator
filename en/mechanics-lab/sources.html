<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sources and access</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../../shared/dc-runtime.js" defer></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F3F6F7}
a{color:#0A6A94}a:hover{color:#074E6E}
a:focus-visible,button:focus-visible{outline:3px solid #B04A0C;outline-offset:2px}
</style>
<style>
.ps-bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;
  padding:8px clamp(16px,3vw,40px);background:rgba(255,255,255,.94);backdrop-filter:blur(6px);
  border-bottom:1px solid #D5DEE3;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:15px;color:#4A5D6A}
.ps-bar a{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:999px;
  color:#0A6A94;font-weight:600;text-decoration:none}
.ps-bar a:hover{background:#EAF3F7}
.ps-bar a:focus-visible{outline:3px solid #B04A0C;outline-offset:2px}
.ps-bar .ps-home{background:#0F2A3A;color:#FFFFFF}
.ps-bar .ps-home:hover{background:#163A4F}
.ps-bar [aria-current]{font-weight:600;color:#0F2A3A}
.ps-bar .ps-lang{margin-left:auto;border:1.5px solid #0A6A94}
</style>
<script>document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[data-ps-lang]");if(a){try{localStorage.setItem("ps-lang",a.getAttribute("data-ps-lang"))}catch(_){}}});</script>
</head>
<body>
<nav class="ps-bar" aria-label="Breadcrumb"><a class="ps-home" href="../index.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path><path d="M10 21v-6h4v6"></path></svg>Home</a><span aria-hidden="true">›</span><a href="index.html">Mechanics Lab</a><span aria-hidden="true">›</span><span aria-current="page">Sources</span><a class="ps-lang" href="../../mechanics-lab/sources.html" hreflang="th" lang="th" data-ps-lang="th" aria-label="Switch to Thai"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"></path></svg>ไทย</a></nav>
<div id="dc-root"></div>
<template id="dc-template">
<div style="font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; color: #0F2A3A; background: #F3F6F7; box-sizing: border-box; padding: 32px clamp(16px, 3vw, 40px) 56px">
<div style="max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px">
<nav style="font-size: 15px; font-weight: 600"><a href="index.html" style="min-height: 44px; display: inline-flex; align-items: center">← Back to the Mechanics Lab</a></nav>
<header style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 14px; font-weight: 600; letter-spacing: 0.08em; color: #0A6A94">MECHANICS LAB · Sources</div>
<h1 style="margin: 0; font-size: clamp(30px, 4vw, 44px); line-height: 1.2; font-weight: 700">Sources and access</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #4A5D6A">The Mechanics Lab uses moments, centripetal force and Archimedes’ principle from Physics 1 textbooks. Safety criteria come from real standards, but the sizes and masses of the backhoe and the ship are simplified example values</p>
</header>
<div role="group" aria-label="Filter by access" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid {{f.border}}; background: {{f.bg}}; color: {{f.fg}}; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">{{f.name}}</button>
</sc-for>
</div>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<section style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
<span style="font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 999px; background: {{g.tagBg}}; color: {{g.tagFg}}">{{g.tag}}</span>
<h2 style="margin: 0; font-size: 22px; font-weight: 700">{{g.title}}</h2>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #4A5D6A">{{g.count}}</span>
</div>
<p style="margin: 0; font-size: 15px; line-height: 1.7; color: #4A5D6A">{{g.desc}}</p>
<sc-for list="{{g.items}}" as="x" hint-placeholder-count="4">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-left-color: #D5DEE3; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 16px; font-weight: 700; line-height: 1.5">{{x.title}}</div>
<div style="font-size: 14px; line-height: 1.65; color: #34495A"><strong>Used for:</strong> {{x.used}}</div>
<div style="font-size: 14px; line-height: 1.65; color: #34495A"><strong>Access:</strong> {{x.access}}</div>
<sc-if value="{{x.url}}" hint-placeholder-val="{{ true }}"><a href="{{x.url}}" target="_blank" rel="noopener" style="font-size: 14px; word-break: break-all">{{x.url}}</a></sc-if>
</div>
</sc-for>
</section>
</sc-for>
<p style="margin: 0; font-size: 13px; line-height: 1.7; color: #4A5D6A">Links checked in November 2026. If you find an error or a better source, please let us know on the project’s GitHub.</p>
</div>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":2200}}'>
class Component extends DCLogic {
  constructor() {
    super(...arguments);
    this.state = { filter: 'all' };
    this.SRC = {"open": [{"title": "OpenStax University Physics Volume 1, chapters 10 and 12: rotation and static equilibrium", "used": "Moment of a force, tipping point and centripetal force F = mω²r", "access": "Open textbook, CC BY 4.0 licence", "url": "https://openstax.org/books/university-physics-volume-1/pages/10-introduction"}, {"title": "OpenStax University Physics Volume 1, chapter 14: fluid mechanics", "used": "Buoyancy, displaced volume and the density of seawater versus fresh water", "access": "Open textbook, CC BY 4.0 licence", "url": "https://openstax.org/books/university-physics-volume-1/pages/14-introduction"}, {"title": "PhET Interactive Simulations: Buoyancy and Balancing Act", "used": "The idea of repeatable, adjustable experiments that this lab is modelled on", "access": "Free to use, CC BY 4.0 licence", "url": "https://phet.colorado.edu/"}, {"title": "World Aquatics (FINA) Swimming Rules", "used": "Rule of at most 15 metres underwater after the start and turns, and one butterfly kick in breaststroke", "access": "Rules published free on the website", "url": "https://www.worldaquatics.com/rules"}, {"title": "OSHA Cranes and Derricks in Construction (29 CFR 1926 Subpart CC)", "used": "The principle of never lifting over capacity and using load charts", "access": "US government document, free to read", "url": "https://www.osha.gov/cranes-derricks"}], "restricted": [{"title": "ISO 10567 Earth-moving machinery: Hydraulic excavators, lift capacity", "used": "Rated lift = 75% of the tipping load (or 87% of hydraulic capacity)", "access": "ISO standard, must be purchased; we only use the principle that manufacturers cite in their manuals", "url": ""}, {"title": "IMO International Code on Intact Stability (2008 IS Code)", "used": "Minimum GM criterion of 0.15 m for ships", "access": "IMO publication, must be purchased; the criterion is quoted in general naval architecture textbooks", "url": ""}, {"title": "Manufacturer lift charts and real excavator specifications", "used": "Comparing calculated values with a real 20-tonne machine", "access": "Partly published in brochures; full charts are in each model’s operator manual", "url": ""}, {"title": "Loading plans and stability data for individual ships (stability booklet)", "used": "Real container and ballast arrangements", "access": "Owned by the ship operator, not published", "url": ""}], "none": [{"title": "Masses and positions of backhoe parts", "used": "Body 16.5 t, boom 1.7 t, stick 0.9 t, bucket 0.7 t, boom length 5.7 m, stick 2.9 m", "access": "Approximate values for a typical 20-tonne excavator, not a specific model", "url": ""}, {"title": "Hydraulic cylinder", "used": "14 cm diameter, 0.9 m moment arm and a 35 MPa warning level", "access": "Assumed values to show the relationship between moment and pressure", "url": ""}, {"title": "Box-shaped hull", "used": "Ship 250 m long, 40 m wide, 22 m deep, light ship 30,000 t", "access": "Real hulls are curved, so KB and BM differ from real values; used only to show the principle", "url": ""}, {"title": "Swim start model", "used": "Drag constant k = 0.14 per metre (loose position × 1.35), about 1.9 times more drag at the surface, kick speed 0.95 × frequency, surface swimming speed 2.1 m/s, and the dive from the block", "access": "Estimates tuned to give times close to a competitive swimmer; research can measure an individual swimmer’s drag, but values vary widely with body shape and technique", "url": ""}, {"title": "Wind force on containers", "used": "Heel angle from wind", "access": "Simple drag coefficient and wind area; waves and ship motion are not included", "url": ""}]};
  }

  renderVals() {
    var self = this, s = this.state, SRC = this.SRC;
    var meta = [
      { id: 'open', tag: 'Open', title: 'Data that is available and free to use', desc: 'Anyone can check it straight away through the link', tagBg: '#DDEFF6', tagFg: '#0A4F70' },
      { id: 'restricted', tag: 'Restricted access', title: 'The data exists, but requires registration, payment, or is limited to certain organisations', desc: 'This data really exists, but we can only include what is published generally, or not at all because of its terms of use', tagBg: '#FFF1CC', tagFg: '#6B4A00' },
      { id: 'none', tag: 'Not publicly available', title: 'No usable data, so the simulator uses estimates', desc: 'The numbers in these parts are our own examples or assumptions to show the principle; don’t use them as real data', tagBg: '#FCE3CF', tagFg: '#7E3407' }
    ];
    var groups = meta.filter(function (m) { return s.filter === 'all' || s.filter === m.id; }).map(function (m) {
      var items = SRC[m.id] || [];
      return { tag: m.tag, title: m.title, desc: m.desc, tagBg: m.tagBg, tagFg: m.tagFg, count: items.length + ' items', items: items };
    });
    var fl = [{ id: 'all', name: 'All' }].concat(meta.map(function (m) { return { id: m.id, name: m.tag }; }));
    return {
      groups: groups,
      filters: fl.map(function (f) { var on = f.id === s.filter; return { name: f.name, pressed: on ? 'true' : 'false', bg: on ? '#0A6A94' : '#FFFFFF', fg: on ? '#FFFFFF' : '#0F2A3A', border: on ? '#0A6A94' : '#C9D4DA', pick: function () { self.setState({ filter: f.id }); } }; })
    };
  }
}
</script>
</body>
</html>
