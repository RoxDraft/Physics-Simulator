<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":1900}}'>
class Component extends DCLogic {

    var key = [p.glide, p.f, p.d, p.D, p.tight].join('|');

      if (mode === 'block') {
        push(-0.7, 0.85, false);

      }

      if (res.t5 === null && x >= 5) res.t5 = t;
      if (res.t10 === null && x >= 10) res.t10 = t;

  bestGlide(p) {

    for (var g = 0; g <= 2.0001; g += 0.1) { var r = this.sim(Object.assign({}, p, { glide: Math.round(g * 10) / 10 })).res.t15; if (r < bt) { bt = r; best = Math.round(g * 10) / 10; } }

    var FA = figure(qa, s.t, s.f), FB = figure(qb, s.t, ghostP.f);
    var ripples = '';
    [qa, qb].forEach(function (q) { if (q.mode === 'swim' || (q.mode === 'under' && q.y > -0.35)) { var xp = PX(q.x); ripples += 'M' + f1(xp - 60) + ',110 q15,-6 30,0 q15,6 30,0 q15,-6 30,0 q15,6 30,0 '; } });
    var res = A.res, rb = B.res;
    var sc = {
      body: FA.d, headX: FA.hx, headY: FA.hy, ghost: FB.d, gHeadX: FB.hx, gHeadY: FB.hy, ripples: ripples || 'M0,0',
      clock: s.t < 0.65 ? 'Get set…' : (s.t - 0.0).toFixed(2) + ' s',
      marks: [
        { x: f1(PX(5)), t: '5 m', c: '#9AAAB4', w: 1 }, { x: f1(PX(10)), t: '10 m', c: '#9AAAB4', w: 1 },
        { x: f1(PX(15)), t: '15 m (underwater limit)', c: '#B04A0C', w: 2 }, { x: f1(PX(s.D)), t: 'Surface', c: '#0A6A94', w: 1 }
      ],
      aria: 'Two swimmers starting from the blocks, time ' + s.t.toFixed(1) + ' s'
    };
    // chart: speed vs distance
    var CX = function (x) { return 44 + 586 * x / 15; }, CY = function (v) { return 170 - 160 * v / 6; };
    var line = function (S, tmax) { var p = []; S.forEach(function (q) { if (q.mode !== 'block' && q.t <= tmax && q.x <= 15) p.push(f1(CX(q.x)) + ',' + f1(CY(q.v))); }); return p.length > 1 ? 'M' + p.join(' L') : 'M0,0'; };
    var tm = this.reduce ? 99 : s.t;
    var mk = '';
    var addMk = function (S, r) {
      if (r.xKick !== null && r.xKick <= 15) { var q = S.find(function (z) { return z.kick; }); if (q && q.t <= tm) mk += 'M' + f1(CX(q.x) - 4) + ',' + f1(CY(q.v)) + ' a4,4 0 1,0 8,0 a4,4 0 1,0 -8,0 '; }
      if (r.xBo !== null && r.xBo <= 15) { var b = S.find(function (z) { return z.mode === 'swim'; }); if (b && b.t <= tm) mk += 'M' + f1(CX(b.x) - 4) + ',' + f1(CY(b.v) - 4) + ' h8 v8 h-8 z '; }
    };
    addMk(A.S, res); addMk(B.S, rb);
    var ch = {
      mine: line(A.S, tm), ghost: line(B.S, tm), marks: mk || 'M0,0', nowX: f1(CX(Math.min(15, qa.x))),
      yTicks: [0, 1.5, 3, 4.5, 6].map(function (v) { return { y: f1(CY(v)), v: v }; }),
      xTicks: [0, 5, 10, 15].map(function (x) { return { x: f1(CX(x)), v: x }; })
    };
    var fmtT = function (t) { return t === null ? '–' : t.toFixed(2) + ' s'; };
    var gNames = { surface: 'Glide, then surface at 5 m', pro: 'Competitive swimmer', early: 'Kicks as soon as they enter the water' };
    var rows = [
      { name: 'Your settings', c: '#0A6A94', t5: fmtT(res.t5), t10: fmtT(res.t10), t15: fmtT(res.t15), vk: res.vKick !== null && res.xKick < s.D ? res.vKick.toFixed(2) + ' m/s' : 'No kick', bo: s.D + ' m' },
      { name: gNames[s.ghost], c: '#B04A0C', t5: fmtT(rb.t5), t10: fmtT(rb.t10), t15: fmtT(rb.t15), vk: rb.vKick !== null && rb.xKick < ghostP.D ? rb.vKick.toFixed(2) + ' m/s' : 'No kick', bo: ghostP.D + ' m' }
    ];
    var best = this.bestGlide(mineP), diff = res.t15 - rb.t15;
    var vk = 0.95 * s.f, tips = [];
    if (s.glide < best.g - 0.15) tips.push('Kicking too early: the body is still faster than the legs can push water, so the legs act as a brake');
    if (s.glide > best.g + 0.25) tips.push('Gliding too long: speed drops below what the kick can maintain');
    if (s.d < 0.35) tips.push('Too shallow: the body still makes surface waves, so drag is high');
    if (s.d > 1.2) tips.push('Too deep: distance is lost diving down and climbing back up at a steep angle');
    if (s.D > 11 && vk < 2.1) tips.push('Your kick is slower than surface swimming speed (' + vk.toFixed(2) + ' < 2.1 m/s), so staying under longer makes you slower. Surface earlier or train a stronger kick');
    if (!s.tight) tips.push('Loose streamline: about 35% more drag');
    var verdict = {
      text: (diff <= 0 ? 'Faster than the comparison by ' + (-diff).toFixed(2) + ' s. ' : 'Slower than the comparison by ' + diff.toFixed(2) + ' s. ') + (tips.length ? tips.join(' · ') : 'These settings are already close to the best for this kick strength'),
      bg: diff <= 0 ? '#DDEFF6' : '#FFF1CC', fg: diff <= 0 ? '#0A4F70' : '#6B4A00'
    };
    var sliders = [
      { id: 's-g', name: 'Glide before kicking', label: s.glide.toFixed(1) + ' s', min: 0, max: 2, step: 0.1, v: s.glide, hint: 'Counted from entering the water', set: function (e) { self.setState({ glide: parseFloat(e.target.value), t: 0 }); } },
      { id: 's-f', name: 'Dolphin kick frequency', label: s.f.toFixed(1) + ' kicks/s', min: 1.4, max: 3, step: 0.1, v: s.f, hint: 'Top kicking speed about ' + vk.toFixed(2) + ' m/s (beginner ~1.6 · competitive ~2.5)', set: function (e) { self.setState({ f: parseFloat(e.target.value), t: 0 }); } },
      { id: 's-d', name: 'Underwater depth', label: s.d.toFixed(1) + ' m', min: 0.2, max: 1.6, step: 0.1, v: s.d, hint: 'Measured at the middle of the body', set: function (e) { self.setState({ d: parseFloat(e.target.value), t: 0 }); } },
      { id: 's-D', name: 'Surface to swim at', label: s.D + ' m', min: 4, max: 15, step: 1, v: s.D, hint: 'Rules allow at most 15 m underwater', set: function (e) { self.setState({ D: parseFloat(e.target.value), t: 0 }); } }
    ];
    var postures = [{ id: true, name: 'Tight: hands stacked, arms squeezing the ears' }, { id: false, name: 'Loose: arms apart, head up' }].map(function (p) { var q = pill(s.tight === p.id); return { name: p.name, pressed: s.tight === p.id ? 'true' : 'false', bg: q.bg, fg: q.fg, border: q.border, pick: function () { self.setState({ tight: p.id, t: 0 }); } }; });
    var ghosts = ['pro', 'surface', 'early'].map(function (id) { var q = pill(s.ghost === id); return { name: gNames[id] + { pro: ' (2.5 kicks/s to 13 m)', surface: ' (no underwater kick)', early: ' (otherwise like the competitive swimmer)' }[id], pressed: s.ghost === id ? 'true' : 'false', bg: q.bg, fg: q.fg, border: q.border, pick: function () { self.setState({ ghost: id, t: 0 }); } }; });
    var notes = [
      { t: 'Why glide first', f: 'F_drag = k·v²', d: 'After the dive the body moves at about 3.5–4 m/s, faster than the legs can push water backwards. Kicking now turns the legs into a brake, so hold the most streamlined position to keep k low, and start kicking when speed drops close to your kicking speed' },
      { t: 'Why underwater is faster than the surface', f: 'k_surface ≈ 1.9 × k_underwater', d: 'A body at the surface has to push water into waves, and that energy is lost with the waves. About half a metre down, wave drag almost disappears, but going too deep costs distance on the way down and back up' },
      { t: 'How the dolphin kick creates thrust', f: 'thrust ∝ v_wave² − v²', d: 'The wave running from the chest to the toes pushes water backwards. The wave must be faster than the body to keep pushing water; the closer the body gets to the wave speed, the less thrust it makes. A higher kick frequency therefore lets you go faster and farther underwater' },
      { t: 'When to surface', f: 'v_kick vs. v_surface swim', d: 'If you kick faster underwater than you swim on the surface, stay under close to 15 metres. If your kick is slower, surface early. That is why each swimmer has a different best breakout distance. Try lowering the kick frequency and see which distance is best' }
    ];
    return {
      sc: sc, ch: ch, rows: rows, verdict: verdict, sliders: sliders, postures: postures, ghosts: ghosts, notes: notes,
      bestTxt: 'Use the best glide time (' + best.g.toFixed(1) + ' s → ' + best.t.toFixed(2) + ' s)',
      useBest: function () { self.setState({ glide: best.g, t: 0 }); },
      replay: function () { self.setState({ t: 0 }); },
      toggleSlow: function () { self.setState({ slow: !self.state.slow }); },
      slowPressed: s.slow ? 'true' : 'false', slowBg: s.slow ? '#0A6A94' : '#FFFFFF', slowFg: s.slow ? '#FFFFFF' : '#0A6A94'
    };
  }
}
</script>
