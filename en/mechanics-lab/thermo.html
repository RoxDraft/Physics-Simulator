<header style="display: flex; flex-direction: column; gap: 8px; max-width: 900px">
<div style="font-size: 14px; font-weight: 600; letter-spacing: 0.08em; color: #0A6A94">THERMODYNAMICS · Thermodynamics</div>
<h1 style="margin: 0; font-size: clamp(30px, 4vw, 46px); line-height: 1.2; font-weight: 700">Where does the heat go? Cooling a chip and air conditioning a room</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #4A5D6A">Every watt of electricity a chip uses becomes heat, and heat always flows from hot to cold. Cooling means giving the heat the easiest path out. An air conditioner does something nature will not do on its own: it uses electrical work to "pump" heat from a cool room and dump it outside, where it is hotter</p>
</header>

<section style="display: flex; flex-direction: column; gap: 14px">

</div>

<div style="background: #0F2A3A; color: #FFFFFF; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: #9FD0E6">Thermal circuit (like an electric circuit)</div>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 1.9">ΔT = P · R_total (like V = I·R)<br>R_total = R_chip + R_paste + R_heatsink<br>C·dT/dt = P_in − P_out<br>Heat sink: q = h·A·ΔT</div>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #B9D3DF">Heat flow is like current, temperature is like voltage, and thermal resistance (K/W) is like a resistor. Fins increase the area A, a fan increases h, and water holds about 3,500 times more heat than air per volume, so it carries a lot of heat through small pipes</p>

<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; overflow: hidden">

</div>

<text x="750" y="228" font-size="12" text-anchor="middle" fill="#7E3407" font-weight="700">Condenser coil</text>

<text x="520" y="100" font-size="11" fill="#7E3407">Hot high-pressure vapour {{ac.tc}}</text>
</svg>
</div>

<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: #9FD0E6">First and second laws</div>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 1.9">Q_rejected outside = Q_absorbed from room + W<br>COP = Q_absorbed from room / W<br>COP_max = T_cold / (T_hot − T_cold)<br>(temperatures in kelvin)</div>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #B9D3DF">The hotter it is outside or the lower you set the room, the wider the temperature gap to pump across and the lower the COP. That is why air conditioners use more power in the afternoon, and setting 1 °C higher saves a few per cent. The outdoor coil needs good airflow; in an enclosed spot the hot air recirculates, the coil gets hotter and the COP drops</p>
</div>

class Component extends DCLogic {

        { k: 'Under heavy load for a long time', v: Tss.toFixed(0) + ' °C', sub: 'T = T_air + P·R_total (without throttling)', c: Tss > 100 ? '#B04A0C' : '#0F2A3A' },

    var path = [[450, 240], [750, 240], [750, 80], [450, 80], [150, 80], [150, 240], [450, 240]], plen = [], tot = 0;

      var c = 'M' + f1(xx - 5) + ',' + f1(yv) + ' a5,5 0 1,0 10,0 a5,5 0 1,0 -10,0 ';

      : 'The AC is running at ' + Math.round(A.part * 100) + '% of capacity. ' + (s.inverter ? 'An inverter AC can slow its compressor down, so it is more efficient at part load' : 'A fixed-speed AC switches its compressor on and off and wastes energy each time it restarts') + ' Heat rejected outside always equals heat from the room plus the electricity used';
    var ac = {
