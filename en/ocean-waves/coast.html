<h1 style="margin: 0; font-size: clamp(30px, 4vw, 46px); line-height: 1.2; font-weight: 700">When waves reach the shore: run-up, erosion, beach life and jellyfish</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #4A5D6A">Waves that travel from the open sea grow taller as the water gets shallower, then break and rush up the beach. The remaining energy moves sand back and forth: in some seasons the beach widens, in others it disappears. The same waves and wind also bring jellyfish ashore</p>

<div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 1.9">L0 = g·T²/2π<br>Hb = 0.39·g^0.2·(T·H0²)^0.4<br>ξ = tanβ / √(H0/L0)<br>R2% = 1.1·(0.35·tanβ·√(H0·L0) + ½·√(H0·L0·(0.563·tan²β + 0.004)))<br>Ω = Hb / (ws·T)</div>

<h2 style="margin: 0; font-size: 26px; font-weight: 700">3. Why jellyfish strand: drifting with the wind, or swimming in?</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4A5D6A; max-width: 960px">Most jellyfish are weak swimmers, so they go where currents, wind and waves take them, but not every species. Change the wind and the food near shore, and see where each kind ends up. Top view, with the shore at the bottom</p>
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<div style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; overflow: hidden">
<div style="display: flex; flex-wrap: wrap; gap: 14px; padding: 10px 16px; border-bottom: 1px solid #E3E9EC; font-size: 14px; justify-content: space-between">

</sc-for>
</div>

</div>

<h2 style="margin: 0; font-size: 26px; font-weight: 700">4. Where do venomous jellyfish in Thai seas come from?</h2>

<sc-for list="{{facts}}" as="f" hint-placeholder-count="4">

<div style="font-size: 18px; font-weight: 700; line-height: 1.4">{{f.title}}</div>
<p style="margin: 0; font-size: 14px; line-height: 1.75; color: #34495A">{{f.text}}</p>
</div>
</sc-for>

<div style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: #9FD0E6">The answer</div>
<p style="margin: 0; font-size: 15px; line-height: 1.75; color: #D9E8EF">Both, depending on the species. Weak-swimming jellyfish and the Portuguese man o’ war are carried by wind, waves and currents, so they strand in seasons that follow the monsoon. The dangerous box jellyfish of the Gulf of Thailand are local residents, strong swimmers that come close to shore following food and shallow water. They have not drifted in from far away</p>
</div>
<div style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: #F5C77A">If you are stung</div>
<p style="margin: 0; font-size: 15px; line-height: 1.75; color: #D9E8EF">Get out of the water. Do not rub, and do not rinse with fresh water. Call 1669. Box jellyfish: pour vinegar for at least 30 seconds (many beaches have vinegar posts), then watch the person’s breathing. Portuguese man o’ war: rinse with seawater and remove tentacles with something other than bare hands. Do not touch stranded ones, even dead ones, because the stinging cells still work</p>
</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":2600}}'>
class Component extends DCLogic {
  constructor() {
    super(...arguments);
    var reduce = false;
    try { reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) {}
    this.reduce = reduce;
    this.state = {
      t: 0, H0: 0.6, T: 11, slope: 25, tide: 0.2, wall: false, preset: 'calm', storm: 0, days: 0, beachPaused: reduce,
      wind: 4, wdir: 'on', food: false, jPreset: 'mild', jPaused: reduce, jt: 0, tick: 0
    };
    this.jfInit();
  }

  // ---------- beach physics ----------
  beach(s) {
    var g = 9.81, L0 = g * s.T * s.T / (2 * Math.PI), tb = 1 / s.slope;
    var Hb = 0.39 * Math.pow(g, 0.2) * Math.pow(s.T * s.H0 * s.H0, 0.4);
    var xi = tb / Math.sqrt(s.H0 / L0);
    var HL = Math.sqrt(s.H0 * L0);
    var setup = 0.35 * tb * HL, swash = Math.sqrt(s.H0 * L0 * (0.563 * tb * tb + 0.004));

      counts: [

        { k: 'Moon jellyfish stranded', v: jf.cnt.aur + ' jellyfish', sub: 'Can swim, but cannot beat the waves and currents', c: '#E6A6C0' },
        { k: 'Box jellyfish near the shore', v: nBoxNear + ' jellyfish', sub: 'Choose their direction, so they rarely strand, but come into shallow water by themselves', c: '#B04A0C' }
      ],
      msg: jmsg, pauseTxt: s.jPaused ? 'Resume' : 'Pause',
      presets: jPresets.map(function (p) { var q = pill(s.jPreset === p.id); return { name: p.name, pressed: s.jPreset === p.id ? 'true' : 'false', bg: q.bg, fg: q.fg, border: q.border, pick: function () { self.setState(Object.assign({ jPreset: p.id }, p.v)); } }; }),
      sliders: [
        { id: 'j-w', name: 'Wind speed', label: s.wind.toFixed(0) + ' m/s', min: 0, max: 15, step: 1, v: s.wind, set: function (e) { self.setState({ wind: parseFloat(e.target.value), jPreset: '' }); } },
        { id: 'j-d', name: 'Wind direction: onshore · alongshore · offshore', label: wdTxt[s.wdir], min: 0, max: 2, step: 1, v: { on: 0, along: 1, off: 2 }[s.wdir], set: function (e) { self.setState({ wdir: ['on', 'along', 'off'][parseInt(e.target.value, 10)], jPreset: '' }); } }
      ],
      aria: 'Top view of the bay, wind ' + s.wind + ' m/s, jellyfish stranded ' + (jf.cnt.phys + jf.cnt.aur) + ' jellyfish'
    };

    var facts = [
      { tag: 'Local resident', c: '#B04A0C', title: 'Box jellyfish in the Gulf of Thailand', text: 'A 2009–2016 survey in 15 provinces around the Gulf of Thailand found 3 box jellyfish species, including Chironex indrasaksajiae, newly named from Thailand. The genus Chironex was found only from Surat Thani (about 9° N) northwards, peaked from July to September, and every severe or fatal case was in an area where Chironex occurs. This means they live and grow in the Gulf of Thailand itself, rather than drifting in from far away' },
      { tag: 'Drifts with the wind', c: '#5B4FC4', title: 'Portuguese man o’ war (Physalia)', text: 'Lives at the surface of the open ocean and cannot swim at all. Its gas float works like a sail, so the wind decides where it goes. When the southwest monsoon blows onto the Andaman coast, it strands on Phuket and nearby beaches from time to time, and in some years on the lower Gulf of Thailand coast during the monsoon' },
      { tag: 'Follows food', c: '#3F7A4F', title: 'Swimming in for food and shallow water', text: 'Box jellyfish have complex eyes and can choose their direction. They catch shrimp and small fish. After rain, river water brings nutrients into the sea, so plankton, shrimp and small fish increase near the shore and their predators follow. Shallow water near river mouths and calm beaches need extra care' },
      { tag: 'Why they seem more common', c: '#0A6A94', title: 'Jellyfish blooms', text: 'A research review links jellyfish blooms to warmer seas, nutrients from wastewater and farming (which boost plankton), overfishing that removes jellyfish competitors and predators, and coastal structures where the young stages attach. With more jellyfish in the sea, wind and waves bring more of them ashore' }
    ];

    return {
      bp: bp, lifeCards: lifeCards, jf: jfo, facts: facts,
      wall: s.wall, toggleWall: function () { self.setState({ wall: !self.state.wall }); },
      resetBeach: function () { self.setState({ storm: 0, days: 0 }); },
      pauseBeach: function () { self.setState({ beachPaused: !self.state.beachPaused }); },
      food: s.food, toggleFood: function () { self.setState({ food: !self.state.food, jPreset: '' }); },
      jfReset: function () { self.jfInit(); self.setState({ jPaused: false }); },
      jfPause: function () { self.setState({ jPaused: !self.state.jPaused }); }
    };
  }
}
</script>
</body>
</html>
