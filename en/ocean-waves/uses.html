<h1 style="margin: 0; font-size: clamp(30px, 4vw, 46px); line-height: 1.2; font-weight: 700">How do we use ocean waves?</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #4A5D6A">Waves are energy travelling across the water surface. People make use of the energy itself, the way waves move, and the information waves carry, from generating electricity to warning of disasters.</p>

<div style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #B04A0C">01 · Energy</div>
<h2 style="margin: 0; font-size: 19px; font-weight: 700">Electricity from wave power</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #34495A">Waves are a renewable energy source more concentrated than wind or sunlight, and they can be forecast days ahead because swell travels from distant storms. A commonly cited estimate puts the global potential at about 2 terawatts.</p>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #4A5D6A">In the picture: the bulb is brightest when the buoy moves fastest, and dims at the crest and trough where the buoy briefly stops</p>
</div>
</div>

<div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 8px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #B04A0C">02 · Fresh water</div>
<h2 style="margin: 0; font-size: 19px; font-weight: 700">Fresh water from seawater</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #34495A">Pilot projects use wave pressure to drive seawater reverse osmosis directly, without converting to electricity first. Well suited to islands and coastal communities short of fresh water.</p>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #4A5D6A">In the picture: seawater is pushed through the membrane (dashed line); fresh water (blue) flows into the tank and concentrated brine (grey) flows back to the sea</p>
</div>
</div>

<div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 8px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #B04A0C">03 · Tourism</div>
<h2 style="margin: 0; font-size: 19px; font-weight: 700">Water sports and tourism</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #34495A">Surfing, bodyboarding and windsurfing depend on swell arriving in regular sets. Beaches with good waves become a source of income for local communities, from board-rental shops to surf schools.</p>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #4A5D6A">In the picture: the surfer sits on the steep face; gravity pulls them down the slope while the wave lifts forward at the same speed</p>
</div>
</div>

<div style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #B04A0C">04 · Coasts</div>
<h2 style="margin: 0; font-size: 19px; font-weight: 700">Building and sustaining beaches</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #34495A">Waves carry sand up and down the beach and along the shore (longshore drift), forming beaches, sandbars and spits. Understanding this helps plan solutions to coastal erosion.</p>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #4A5D6A">In the picture (from above): water rushes up the beach along the angled wave direction but drains straight back down the slope, so the orange grain creeps to the right</p>
</div>
</div>

<div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 8px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #B04A0C">05 · Ecosystems</div>
<h2 style="margin: 0; font-size: 19px; font-weight: 700">Adding oxygen and mixing nutrients</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #34495A">Breaking waves drive air into the water, adding oxygen and gas exchange with the atmosphere. Wave mixing also stirs nutrients for plankton, corals and coastal life.</p>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #4A5D6A">In the picture: bubbles are pushed below the surface and float back up, dissolving oxygen into the water on the way</p>
</div>
</div>

<div style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #B04A0C">06 · Engineering</div>
<h2 style="margin: 0; font-size: 19px; font-weight: 700">Designing ports and offshore structures</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #34495A">Wave height and period data size breakwaters, ports, oil platforms and offshore wind farms, and help plan shipping routes that are safe and fuel-efficient.</p>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #4A5D6A">In the picture: the breakwater reflects and dissipates wave energy; the boat outside rocks hard while the one in the harbour is almost still</p>
</div>
</div>

<div style="flex: 1 1 280px; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column">

<div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 8px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #B04A0C">07 · Warnings</div>
<h2 style="margin: 0; font-size: 19px; font-weight: 700">Storm forecasting and tsunami warnings</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #34495A">Swell often reaches the coast before a storm, giving early warning. Tsunami buoys measure water pressure on the seabed and can detect sea-level changes of just a few centimetres in the open ocean.</p>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #4A5D6A">In the picture: as the tsunami passes, the seabed sensor measures the pressure rise, the buoy sends the data by satellite, and the warning tower on shore starts flashing before the wave arrives</p>
</div>
</div>

<div style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #B04A0C">08 · Navigation</div>
<h2 style="margin: 0; font-size: 19px; font-weight: 700">Reading waves to navigate</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #34495A">Polynesian navigators of the past read how swell reflected and bent around islands to find the direction and position of islands still out of sight, without a compass.</p>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #4A5D6A">In the picture (from above): the white swell bends around the island while blue reflected waves spread out in front; the canoe feels them as a change in how it rocks</p>
</div>
</div>

<h2 style="margin: 0; font-size: 26px; font-weight: 700">4 main types of wave energy converter</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4A5D6A">Each type captures a different part of the water’s motion, matching what you see in the simulator: the surface rising and falling, and the back-and-forth sloshing in shallow water.</p>
<div style="display: flex; flex-wrap: wrap; gap: 14px">

<path d="M120,104 L120,40 L148,40 L148,22 M172,22 L172,40 L200,40 L200,130" fill="none" stroke="#0F2A3A" stroke-width="4"></path>

<path d="{{a.arrow}}" fill="none" stroke="#0A6A94" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<h3 style="margin: 0; font-size: 17px; font-weight: 700">Oscillating water column (OWC)</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.65; color: #34495A">Waves push water up and down inside a closed chamber. The air above is alternately compressed and sucked back through an air turbine that spins one way. Often built into a breakwater.</p>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #4A5D6A">Notice: the air arrow reverses every half period, but the Wells turbine always spins the same way</p>
</div>

<div style="flex: 1 1 260px; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px">

<ellipse cx="120" cy="{{b.buoyY}}" rx="30" ry="11" fill="#FFFFFF" stroke="#0F2A3A" stroke-width="3"></ellipse>

<h3 style="margin: 0; font-size: 17px; font-weight: 700">Point absorber</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.65; color: #34495A">A buoy rides up and down with the waves, pulling a line or shaft anchored to the seabed that drives a generator or hydraulic pump. Many can be installed as an array.</p>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #4A5D6A">Notice: the piston follows the buoy, and the generator gear turns back and forth with each rise and fall</p>
</div>

<div style="flex: 1 1 260px; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px">

<h3 style="margin: 0; font-size: 17px; font-weight: 700">Oscillating wave surge converter</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.65; color: #34495A">A hinged flap fixed to the seabed in shallow water rocks back and forth with the water’s horizontal sloshing, matching the flattened orbits you see in the simulator in shallow water.</p>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #4A5D6A">Notice: the water dots slosh back and forth, rocking the flap, which pumps the hydraulic cylinder anchored to the seabed</p>
</div>

<div style="flex: 1 1 260px; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px">

<h3 style="margin: 0; font-size: 17px; font-weight: 700">Overtopping device</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.65; color: #34495A">A ramp lets waves wash water up into a reservoir above sea level, then the water flows back out through a water turbine, like a small hydroelectric dam.</p>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #4A5D6A">Notice: waves arrive in pulses, but the reservoir evens out the flow through the turbine, so it keeps spinning steadily</p>
</div>

<aside style="flex: 1 1 320px; min-width: 0; background: #0F2A3A; color: #FFFFFF; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: #9FD0E6">Back-of-the-envelope</div>
<h2 style="margin: 0; font-size: 22px; font-weight: 700; line-height: 1.35">How much power does a wave carry?</h2>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 500; background: #163A4F; border-radius: 10px; padding: 14px 16px">P ≈ 0.5 × H² × T</div>
<p style="margin: 0; font-size: 15px; line-height: 1.7; color: #D9E8EF">Gives power in kilowatts per metre of wave front (for deep-water waves). H is the wave height in metres and T is the period in seconds.</p>
<div style="border-top: 1px solid #2E5468; padding-top: 14px; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 15px; line-height: 1.7; color: #FFFFFF">Example: swell 2 m high, 10 s period</div>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 17px; color: #FFC79A">0.5 × 2² × 10 ≈ 20 kW per metre</div>
<div style="font-size: 15px; line-height: 1.7; color: #D9E8EF">So a 100 m wide wave front carries about 2 megawatts, before subtracting the efficiency of the converter.</div>
</div>
<div style="font-size: 14px; line-height: 1.7; color: #D9E8EF">Try choosing “Swell” in the simulator and look at the “Wave power” box to compare with this formula.</div>
</aside>

<h2 style="margin: 0; font-size: 26px; font-weight: 700">Waves and Thailand</h2>
<div style="display: flex; flex-wrap: wrap; gap: 24px">
<div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 6px">
<h3 style="margin: 0; font-size: 17px; font-weight: 700; color: #0A6A94">Andaman coast</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.7; color: #34495A">Phuket and Phang Nga get surfable waves during the southwest monsoon, roughly May to October, because swell from the Indian Ocean reaches them.</p>
</div>
<div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 6px">
<h3 style="margin: 0; font-size: 17px; font-weight: 700; color: #0A6A94">Gulf of Thailand</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.7; color: #34495A">A semi-enclosed, fairly shallow sea where most waves are small to moderate wind waves. Its wave energy potential is lower than coasts facing the open ocean, but coastal erosion is a major issue.</p>
</div>
<div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 6px">
<h3 style="margin: 0; font-size: 17px; font-weight: 700; color: #0A6A94">After the 2004 tsunami</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.7; color: #34495A">Thailand set up a national disaster warning system with warning towers along the Andaman coast, which issues alerts based on earthquake data and sea-level measurements.</p>
</div>

    var th = 24 * Math.sin(w * T), thr = th * PI / 180;
    var cd = [];
    for (var cx = 0; cx < 6; cx++) for (var cy = 0; cy < 2; cy++) cd.push([24 + cx * 40 + 12 * Math.sin(w * T + cx * 0.3), 62 + cy * 26, 2.2]);
    var c2 = {
      sea: sea(0, 240, 40, 4, 160, 112), dots: dots(cd), flap: 'translate(120 112) rotate(' + f1(th) + ')',
      pistonX: f1(120 + 30 * Math.sin(thr)), pistonY: f1(112 - 30 * Math.cos(thr))
    };

    // D overtopping
    var ph = frac(T / 3), run = Math.max(0, Math.sin(2 * PI * ph));
    var rx = 80 + 70 * run * 0.95, ry = 104 - 60 * run * 0.95;
    var drops = [];
    if (run > 0.8) for (var dd = 0; dd < 5; dd++) drops.push([152 + dd * 4 + (run - 0.8) * 60, 44 + (run - 0.8) * 90 * (1 + dd * 0.2), 2]);
    var flow = [];
    for (var fl = 0; fl < 3; fl++) { var qf = along([[190, 104], [190, 118]], frac(T * 0.8 + fl / 3)); flow.push([qf[0], qf[1], 1.6]); }
    var level = 70 + 3 * Math.sin(2 * PI * ph - 1.4);
    var d2 = {
      sea: sea(0, 80, 104, 5, 60, 130), runup: 'M80,104 L' + f1(rx) + ',' + f1(ry) + ' L' + f1(rx - 6) + ',' + f1(ry + 6) + ' L72,108 Z',
      resY: f1(level), resH: f1(104 - level), drops: dots(drops), flow: dots(flow), rot: 'rotate(' + f1(T * 220) + ')'
    };

    return {
      s1: s1, s2: s2, s3: s3, s4: s4, s5: s5, s6: s6, s7: s7, s8: s8, a: a, b: b2, c: c2, d: d2,
      playLabel: s.playing ? 'Stop animation' : 'Play animation',
      playPressed: s.playing ? 'true' : 'false',
      playBg: s.playing ? '#0A6A94' : '#FFFFFF', playFg: s.playing ? '#FFFFFF' : '#0A6A94',
      speedLabel: s.speed + '×',
      togglePlay: function () { self.setState({ playing: !self.state.playing }); },
      slower: function () { self.setState({ speed: Math.max(0.25, self.state.speed / 2) }); },
      faster: function () { self.setState({ speed: Math.min(4, self.state.speed * 2) }); }
    };
  }
}
</script>
