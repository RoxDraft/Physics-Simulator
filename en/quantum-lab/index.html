<div style="font-size: 14px; font-weight: 600; letter-spacing: 0.08em; color: #0A6A94">QUANTUM LAB · Modern physics</div>
<h1 style="margin: 0; font-size: clamp(30px, 4vw, 46px); line-height: 1.2; font-weight: 700">Quantum all around us: light, electrons and qubits</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #4A5D6A">At the scale of atoms, light comes in lumps of energy, electrons pass through walls, and things can be in several states at once until they are measured. It sounds strange, but these principles are at work in phone cameras, SSDs, TV screens, internet cables and quantum computers</p>
</div>
<a href="sources.html" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 20px; border-radius: 999px; border: 1.5px solid #0F2A3A; color: #0F2A3A; font-weight: 600; text-decoration: none">Sources</a>
</header>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 26px; font-weight: 700">1. The photoelectric effect: light comes in lumps</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4A5D6A; max-width: 960px">If light were only a wave, bright enough light should knock electrons out of a metal. But experiments found that red light never frees them however bright it is, while even dim violet light does at once. Einstein explained that light comes as photons, each with energy E = h·f, and an electron absorbs one at a time, so a single photon must be big enough (Nobel Prize 1921)</p>
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<div style="flex: 999 1 640px; min-width: 0; display: flex; flex-wrap: wrap; gap: 14px">
<div style="flex: 1 1 380px; min-width: 0; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; overflow: hidden">

<rect x="300" y="40" width="40" height="200" fill="#9AAAB4"></rect>
<text x="320" y="262" font-size="12" text-anchor="middle" fill="#D9E8EF">{{pe.metal}}</text>
<path d="{{pe.photons}}" fill="none" stroke="{{pe.col}}" stroke-width="2.5"></path>
<path d="{{pe.elec}}" fill="#9FD0E6"></path>
<circle cx="22" cy="20" r="6" fill="{{pe.col}}"></circle><text x="34" y="24" font-size="12" fill="#FFFFFF" font-weight="700">{{pe.lamTxt}}</text>
<text x="16" y="262" font-size="12" fill="#D9E8EF">{{pe.status}}</text>
</svg>
</div>
<div style="flex: 1 1 260px; min-width: 0; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">

<line x1="36" y1="170" x2="290" y2="170" stroke="#9AAAB4"></line>
<line x1="36" y1="10" x2="36" y2="170" stroke="#9AAAB4"></line>
<path d="{{pe.line}}" fill="none" stroke="#0A6A94" stroke-width="2.5"></path>
<line x1="{{pe.f0x}}" y1="20" x2="{{pe.f0x}}" y2="170" stroke="#B04A0C" stroke-dasharray="4 4"></line>
<text x="{{pe.f0x}}" y="186" font-size="10" text-anchor="middle" fill="#B04A0C">f₀</text>
<circle cx="{{pe.px}}" cy="{{pe.py}}" r="6" fill="#B04A0C"></circle>
<text x="290" y="196" font-size="10" text-anchor="end" fill="#4A5D6A">frequency →</text>
<text x="40" y="18" font-size="10" fill="#4A5D6A">KE (eV)</text>
</svg>
<span style="font-size: 13px; line-height: 1.6; color: #4A5D6A">The slope of the line is Planck’s constant h. Every metal has the same slope; only the starting point f₀ differs</span>
</div>
</div>
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 14px">

</sc-for>

<sc-for list="{{pe.stats}}" as="r" hint-placeholder-count="3">

</sc-for>
</div>
<div style="background: #0F2A3A; color: #FFFFFF; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: #9FD0E6">Where it is used</div>
<p style="margin: 0; font-size: 14px; line-height: 1.7; color: #D9E8EF">Phone camera sensors and the photodiodes at the end of optical fibres use the same principle in semiconductors: a photon with more energy than the band gap (1.12 eV for silicon) releases an electron as a signal, so silicon detects light up to about 1,100 nm. Solar cells use the released electrons as electricity</p>
</div>
</div>
</div>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 26px; font-weight: 700">2. Quantum tunnelling: electrons walking through walls</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4A5D6A; max-width: 960px">An electron behaves like a wave. When it meets an energy barrier higher than its own energy, the wave does not stop at once but decays exponentially inside the barrier. If the barrier is thin enough, some wave is left on the other side, so the electron may appear there without climbing over. This chance is extremely sensitive to thickness: a little thicker and it drops many times</p>
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<div style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; overflow: hidden">

<path d="{{tn.env}}" fill="none" stroke="#B04A0C" stroke-width="1.5" stroke-dasharray="5 4"></path>
<text x="40" y="236" font-size="12" fill="#4A5D6A">Incoming and reflected wave</text>
<text x="860" y="236" font-size="12" text-anchor="end" fill="#4A5D6A">{{tn.outTxt}}</text>
</svg>
</div>

</div>
</sc-for>
</div>
<div style="background: #EAF3F7; border-radius: 14px; padding: 14px 18px; font-size: 15px; line-height: 1.7">{{tn.msg}}</div>
</div>
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 600">Real examples</span>
<div role="group" aria-label="Tunnelling examples" style="display: flex; flex-direction: column; gap: 6px">

<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="min-height: 44px; padding: 4px 12px; border-radius: 10px; border: 1.5px solid {{p.border}}; background: {{p.bg}}; color: {{p.fg}}; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; text-align: left; line-height: 1.35">{{p.name}}</button>
</sc-for>
</div>
<sc-for list="{{tn.sliders}}" as="x" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; justify-content: space-between; gap: 8px"><label for="{{x.id}}" style="font-size: 14px; font-weight: 600">{{x.name}}</label><span style="font-family: 'IBM Plex Mono', monospace; color: #0A6A94; white-space: nowrap">{{x.label}}</span></div>
<input id="{{x.id}}" type="range" min="{{x.min}}" max="{{x.max}}" step="{{x.step}}" value="{{x.v}}" onChange="{{x.set}}">

</sc-for>
</div>
<div style="background: #0F2A3A; color: #FFFFFF; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px">

<div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 1.9">T ≈ e^(−2κd)<br>κ = √(2m(V₀ − E)) / ħ<br>κ ≈ 5.12 · √(V₀ − E [eV]) per nanometre</div>
</div>
</div>
</div>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 26px; font-weight: 700">3. Quantum dots: size sets the colour</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4A5D6A; max-width: 960px">An electron trapped in a tiny box can only have certain energies (E ∝ n²/L²), like a guitar string that vibrates only at certain frequencies. The smaller the box, the further apart the levels. When the electron drops to a lower level it emits a photon whose colour matches that energy gap, so semiconductor crystals a few nanometres across (quantum dots) change colour just by changing size. They are used in QLED TVs (Nobel Prize in Chemistry 2023)</p>
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<div style="flex: 999 1 640px; min-width: 0; display: flex; flex-wrap: wrap; gap: 14px">
<div style="flex: 1 1 380px; min-width: 0; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; overflow: hidden">
<div style="padding: 10px 16px; border-bottom: 1px solid #E3E9EC; font-weight: 700; font-size: 14px">Particle in a box: energy levels and wave shapes</div>
<svg viewBox="0 0 420 280" style="display: block; width: 100%; height: auto; background: #FBFCFD" role="img" aria-label="{{qd.aria}}">
<line x1="{{qd.x0}}" y1="20" x2="{{qd.x0}}" y2="260" stroke="#0F2A3A" stroke-width="4"></line>
<line x1="{{qd.x1}}" y1="20" x2="{{qd.x1}}" y2="260" stroke="#0F2A3A" stroke-width="4"></line>
<sc-for list="{{qd.levels}}" as="l" hint-placeholder-count="3">
<line x1="{{l.x0}}" y1="{{l.y}}" x2="{{l.x1}}" y2="{{l.y}}" stroke="#C9D4DA" stroke-dasharray="4 4"></line>
<path d="{{l.psi}}" fill="none" stroke="{{l.c}}" stroke-width="2.5"></path>
<text x="{{l.tx}}" y="{{l.y}}" dy="4" font-size="11" fill="#4A5D6A">n = {{l.n}}</text>
</sc-for>
<path d="{{qd.jump}}" fill="none" stroke="{{qd.col}}" stroke-width="3"></path>
<text x="{{qd.x1}}" y="272" font-size="11" text-anchor="end" fill="#4A5D6A">{{qd.wTxt}}</text>
</svg>
</div>
<div style="flex: 1 1 240px; min-width: 0; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; align-items: center">
<svg viewBox="0 0 240 200" style="display: block; width: 100%; max-width: 280px; height: auto" role="img" aria-label="{{qd.dotAria}}">

<circle cx="120" cy="92" r="{{qd.glowR}}" fill="{{qd.col}}" opacity="0.35"></circle>
<circle cx="120" cy="92" r="{{qd.dotR}}" fill="{{qd.col}}"></circle>

<defs><linearGradient id="spec" x1="0" x2="1"><stop offset="0" stop-color="#7A00FF"></stop><stop offset="0.17" stop-color="#2050FF"></stop><stop offset="0.33" stop-color="#00C0FF"></stop><stop offset="0.5" stop-color="#20D040"></stop><stop offset="0.67" stop-color="#FFE000"></stop><stop offset="0.83" stop-color="#FF8000"></stop><stop offset="1" stop-color="#E00000"></stop></linearGradient></defs>
<rect x="0" y="6" width="240" height="14" rx="4" fill="url(#spec)"></rect>
<path d="{{qd.mark}}" fill="#0F2A3A"></path>
</svg>
</div>
</div>
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; justify-content: space-between"><label for="q-L" style="font-size: 14px; font-weight: 600">Quantum dot size</label><span style="font-family: 'IBM Plex Mono', monospace; color: #0A6A94">{{qd.Ltxt}}</span></div>
<input id="q-L" type="range" min="2" max="7" step="0.1" value="{{L}}" onChange="{{setL}}">
</div>
<sc-for list="{{qd.stats}}" as="r" hint-placeholder-count="3">
<div style="display: flex; justify-content: space-between; gap: 10px; font-size: 14px; border-top: 1px solid #E3E9EC; padding-top: 6px"><span>{{r.k}}</span><span style="font-family: 'IBM Plex Mono', monospace">{{r.v}}</span></div>
</sc-for>
</div>
<div style="background: #0F2A3A; color: #FFFFFF; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: #9FD0E6">The same principle in LEDs and lasers</div>
<p style="margin: 0; font-size: 14px; line-height: 1.7; color: #D9E8EF">LEDs choose their colour by material rather than size: the material’s band gap sets the colour. Blue LEDs (indium gallium nitride) made today’s white LED lighting possible. A laser makes atoms emit identical photons together (stimulated emission), giving light of one colour in one direction, used to send data through fibre</p>
</div>
</div>
</div>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 26px; font-weight: 700">4. Qubits: in several states at once until measured</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4A5D6A; max-width: 960px">An ordinary bit is 0 or 1, but a qubit can be in a superposition α|0⟩ + β|1⟩, drawn as an arrow on a sphere (the Bloch sphere) with 0 at the top and 1 at the bottom. When measured, the qubit becomes 0 or 1 at random, with probabilities |α|² and |β|². Apply the H gate twice and the state returns to 0 with certainty, because the amplitudes cancel like waves (interference). That is something a coin-flipping ordinary bit cannot do</p>
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<div style="flex: 999 1 640px; min-width: 0; display: flex; flex-wrap: wrap; gap: 14px">

<line x1="160" y1="36" x2="160" y2="264" stroke="#C9D4DA"></line>
<text x="168" y="30" font-size="14" fill="#0F2A3A" font-weight="700">|0⟩</text>
<text x="168" y="284" font-size="14" fill="#0F2A3A" font-weight="700">|1⟩</text>
<text x="274" y="160" font-size="12" fill="#4A5D6A">+x</text>
<line x1="160" y1="150" x2="{{qb.vx}}" y2="{{qb.vy}}" stroke="#B04A0C" stroke-width="4" stroke-linecap="round"></line>
<circle cx="{{qb.vx}}" cy="{{qb.vy}}" r="8" fill="#B04A0C"></circle>
<line x1="{{qb.vx}}" y1="{{qb.vy}}" x2="{{qb.vx}}" y2="{{qb.sy}}" stroke="#B04A0C" stroke-dasharray="3 3" opacity="0.5"></line>
</svg>
</div>
<div style="flex: 1 1 280px; min-width: 0; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">

<div style="font-family: 'IBM Plex Mono', monospace; font-size: 16px">{{qb.stateTxt}}</div>
<sc-for list="{{qb.probs}}" as="p" hint-placeholder-count="2">

<span style="flex: 0 0 90px; font-family: 'IBM Plex Mono', monospace">{{p.n}}</span>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":3900}}'>
class Component extends DCLogic {
  constructor() {
    super(...arguments);
    var reduce = false;

    this.reduce = reduce;
    this.state = {
      lam: 420, inten: 0.6, metal: 'na', t: 0, tick: 0,
      V0: 4, E: 1, d: 0.5, tpre: 'stm',
      L: 3.5,
      re0: 1, im0: 0, re1: 0, im1: 0, shots: null, log: 'Initial state |0⟩',
      ftype: 'smf', rayA: 3, dist: 60, ch: 40, rate: 400, amp: true, atten: 0.2
    };
    this._seed = 777;
  }

  rnd() { this._seed = (this._seed * 1664525 + 1013904223) % 4294967296; return this._seed / 4294967296; }

  componentDidMount() {
    var self = this;
    this._alive = true; this._last = null;
    var loop = function (now) {
      if (!self._alive) return;
      if (self._last === null) self._last = now;
      var dt = Math.min((now - self._last) / 1000, 0.05);
      self._last = now;
      if (!self.reduce) self.setState({ t: self.state.t + dt });
      self._raf = requestAnimationFrame(loop);
    };
    this._raf = requestAnimationFrame(loop);
  }

  componentWillUnmount() { this._alive = false; if (this._raf) cancelAnimationFrame(this._raf); }

  lamColor(nm) {
    var r = 0, g = 0, b = 0;
    if (nm < 380) { r = 0.55; g = 0.3; b = 1; }
    else if (nm < 440) { r = (440 - nm) / 60; b = 1; }
    else if (nm < 490) { g = (nm - 440) / 50; b = 1; }
    else if (nm < 510) { g = 1; b = (510 - nm) / 20; }
    else if (nm < 580) { r = (nm - 510) / 70; g = 1; }
    else if (nm < 645) { r = 1; g = (645 - nm) / 65; }
    else if (nm <= 780) { r = 1; }
    else { r = 0.6; g = 0.15; b = 0.15; }
    return 'rgb(' + Math.round(r * 255) + ',' + Math.round(g * 255) + ',' + Math.round(b * 255) + ')';
  }

  applyGate(g) {
    var s = this.state, a = [s.re0, s.im0], b = [s.re1, s.im1], r2 = Math.SQRT1_2;
    var mul = function (z, w) { return [z[0] * w[0] - z[1] * w[1], z[0] * w[1] + z[1] * w[0]]; };
    var na, nb;
    if (g === 'H') { na = [(a[0] + b[0]) * r2, (a[1] + b[1]) * r2]; nb = [(a[0] - b[0]) * r2, (a[1] - b[1]) * r2]; }
    else if (g === 'X') { na = b; nb = a; }
    else if (g === 'Z') { na = a; nb = [-b[0], -b[1]]; }
    else if (g === 'S') { na = a; nb = mul(b, [0, 1]); }
    else { na = a; nb = mul(b, [r2, r2]); }   // T
    var log = (s.log && s.log.indexOf('Initial state') === 0 ? '|0⟩' : s.log) + ' → ' + g;
    if (log.length > 60) log = '… ' + log.slice(-56);
    this.setState({ re0: na[0], im0: na[1], re1: nb[0], im1: nb[1], log: log, shots: null });
  }

  renderVals() {
    var self = this, s = this.state;
    var f1 = function (v) { return (+v).toFixed(1); };
    var pill = function (on) { return on ? { bg: '#0A6A94', fg: '#FFFFFF', border: '#0A6A94' } : { bg: '#FFFFFF', fg: '#0F2A3A', border: '#C9D4DA' }; };

    // ---------- 1. photoelectric ----------
    var metals = { cs: { n: 'Caesium 2.1 eV', w: 2.1 }, na: { n: 'Sodium 2.3 eV', w: 2.28 }, zn: { n: 'Zinc 4.3 eV', w: 4.3 }, cu: { n: 'Copper 4.7 eV', w: 4.7 } };
    var M = metals[s.metal], Eph = 1240 / s.lam, KE = Eph - M.w, emit = KE > 0;
    var col = this.lamColor(s.lam), photons = '', elec = '';
    var nPh = Math.round(2 + 10 * s.inten), sp = 160;
    for (var i = 0; i < nPh; i++) {
      var ph = (s.t * sp / 260 + i / nPh) % 1, x = 20 + ph * 270, y = 50 + ((i * 53) % 180);
      var wl = 6 + s.lam / 60;
      photons += 'M' + f1(x) + ',' + f1(y);
      for (var k = 0; k < 4; k++) photons += ' q' + f1(wl / 4) + ',-6 ' + f1(wl / 2) + ',0 q' + f1(wl / 4) + ',6 ' + f1(wl / 2) + ',0';
    }
    if (emit) {
      var v = Math.sqrt(KE);
      for (var j = 0; j < nPh; j++) { var p2 = ((s.t * (0.6 + 0.8 * v) + j / nPh) % 1), ex = 300 - p2 * 260, ey = 60 + ((j * 47) % 170) - p2 * 30 * Math.sin(j); elec += 'M' + f1(ex - 5) + ',' + f1(ey) + ' a5,5 0 1,0 10,0 a5,5 0 1,0 -10,0 '; }
    }
    var fT = function (E) { return 36 + 254 * E / 7; }, kY = function (ke) { return 170 - 150 * ke / 4.5; };
    var line = 'M' + f1(fT(M.w)) + ',170 L' + f1(fT(7)) + ',' + f1(kY(7 - M.w));
    var pe = {
      photons: photons, elec: elec || 'M0,0', col: col, metal: M.n.split(' ')[0],
      lamTxt: s.lam + ' nm · each photon ' + Eph.toFixed(2) + ' eV',
      status: emit ? 'Electrons are ejected, max energy ' + KE.toFixed(2) + ' eV' : 'No electrons are ejected, however bright the light',
      line: line, f0x: f1(fT(M.w)), px: f1(fT(Eph)), py: f1(emit ? kY(KE) : 170),
      sliders: [
        { id: 'p-l', name: 'Wavelength of light', label: s.lam + ' nm', min: 180, max: 800, step: 5, v: s.lam, set: function (e) { self.setState({ lam: parseFloat(e.target.value) }); } },
        { id: 'p-i', name: 'Light intensity (number of photons)', label: Math.round(s.inten * 100) + '%', min: 0.05, max: 1, step: 0.05, v: s.inten, set: function (e) { self.setState({ inten: parseFloat(e.target.value) }); } }
      ],
      metals: Object.keys(metals).map(function (id) { var q = pill(s.metal === id); return { name: metals[id].n, pressed: s.metal === id ? 'true' : 'false', bg: q.bg, fg: q.fg, border: q.border, pick: function () { self.setState({ metal: id }); } }; }),
      stats: [
        { k: 'Photon energy E = hc/λ', v: Eph.toFixed(2) + ' eV', c: '#0F2A3A' },
        { k: 'Work function φ', v: M.w.toFixed(2) + ' eV', c: '#0F2A3A' },
        { k: 'Max kinetic energy E − φ', v: emit ? KE.toFixed(2) + ' eV' : 'None ejected', c: emit ? '#0A6A94' : '#B04A0C' },
        { k: 'Electrons per second', v: emit ? 'Proportional to intensity ' + Math.round(s.inten * 100) + '%' : '0', c: '#0F2A3A' }
      ],
      aria: 'Light ' + s.lam + ' nm on the metal, ' + (emit ? 'electrons ejected' : 'no electrons ejected')
    };

    // ---------- 2. tunnelling ----------
    var dV = Math.max(0.01, s.V0 - s.E), kap = 5.123 * Math.sqrt(dV), T = Math.exp(-2 * kap * s.d);
    var bw = Math.max(6, Math.min(520, s.d / 2.5 * 520)), bx = 450 - bw / 2;
    var kIn = 0.06 + 0.03 * Math.sqrt(s.E);   // display wavenumber (scaled for readability)
    var wave = [], env = [], A0 = 70, At = A0 * Math.sqrt(T), om = 4;
    for (var xp = 20; xp <= 880; xp += 3) {
      var yv;
      if (xp < bx) yv = A0 * Math.cos(kIn * (xp - bx) - om * s.t);
      else if (xp <= bx + bw) { var u = (xp - bx) / bw; yv = A0 * Math.exp(-kap * s.d * u) * Math.cos(-om * s.t); }
      else yv = At * Math.cos(kIn * (xp - bx - bw) - om * s.t);
      wave.push(f1(xp) + ',' + f1(130 - yv));
      if (xp >= bx && xp <= bx + bw) { var u2 = (xp - bx) / bw; env.push(f1(xp) + ',' + f1(130 - A0 * Math.exp(-kap * s.d * u2))); }
    }
    var log10T = Math.log10(T), elecPerSec = 6.24e12 * T;    // 1 µA of electrons hitting the barrier
    var sens = Math.exp(2 * kap * 0.1);
    var presets = [
      { id: 'stm', name: 'STM: tip 0.5 nm above the surface', v: { V0: 4.5, E: 0.5, d: 0.5 } },
      { id: 'gate', name: 'Transistor gate insulator 1.2 nm thin (leakage current)', v: { V0: 3.6, E: 0.5, d: 1.2 } },
      { id: 'flash', name: 'Insulator around a flash cell, 8 nm (data storage)', v: { V0: 3.6, E: 0.5, d: 8 } }
    ];
    var tmsg = {
      stm: 'An STM uses the tunnelling current between a sharp tip and the surface. When the gap changes by just 0.1 nm (about half an atom), the current changes about ' + sens.toFixed(0) + ' times, so it can image a surface atom by atom (Nobel Prize 1986)',
      gate: 'As transistors shrank, the gate insulator thinned to about 1 nm and electrons tunnelled through as leakage current, heating the chip and wasting power. Manufacturers switched to new insulators (high-k) that are thicker but store charge just as well',
      flash: 'With an 8 nm insulator the chance of tunnelling is practically zero, so stored charge lasts for years with the power off. To write data, the chip applies a high voltage that tilts and thins the barrier (Fowler–Nordheim tunnelling) so electrons can tunnel in'
    }[s.tpre] || 'Try increasing the thickness a little at a time and see the tunnelling chance fall exponentially. A taller barrier also lowers it, but more slowly than thickness does';
    var tn = {
      bx: f1(bx), bw: f1(bw), bcx: f1(450), bTxt: 'Energy barrier ' + s.V0.toFixed(1) + ' eV · thickness ' + s.d.toFixed(2) + ' nm',
      wave: 'M' + wave.join(' L'), env: env.length > 1 ? 'M' + env.join(' L') : 'M0,0',
      outTxt: T > 1e-4 ? 'Transmitted wave (enlarged to be visible: amplitude √T)' : 'The transmitted wave is too small to see',
      stats: [
        { k: 'Tunnelling probability T', v: T > 1e-3 ? (T * 100).toFixed(2) + '%' : '10^' + log10T.toFixed(1), sub: 'For each electron hitting the barrier', c: '#0F2A3A' },
        { k: 'κ (how fast the wave decays in the barrier)', v: kap.toFixed(1) + ' /nm', sub: 'The wave falls to 1/e every ' + (1 / kap).toFixed(3) + ' nm', c: '#0F2A3A' },
        { k: 'If 1 µA of current hits the barrier', v: elecPerSec >= 1 ? elecPerSec.toExponential(1) + ' /s' : '1 gets through every ' + (1 / elecPerSec).toExponential(1) + ' s', sub: '6.2 × 10¹² electrons per second', c: '#0F2A3A' },
        { k: '0.1 nm thicker', v: '÷ ' + (sens < 1000 ? sens.toFixed(1) : sens.toExponential(1)), sub: 'How many times less likely to tunnel', c: '#B04A0C' }
      ],
      msg: tmsg,
      presets: presets.map(function (p) { var q = pill(s.tpre === p.id); return { name: p.name, pressed: s.tpre === p.id ? 'true' : 'false', bg: q.bg, fg: q.fg, border: q.border, pick: function () { self.setState(Object.assign({ tpre: p.id }, p.v)); } }; }),
      sliders: [
        { id: 't-d', name: 'Barrier thickness', label: s.d.toFixed(2) + ' nm', min: 0.1, max: 10, step: 0.05, v: s.d, set: function (e) { self.setState({ d: parseFloat(e.target.value), tpre: '' }); } },
        { id: 't-v', name: 'Barrier height above the electron’s energy', label: dV.toFixed(1) + ' eV', min: 0.2, max: 6, step: 0.1, v: dV, set: function (e) { self.setState({ V0: s.E + parseFloat(e.target.value), tpre: '' }); } }
      ],
      aria: 'Electron wave hitting a barrier ' + s.d + ' nm thick, tunnelling probability ' + T.toExponential(1)
    };

    // ---------- 3. quantum dots ----------
    var Eg = 1.74 + 4.5 / (s.L * s.L), lamQ = 1240 / Eg, qcol = this.lamColor(lamQ);
    var bwQ = 60 + s.L * 40, x0 = 210 - bwQ / 2, x1 = 210 + bwQ / 2;
    var levels = [1, 2, 3].map(function (n) {
      var y = 250 - n * n * (2 / s.L) * (2 / s.L) * 50;
      var hidden = y < 28; y = Math.max(28, y);
      var psi = []; for (var q = 0; q <= 40; q++) { var xx = x0 + bwQ * q / 40; psi.push(f1(xx) + ',' + f1(y - 14 * Math.sin(n * Math.PI * q / 40) * Math.cos(s.t * (1 + n)))); }
      return { n: hidden ? n + ' (off the chart)' : n, y: f1(y), x0: f1(x0), x1: f1(x1), tx: f1(x1 + 8), psi: hidden ? 'M0,0' : 'M' + psi.join(' L'), c: n === 1 ? '#0A6A94' : n === 2 ? '#B04A0C' : '#9AAAB4' };
    });
    var y1 = +levels[0].y, y2 = +levels[1].y, jx = x1 - 20;
    var jump = 'M' + f1(jx) + ',' + f1(y2 + 4) + ' L' + f1(jx) + ',' + f1(y1 - 6) + ' M' + f1(jx - 6) + ',' + f1(y1 - 14) + ' L' + f1(jx) + ',' + f1(y1 - 4) + ' L' + f1(jx + 6) + ',' + f1(y1 - 14);
    var mk = Math.max(0, Math.min(240, (lamQ - 380) / 400 * 240));
    var qd = {
      x0: f1(x0), x1: f1(x1), levels: levels, jump: jump, col: qcol, wTxt: 'Box width ' + s.L.toFixed(1) + ' nm',
      glowR: f1(30 + s.L * 6), dotR: f1(10 + s.L * 4), lamTxt: 'Emitted light ≈ ' + Math.round(lamQ) + ' nm', mark: 'M' + f1(mk - 6) + ',0 L' + f1(mk + 6) + ',0 L' + f1(mk) + ',8 Z',
      Ltxt: s.L.toFixed(1) + ' nm (≈ ' + Math.round(Math.pow(s.L / 0.6, 3) * 0.5) + ' atoms)',
      stats: [
        { k: 'Energy gap', v: Eg.toFixed(2) + ' eV' },
        { k: 'Emitted wavelength', v: Math.round(lamQ) + ' nm' },
        { k: 'Colour', v: lamQ < 450 ? 'Blue-violet' : lamQ < 495 ? 'Cyan' : lamQ < 570 ? 'Green' : lamQ < 590 ? 'Yellow' : lamQ < 620 ? 'Orange' : 'Red' }
      ],
      aria: 'Particle in a box ' + s.L.toFixed(1) + ' nm wide', dotAria: 'Quantum dot glowing at ' + Math.round(lamQ) + ' nm wide'
    };

    // ---------- 4. qubit ----------
    var p0 = s.re0 * s.re0 + s.im0 * s.im0, p1 = s.re1 * s.re1 + s.im1 * s.im1;
    var th = 2 * Math.acos(Math.min(1, Math.sqrt(p0))), phi = Math.atan2(s.im1, s.re1) - Math.atan2(s.im0, s.re0);
    var bxv = Math.sin(th) * Math.cos(phi), byv = Math.sin(th) * Math.sin(phi), bzv = Math.cos(th);
    var vx = 160 + 110 * (bxv * 0.94 + byv * 0.34 * 0), vy = 150 - 110 * bzv + 30 * byv;
    vx = 160 + 110 * bxv - 20 * byv;
    var cfmt = function (re, im) { if (Math.abs(im) < 1e-9) return re.toFixed(2); if (Math.abs(re) < 1e-9) return im.toFixed(2) + 'i'; return '(' + re.toFixed(2) + (im >= 0 ? '+' : '') + im.toFixed(2) + 'i)'; };
    var shots = s.shots;
    var qb = {
      vx: f1(vx), vy: f1(vy), sy: f1(150 + 30 * byv),
      stateTxt: cfmt(s.re0, s.im0) + '|0⟩ + ' + cfmt(s.re1, s.im1) + '|1⟩',
      probs: [{ n: 'P(0) = |α|²', w: (p0 * 100).toFixed(1) + '%', v: (p0 * 100).toFixed(0) + '%', c: '#0A6A94' }, { n: 'P(1) = |β|²', w: (p1 * 100).toFixed(1) + '%', v: (p1 * 100).toFixed(0) + '%', c: '#B04A0C' }],
      nShots: shots ? (shots[0] + shots[1]).toLocaleString('en-US') : '0',
      hist: shots ? [{ n: '0', w: (shots[0] / (shots[0] + shots[1]) * 100).toFixed(1) + '%', v: shots[0], c: '#0A6A94' }, { n: '1', w: (shots[1] / (shots[0] + shots[1]) * 100).toFixed(1) + '%', v: shots[1], c: '#B04A0C' }] : [{ n: '0', w: '0%', v: '–', c: '#0A6A94' }, { n: '1', w: '0%', v: '–', c: '#B04A0C' }],
      log: s.log,
      gates: [['H', 'Hadamard: creates a superposition'], ['X', 'Bit flip'], ['Z', 'Phase flip'], ['S', '90° phase rotation'], ['T', '45° phase rotation']].map(function (g) { return { name: g[0], tip: g[1], pick: function () { self.applyGate(g[0]); } }; }),
      aria: 'Qubit, probability of 0 ' + (p0 * 100).toFixed(0) + ' percent'
    };

    // ---------- 5. fiber ----------
    var types = { smf: { name: 'Telecom fibre n₁ 1.468 · n₂ 1.463', n1: 1.468, n2: 1.463 }, demo: { name: 'Easy-to-see version n₁ 1.50 · n₂ 1.40 (like plastic fibre)', n1: 1.5, n2: 1.4 } };
    var F = types[s.ftype], thc = Math.acos(F.n2 / F.n1) * 180 / Math.PI, trapped = s.rayA < thc;
    var NA = Math.sqrt(F.n1 * F.n1 - F.n2 * F.n2);
    // ray zig-zag in the core (visual: vertical exaggeration so small angles are visible)
    var ex = 14, rad = s.rayA * Math.PI / 180, slope = Math.tan(rad) * ex, ray = 'M0,110', x = 0, yy = 110, dir = -1, bounced = 0, escapeX = null;
    while (x < 900 && bounced < 60) {
      var target = dir < 0 ? 70 : 150, dx = Math.abs(target - yy) / Math.max(slope, 0.02);
      if (x + dx > 900) { ray += ' L900,' + f1(yy + dir * (900 - x) * slope); break; }
      x += dx; yy = target; ray += ' L' + f1(x) + ',' + f1(yy);
      if (!trapped) { escapeX = x; var out = Math.asin(Math.min(1, F.n1 / F.n2 * Math.sin(Math.PI / 2 - rad))); var ang2 = Math.PI / 2 - out; ray += ' l' + f1(60) + ',' + f1(dir * Math.max(10, Math.tan(ang2) * 60 * 1.5)); break; }
      dir = -dir; bounced++;
    }
    var pulse = ''; if (trapped) { var px = (s.t * 220) % 900; pulse = 'M' + f1(px - 5) + ',110 a5,5 0 1,0 10,0 a5,5 0 1,0 -10,0'; }
    var att = s.atten, P0 = 0, sensDb = -28, pts = [], ampMarks = '', Pend = 0, ok = true, minP = 0;
    var DX = function (km) { return 60 + 820 * km / s.dist; }, DY = function (dbm) { return 20 + 150 * (-Math.max(-40, Math.min(0, dbm))) / 40; };
    for (var km = 0; km <= s.dist + 1e-9; km += s.dist / 200) {
      var P = P0 - att * km;
      if (s.amp) { var nAmp = Math.floor(km / 80); P = P0 - att * (km - nAmp * 80); }
      pts.push(f1(DX(km)) + ',' + f1(DY(P))); minP = Math.min(minP, P); Pend = P;
    }
    if (s.amp) for (var ak = 80; ak < s.dist; ak += 80) ampMarks += 'M' + f1(DX(ak) - 5) + ',178 l5,-8 l5,8 z ';
    ok = minP >= sensDb;
    var cap = s.ch * s.rate / 1000, comb = '';
    for (var c = 0; c < s.ch; c++) { var cx = 20 + 860 * (c + 0.5) / s.ch; comb += 'M' + f1(cx) + ',78 L' + f1(cx) + ',' + f1(20 + 10 * Math.sin(c * 1.7 + s.t * 2) * 0.3) + ' '; }
    var fb = {
      n1: F.n1, n2: F.n2, ray: ray, pulse: pulse || 'M0,0',
      okTxt: trapped ? 'Light is guided along the core (critical angle ' + thc.toFixed(1) + '°)' : 'Steeper than ' + thc.toFixed(1) + '°: light leaks into the cladding', okC: trapped ? '#0A6A94' : '#B04A0C',
      sensY: f1(DY(sensDb)), powerPath: 'M' + pts.join(' L'), amps: ampMarks || 'M0,0', dTxt: s.dist + ' km',
      linkTxt: ok ? 'Signal received; at the far end ' + Pend.toFixed(1) + ' dBm' : 'Signal too weak at the far end; amplifiers needed', linkC: ok ? '#0A6A94' : '#B04A0C',
      capTxt: cap >= 1 ? cap.toFixed(1) + ' Tb/s per fibre' : (cap * 1000).toFixed(0) + ' Gb/s per fibre', comb: comb,
      capAria: 'Channels: ' + s.ch + ' channels, total ' + cap.toFixed(1) + ' terabits per second',
      types: Object.keys(types).map(function (id) { var q = pill(s.ftype === id); return { name: types[id].name, pressed: s.ftype === id ? 'true' : 'false', bg: q.bg, fg: q.fg, border: q.border, pick: function () { self.setState({ ftype: id }); } }; }),
      sliders: [
        { id: 'f-a', name: 'Light angle to the fibre axis', label: s.rayA.toFixed(1) + '°', min: 0.5, max: 30, step: 0.5, v: s.rayA, set: function (e) { self.setState({ rayA: parseFloat(e.target.value) }); } },
        { id: 'f-d', name: 'Distance', label: s.dist + ' km', min: 1, max: 400, step: 1, v: s.dist, set: function (e) { self.setState({ dist: parseFloat(e.target.value) }); } },
        { id: 'f-t', name: 'Fibre attenuation', label: s.atten.toFixed(2) + ' dB/km' + (s.atten <= 0.22 ? ' (1550 nm)' : s.atten <= 0.4 ? ' (1310 nm)' : ' (850 nm)'), min: 0.15, max: 3, step: 0.05, v: s.atten, set: function (e) { self.setState({ atten: parseFloat(e.target.value) }); } },
        { id: 'f-c', name: 'Number of colour channels (DWDM)', label: s.ch + ' channels', min: 1, max: 96, step: 1, v: s.ch, set: function (e) { self.setState({ ch: parseInt(e.target.value, 10) }); } }
      ],
      rates: [10, 100, 400, 800].map(function (r) { var q = pill(s.rate === r); return { name: r + 'G', pressed: s.rate === r ? 'true' : 'false', bg: q.bg, fg: q.fg, border: q.border, pick: function () { self.setState({ rate: r }); } }; }),
      aria: 'Light in fibre, angle ' + s.rayA + ' degrees ' + (trapped ? 'guided along the core' : 'leaking out') + ' NA ' + NA.toFixed(3)
    };

    return {
      pe: pe, tn: tn, qd: qd, qb: qb, fb: fb, L: s.L, amp: s.amp,
      setL: function (e) { self.setState({ L: parseFloat(e.target.value) }); },
      toggleAmp: function () { self.setState({ amp: !self.state.amp }); },
      measure1: function () {
        var st = self.state, pz = st.re0 * st.re0 + st.im0 * st.im0, r = self.rnd() < pz ? 0 : 1;
        var prev = st.shots || [0, 0]; prev = [prev[0] + (r === 0 ? 1 : 0), prev[1] + (r === 1 ? 1 : 0)];
        self.setState({ re0: r === 0 ? 1 : 0, im0: 0, re1: r === 1 ? 1 : 0, im1: 0, shots: prev, log: 'Measured ' + r + ' ; the state collapsed to |' + r + '⟩ (measuring again always gives ' + r + ' )' });
      },
      measure100: function () {
        var st = self.state, pz = st.re0 * st.re0 + st.im0 * st.im0, n0 = 0;
        for (var i = 0; i < 1000; i++) if (self.rnd() < pz) n0++;
        self.setState({ shots: [n0, 1000 - n0], log: 'The same state was prepared 1,000 times and measured once each; results follow the probabilities |α|² and |β|²' });
      },
      qReset: function () { self.setState({ re0: 1, im0: 0, re1: 0, im1: 0, shots: null, log: 'Initial state |0⟩' }); }
    };
  }
}
</script>
