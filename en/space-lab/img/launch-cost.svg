<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" role="img" aria-label="Launch cost per kg to low orbit" font-family="IBM Plex Sans Thai, system-ui, sans-serif" font-size="12"><rect width="760" height="412" fill="#fff"/><text x="24.0" y="30.0" font-size="16" font-weight="600" fill="#1d2733">Launch cost per kg to low orbit fell tens of times once rockets became reusable</text><text x="24.0" y="54.0" font-size="12.5" fill="#5d6b78">Falcon Heavy is about 36× cheaper than the Space Shuttle · US$ per kg (roughly inflation-adjusted) · log scale</text><line x1="80" x2="730" y1="350.0" y2="350.0" stroke="#e3e8ec"/><text x="70.0" y="354.0" text-anchor="end" font-size="11.5" fill="#5d6b78">$100</text><line x1="80" x2="730" y1="265.3" y2="265.3" stroke="#e3e8ec"/><text x="70.0" y="269.3" text-anchor="end" font-size="11.5" fill="#5d6b78">$1,000</text><line x1="80" x2="730" y1="180.7" y2="180.7" stroke="#e3e8ec"/><text x="70.0" y="184.7" text-anchor="end" font-size="11.5" fill="#5d6b78">$10,000</text><line x1="80" x2="730" y1="96.0" y2="96.0" stroke="#e3e8ec"/><text x="70.0" y="100.0" text-anchor="end" font-size="11.5" fill="#5d6b78">$100,000</text><text x="80.0" y="374.0" text-anchor="middle" font-size="11.5" fill="#5d6b78">1960</text><text x="168.6" y="374.0" text-anchor="middle" font-size="11.5" fill="#5d6b78">1970</text><text x="257.1" y="374.0" text-anchor="middle" font-size="11.5" fill="#5d6b78">1980</text><text x="345.7" y="374.0" text-anchor="middle" font-size="11.5" fill="#5d6b78">1990</text><text x="434.3" y="374.0" text-anchor="middle" font-size="11.5" fill="#5d6b78">2000</text><text x="522.9" y="374.0" text-anchor="middle" font-size="11.5" fill="#5d6b78">2010</text><text x="611.4" y="374.0" text-anchor="middle" font-size="11.5" fill="#5d6b78">2020</text><text x="700.0" y="374.0" text-anchor="middle" font-size="11.5" fill="#5d6b78">2030</text><circle cx="142.0" cy="203.3" r="6" fill="#c3c2b6"/><text x="153.0" y="207.3" text-anchor="start" fill="#1d2733"><tspan font-weight="600">Saturn V</tspan><tspan fill="#5d6b78"> $5,400</tspan></text><circle cx="266.0" cy="118.3" r="6" fill="#c3c2b6"/><text x="277.0" y="122.3" text-anchor="start" fill="#1d2733"><tspan font-weight="600">Space Shuttle</tspan><tspan fill="#5d6b78"> $54,500</tspan></text><circle cx="328.0" cy="159.1" r="6" fill="#c3c2b6"/><text x="328.0" y="146.1" text-anchor="middle" fill="#1d2733"><tspan font-weight="600">Ariane 4</tspan><tspan fill="#5d6b78"> $18,000</tspan></text><circle cx="398.9" cy="184.5" r="6" fill="#c3c2b6"/><text x="398.9" y="206.5" text-anchor="middle" fill="#1d2733"><tspan font-weight="600">Ariane 5</tspan><tspan fill="#5d6b78"> $9,000</tspan></text><circle cx="452.0" cy="184.5" r="6" fill="#c3c2b6"/><text x="452.0" y="171.5" text-anchor="middle" fill="#1d2733"><tspan font-weight="600">Atlas V</tspan><tspan fill="#5d6b78"> $9,000</tspan></text><circle cx="522.9" cy="228.8" r="6" fill="#2b74d8"/><text x="522.9" y="215.8" text-anchor="middle" fill="#1d2733"><tspan font-weight="600">Falcon 9</tspan><tspan fill="#5d6b78"> $2,700</tspan></text><circle cx="593.7" cy="250.4" r="6" fill="#2b74d8"/><text x="593.7" y="272.4" text-anchor="middle" fill="#1d2733"><tspan font-weight="600">Falcon Heavy</tspan><tspan fill="#5d6b78"> $1,500</tspan></text><circle cx="664.6" cy="324.5" r="6" fill="none" stroke="#2b74d8" stroke-width="1.5" stroke-dasharray="3 2"/><text x="653.6" y="328.5" text-anchor="end" fill="#1d2733"><tspan font-weight="600">Starship (target)</tspan><tspan fill="#5d6b78"> $200</tspan></text><text x="24.0" y="400.0" font-size="11.5" fill="#5d6b78">Blue = SpaceX reusable rockets · grey = expendable / Shuttle era · dashed ring = target not yet achieved</text></svg>