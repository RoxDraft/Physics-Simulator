<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Orbital launches per year" font-family="IBM Plex Sans Thai, system-ui, sans-serif" font-size="12"><rect width="760" height="360" fill="#fff"/><text x="24.0" y="30.0" font-size="16" font-weight="600" fill="#1d2733">Orbital launches per year have beaten the Cold War record</text><text x="24.0" y="52.0" font-size="12.5" fill="#5d6b78">2025: about 320 launches, about 2.3× the 1967 peak · orbital launch attempts worldwide per year</text><line x1="56" x2="720" y1="320.0" y2="320.0" stroke="#9aa5ae"/><text x="48.0" y="324.0" text-anchor="end" font-size="11.5" fill="#5d6b78">0</text><line x1="56" x2="720" y1="250.3" y2="250.3" stroke="#e3e8ec"/><text x="48.0" y="254.3" text-anchor="end" font-size="11.5" fill="#5d6b78">100</text><line x1="56" x2="720" y1="180.6" y2="180.6" stroke="#e3e8ec"/><text x="48.0" y="184.6" text-anchor="end" font-size="11.5" fill="#5d6b78">200</text><line x1="56" x2="720" y1="110.9" y2="110.9" stroke="#e3e8ec"/><text x="48.0" y="114.9" text-anchor="end" font-size="11.5" fill="#5d6b78">300</text><text x="84.9" y="340.0" text-anchor="middle" font-size="11.5" fill="#5d6b78">1960</text><text x="181.1" y="340.0" text-anchor="middle" font-size="11.5" fill="#5d6b78">1970</text><text x="277.3" y="340.0" text-anchor="middle" font-size="11.5" fill="#5d6b78">1980</text><text x="373.6" y="340.0" text-anchor="middle" font-size="11.5" fill="#5d6b78">1990</text><text x="469.8" y="340.0" text-anchor="middle" font-size="11.5" fill="#5d6b78">2000</text><text x="566.0" y="340.0" text-anchor="middle" font-size="11.5" fill="#5d6b78">2010</text><text x="662.3" y="340.0" text-anchor="middle" font-size="11.5" fill="#5d6b78">2020</text><path d="M56.0 317.9 L84.9 306.1 L133.0 241.9 L152.2 223.1 L181.1 240.5 L229.2 232.9 L277.3 246.8 L315.8 230.1 L373.6 239.1 L421.7 264.2 L469.8 260.7 L517.9 281.7 L566.0 268.4 L614.1 259.3 L643.0 240.5 L662.3 240.5 L671.9 218.2 L681.5 190.3 L691.1 164.5 L700.8 139.4 L710.4 96.9" fill="none" stroke="#c3c2b6" stroke-width="2"/><circle cx="56.0" cy="317.9" r="3" fill="#c3c2b6"/><circle cx="84.9" cy="306.1" r="3" fill="#c3c2b6"/><circle cx="133.0" cy="241.9" r="3" fill="#c3c2b6"/><circle cx="152.2" cy="223.1" r="3" fill="#c3c2b6"/><circle cx="181.1" cy="240.5" r="3" fill="#c3c2b6"/><circle cx="229.2" cy="232.9" r="3" fill="#c3c2b6"/><circle cx="277.3" cy="246.8" r="3" fill="#c3c2b6"/><circle cx="315.8" cy="230.1" r="3" fill="#c3c2b6"/><circle cx="373.6" cy="239.1" r="3" fill="#c3c2b6"/><circle cx="421.7" cy="264.2" r="3" fill="#c3c2b6"/><circle cx="469.8" cy="260.7" r="3" fill="#c3c2b6"/><circle cx="517.9" cy="281.7" r="3" fill="#c3c2b6"/><circle cx="566.0" cy="268.4" r="3" fill="#c3c2b6"/><circle cx="614.1" cy="259.3" r="3" fill="#c3c2b6"/><circle cx="643.0" cy="240.5" r="3" fill="#c3c2b6"/><circle cx="662.3" cy="240.5" r="3" fill="#c3c2b6"/><circle cx="671.9" cy="218.2" r="3" fill="#c3c2b6"/><circle cx="681.5" cy="190.3" r="3" fill="#c3c2b6"/><circle cx="691.1" cy="164.5" r="3" fill="#c3c2b6"/><circle cx="700.8" cy="139.4" r="3" fill="#c3c2b6"/><circle cx="710.4" cy="96.9" r="6" fill="#2b74d8"/><text x="152.2" y="211.1" text-anchor="middle" fill="#1d2733" font-weight="600">1967: ~139</text><text x="132.2" y="175.1" font-size="11.5" fill="#5d6b78">Cold War: the USSR launched short-lived</text><text x="132.2" y="190.1" font-size="11.5" fill="#5d6b78">spy satellites over 90 times a year</text><text x="517.9" y="297.7" text-anchor="middle" fill="#1d2733" font-weight="600">2005: ~55</text><text x="517.9" y="311.7" text-anchor="middle" font-size="11.5" fill="#5d6b78">longer-lived satellites, fewer launches</text><text x="698.4" y="100.9" text-anchor="end" fill="#1d2733" font-weight="600">2025: ~320</text><text x="698.4" y="116.9" text-anchor="end" font-size="11.5" fill="#5d6b78">reusable rockets + Starlink constellation</text></svg>