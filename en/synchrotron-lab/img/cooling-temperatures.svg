<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 334" role="img" aria-label="Temperatures reached by laser cooling" font-family="IBM Plex Sans Thai, system-ui, sans-serif" font-size="12"><rect width="760" height="334" fill="#fff"/><text x="24.0" y="28.0" font-size="15" font-weight="600" fill="#1d2733">Lasers can make atoms millions of times colder than deep space</text><text x="24.0" y="48.0" font-size="11.5" fill="#5d6b78">Kelvin (log scale) · blue = reached with lasers (BEC uses lasers first, then evaporative cooling), grey = reference points</text><line x1="250" x2="712" y1="92" y2="92" stroke="#e3e8ec"/><text x="24.0" y="96.0" fill="#1d2733">Room temperature</text><circle cx="690.0" cy="92" r="6" fill="#c3c2b6"/><text x="678.0" y="96.0" text-anchor="end" font-size="11.5" fill="#5d6b78">300 K</text><line x1="250" x2="712" y1="122" y2="122" stroke="#e3e8ec"/><text x="24.0" y="126.0" fill="#1d2733">Yb:YLF crystal, laser-cooled</text><circle cx="668.3" cy="122" r="6" fill="#2b74d8"/><text x="656.3" y="126.0" text-anchor="end" font-size="11.5" fill="#1d2733">91 K</text><line x1="250" x2="712" y1="152" y2="152" stroke="#e3e8ec"/><text x="24.0" y="156.0" fill="#1d2733">Liquid nitrogen</text><circle cx="665.2" cy="152" r="6" fill="#c3c2b6"/><text x="653.2" y="156.0" text-anchor="end" font-size="11.5" fill="#5d6b78">77 K</text><line x1="250" x2="712" y1="182" y2="182" stroke="#e3e8ec"/><text x="24.0" y="186.0" fill="#1d2733">Deep space (background radiation)</text><circle cx="604.1" cy="182" r="6" fill="#c3c2b6"/><text x="616.1" y="186.0" text-anchor="start" font-size="11.5" fill="#5d6b78">2.7 K</text><line x1="250" x2="712" y1="212" y2="212" stroke="#e3e8ec"/><text x="24.0" y="216.0" fill="#1d2733">Doppler cooling (rubidium)</text><circle cx="424.9" cy="212" r="6" fill="#2b74d8"/><text x="436.9" y="216.0" text-anchor="start" font-size="11.5" fill="#1d2733">146 µK</text><line x1="250" x2="712" y1="242" y2="242" stroke="#e3e8ec"/><text x="24.0" y="246.0" fill="#1d2733">Sub-Doppler / Sisyphus</text><circle cx="354.0" cy="242" r="6" fill="#2b74d8"/><text x="366.0" y="246.0" text-anchor="start" font-size="11.5" fill="#1d2733">3 µK</text><line x1="250" x2="712" y1="272" y2="272" stroke="#e3e8ec"/><text x="24.0" y="276.0" fill="#1d2733">Bose-Einstein condensate</text><circle cx="292.0" cy="272" r="6" fill="#2b74d8"/><text x="304.0" y="276.0" text-anchor="start" font-size="11.5" fill="#1d2733">100 nK</text><line x1="250" x2="712" y1="294" y2="294" stroke="#9aa5ae"/><line x1="250.0" x2="250.0" y1="294" y2="299" stroke="#9aa5ae"/><text x="250.0" y="314.0" text-anchor="middle" font-size="11" fill="#5d6b78">10 nK</text><line x1="334.0" x2="334.0" y1="294" y2="299" stroke="#9aa5ae"/><text x="334.0" y="314.0" text-anchor="middle" font-size="11" fill="#5d6b78">1 µK</text><line x1="418.0" x2="418.0" y1="294" y2="299" stroke="#9aa5ae"/><text x="418.0" y="314.0" text-anchor="middle" font-size="11" fill="#5d6b78">100 µK</text><line x1="502.0" x2="502.0" y1="294" y2="299" stroke="#9aa5ae"/><text x="502.0" y="314.0" text-anchor="middle" font-size="11" fill="#5d6b78">10 mK</text><line x1="586.0" x2="586.0" y1="294" y2="299" stroke="#9aa5ae"/><text x="586.0" y="314.0" text-anchor="middle" font-size="11" fill="#5d6b78">1 K</text><line x1="670.0" x2="670.0" y1="294" y2="299" stroke="#9aa5ae"/><text x="670.0" y="314.0" text-anchor="middle" font-size="11" fill="#5d6b78">100 K</text></svg>