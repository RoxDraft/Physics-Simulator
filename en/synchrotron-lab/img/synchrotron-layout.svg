<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 470" role="img" aria-label="Synchrotron light source layout" font-family="IBM Plex Sans Thai, system-ui, sans-serif" font-size="12"><rect width="850" height="470" fill="#fff"/><defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa5ae"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e39a26"/></marker></defs><text x="24.0" y="30.0" font-size="14" font-weight="600" fill="#1d2733">Electrons are accelerated in 3 stages, then circulate in the storage ring and emit light along the tangent</text><rect x="24" y="80" width="128" height="44" rx="8" fill="none" stroke="#9aa5ae" stroke-width="1.25"/><text x="88.0" y="106.0" text-anchor="middle" fill="#1d2733" font-size="13">1 Electron gun</text><rect x="24" y="160" width="128" height="44" rx="8" fill="none" stroke="#9aa5ae" stroke-width="1.25"/><text x="88.0" y="186.0" text-anchor="middle" fill="#1d2733" font-size="13">2 Linac</text><circle cx="88" cy="310" r="56" fill="none" stroke="#9aa5ae" stroke-width="1.25"/><text x="88.0" y="306.0" text-anchor="middle" fill="#1d2733" font-size="13">3 Booster</text><text x="88.0" y="324.0" text-anchor="middle" font-size="11.5" fill="#5d6b78">to full energy</text><g fill="none" stroke="#9aa5ae" stroke-width="1.25"><path d="M88 124V160" marker-end="url(#a1)"/><path d="M88 204V254" marker-end="url(#a1)"/><path d="M144 310L282 292" marker-end="url(#a1)"/></g><text x="212.0" y="290.0" text-anchor="middle" font-size="11.5" fill="#5d6b78">injection</text><circle cx="430" cy="250" r="150" fill="none" stroke="#2b74d8" stroke-width="3"/><rect x="550.9" y="316.0" width="18" height="18" rx="3" fill="#3aa57a" fill-opacity="0.5" stroke="#9aa5ae"/><rect x="291.1" y="316.0" width="18" height="18" rx="3" fill="#3aa57a" fill-opacity="0.5" stroke="#9aa5ae"/><rect x="291.1" y="166.0" width="18" height="18" rx="3" fill="#3aa57a" fill-opacity="0.5" stroke="#9aa5ae"/><rect x="550.9" y="166.0" width="18" height="18" rx="3" fill="#3aa57a" fill-opacity="0.5" stroke="#9aa5ae"/><text x="430.0" y="242.0" text-anchor="middle" font-weight="600" fill="#1d2733" font-size="13">4 Storage ring</text><text x="430.0" y="264.0" text-anchor="middle" font-size="11.5" fill="#5d6b78">electrons circulate at nearly light speed</text><text x="430.0" y="282.0" text-anchor="middle" font-size="11.5" fill="#5d6b78">in a vacuum pipe for many hours</text><rect x="380" y="91" width="100" height="18" rx="3" fill="#2b74d8" fill-opacity="0.15" stroke="#2b74d8" stroke-width="1.5"/><rect x="380" y="91" width="10" height="18" fill="#2b74d8" fill-opacity="0.45"/><rect x="400" y="91" width="10" height="18" fill="#2b74d8" fill-opacity="0.45"/><rect x="420" y="91" width="10" height="18" fill="#2b74d8" fill-opacity="0.45"/><rect x="440" y="91" width="10" height="18" fill="#2b74d8" fill-opacity="0.45"/><rect x="460" y="91" width="10" height="18" fill="#2b74d8" fill-opacity="0.45"/><text x="430.0" y="150.0" text-anchor="middle" font-size="11.5" fill="#1d2733">Undulator: alternating magnets</text><text x="430.0" y="166.0" text-anchor="middle" font-size="11.5" fill="#1d2733">give very bright light</text><rect x="396" y="389" width="68" height="22" rx="4" fill="#e8743b" fill-opacity="0.25" stroke="#9aa5ae" stroke-width="1.25"/><text x="430.0" y="434.0" text-anchor="middle" fill="#1d2733" font-size="13">RF cavity: tops up the energy lost to light every turn</text><path d="M570 196L604 214" fill="none" stroke="#9aa5ae"/><text x="608.0" y="222.0" fill="#1d2733" font-size="13">Bending magnet (dipole)</text><text x="608.0" y="240.0" font-size="11.5" fill="#5d6b78">forces the turn = where light is made</text><path d="M482 100H596" fill="none" stroke="#e39a26" stroke-width="3" marker-end="url(#a2)"/><text x="540.0" y="88.0" text-anchor="middle" font-size="11.5" fill="#1d2733">synchrotron light</text><rect x="600" y="78" width="136" height="44" rx="8" fill="none" stroke="#9aa5ae" stroke-width="1.25"/><text x="668.0" y="104.0" text-anchor="middle" fill="#1d2733" font-size="13">5 Experiment station</text></svg>