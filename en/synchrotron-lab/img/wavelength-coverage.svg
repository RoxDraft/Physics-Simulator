<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="img" aria-label="Wavelength coverage of synchrotrons and lasers" font-family="IBM Plex Sans Thai, system-ui, sans-serif" font-size="12"><rect width="760" height="410" fill="#fff"/><text x="24.0" y="28.0" font-size="15" font-weight="600" fill="#1d2733">A synchrotron covers 7 orders of magnitude; each laser uses one wavelength</text><text x="24.0" y="48.0" font-size="11.5" fill="#5d6b78">Wavelength (log scale) · blue = electron accelerators, grey = ordinary lasers / plasma sources</text><line x1="422.0" x2="422.0" y1="74" y2="364" stroke="#e3e8ec" stroke-dasharray="3 3"/><text x="311.0" y="84.0" text-anchor="middle" font-size="11.5" fill="#5d6b78">X-ray</text><line x1="538.9" x2="538.9" y1="74" y2="364" stroke="#e3e8ec" stroke-dasharray="3 3"/><text x="480.5" y="84.0" text-anchor="middle" font-size="11.5" fill="#5d6b78">UV / EUV</text><rect x="538.9" y="88" width="21.9" height="276" fill="#f3efe2"/><line x1="560.8" x2="560.8" y1="74" y2="364" stroke="#e3e8ec" stroke-dasharray="3 3"/><text x="549.8" y="84.0" text-anchor="middle" font-size="11.5" fill="#5d6b78">Visible</text><line x1="718.0" x2="718.0" y1="74" y2="364" stroke="#e3e8ec" stroke-dasharray="3 3"/><text x="639.4" y="84.0" text-anchor="middle" font-size="11.5" fill="#5d6b78">Infrared</text><line x1="200" x2="718" y1="118" y2="118" stroke="#e3e8ec"/><text x="24.0" y="122.0" fill="#1d2733">Synchrotron</text><line x1="200.0" x2="718.0" y1="118" y2="118" stroke="#2b74d8" stroke-width="8" stroke-linecap="round"/><text x="459.0" y="108.0" text-anchor="middle" font-size="11.5" fill="#1d2733">0.01 nm – 100 µm</text><line x1="200" x2="718" y1="150" y2="150" stroke="#e3e8ec"/><text x="24.0" y="154.0" fill="#1d2733">X-ray FEL</text><line x1="251.7" x2="496.0" y1="150" y2="150" stroke="#2b74d8" stroke-width="8" stroke-linecap="round"/><text x="508.0" y="154.0" text-anchor="start" font-size="11.5" fill="#1d2733">0.05 nm – 100 nm</text><line x1="200" x2="7