<header style="display: flex; flex-direction: column; gap: 8px; max-width: 900px">
<div style="font-size: 14px; font-weight: 600; letter-spacing: 0.08em; color: #0A6A94">THERMODYNAMICS · อุณหพลศาสตร์</div>
<h1 style="margin: 0; font-size: clamp(30px, 4vw, 46px); line-height: 1.2; font-weight: 700">ความร้อนไหลไปไหน: ระบายความร้อนชิป และแอร์ในบ้าน</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #4A5D6A">ไฟฟ้าทุกวัตต์ที่ชิปใช้กลายเป็นความร้อน และความร้อนไหลจากที่ร้อนไปที่เย็นเสมอ การระบายความร้อนคือการทำทางให้ความร้อนไหลออกง่ายที่สุด ส่วนแอร์ทำสิ่งที่ธรรมชาติไม่ทำเอง คือใช้งานไฟฟ้า "สูบ" ความร้อนจากห้องเย็นไปทิ้งข้างนอกที่ร้อนกว่า</p>
</header>

<section style="display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">

<span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600">{{ch.clock}}</span>
<span style="font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: 999px; background: {{ch.bg}}; color: {{ch.fg}}">{{ch.badge}}</span>
</div>
<svg viewBox="0 0 900 300" style="display: block; width: 100%; height: auto; background: #FBFCFD" role="img" aria-label="{{ch.aria}}">

<text x="240" y="232" font-size="11" text-anchor="middle" fill="#FFFFFF" font-weight="700">{{ch.dieT}}</text>

<path d="{{ch.blade}}" stroke="#D5DEE3" stroke-width="3" opacity="{{ch.fanO}}"></path>
<path d="{{ch.air}}" fill="none" stroke="#0A6A94" stroke-width="2" opacity="0.7"></path>
<path d="{{ch.hot}}" fill="none" stroke="#B04A0C" stroke-width="2" opacity="0.7"></path>
<path d="{{ch.pipe}}" fill="none" stroke="#0A6A94" stroke-width="6" opacity="{{ch.pipeO}}"></path>
<text x="40" y="276" font-size="12" fill="#4A5D6A">{{ch.cap}}</text>
<line x1="470" y1="20" x2="470" y2="270" stroke="#E3E9EC"></line>
<text x="490" y="30" font-size="12" fill="#4A5D6A">อุณหภูมิ (°C) · {{ch.span}}</text>
<line x1="490" y1="250" x2="880" y2="250" stroke="#9AAAB4"></line>
<line x1="490" y1="40" x2="490" y2="250" stroke="#9AAAB4"></line>

<line x1="490" y1="{{t.y}}" x2="880" y2="{{t.y}}" stroke="#EEF2F4"></line>

<path d="{{ch.lineH}}" fill="none" stroke="#0A6A94" stroke-width="2"></path>
<text x="880" y="270" font-size="11" text-anchor="end" fill="#4A5D6A">ส้ม = ชิป · ฟ้า = ฮีตซิงก์</text>
</svg>
</div>

</sc-for>
</div>
<span style="font-size: 14px; font-weight: 600">ตัวระบายความร้อน</span>
<div role="group" aria-label="ตัวระบายความร้อน" style="display: flex; flex-wrap: wrap; gap: 6px">

<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="flex: 1 1 100px; min-height: 44px; padding: 4px 10px; border-radius: 10px; border: 1.5px solid {{p.border}}; background: {{p.bg}}; color: {{p.fg}}; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; line-height: 1.3">{{p.name}}</button>

<div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 1.9">ΔT = P · R_รวม (เหมือน V = I·R)<br>R_รวม = R_ชิป + R_ซิลิโคน + R_ฮีตซิงก์<br>C·dT/dt = P_เข้า − P_ออก<br>ฮีตซิงก์: q = h·A·ΔT</div>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #B9D3DF">ความร้อนเปรียบเหมือนกระแส อุณหภูมิเหมือนแรงดัน และความต้านทานความร้อน (K/W) เหมือนตัวต้านทาน ครีบเพิ่มพื้นที่ A พัดลมเพิ่ม h ส่วนน้ำมีความจุความร้อนสูงกว่าอากาศราว 3,500 เท่าต่อปริมาตร จึงพาความร้อนได้มากในท่อเล็ก ๆ</p>
</div>
</div>

</sc-for>

</div>
<span style="font-size: 14px; font-weight: 600">ขนาดแอร์</span>
<div role="group" aria-label="ขนาดแอร์" style="display: flex; flex-wrap: wrap; gap: 6px">

</sc-for>
</div>
<sc-for list="{{ac.checks}}" as="t" hint-placeholder-count="4">

</sc-for>
</div>
<div style="background: #0F2A3A; color: #FFFFFF; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: #9FD0E6">กฎข้อที่หนึ่งและสอง</div>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 1.9">Q_ทิ้งข้างนอก = Q_ดูดจากห้อง + W<br>COP = Q_ดูดจากห้อง / W<br>COP_สูงสุด = T_เย็น / (T_ร้อน − T_เย็น)<br>(อุณหภูมิเป็นเคลวิน)</div>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #B9D3DF">ยิ่งข้างนอกร้อนหรือตั้งอุณหภูมิห้องต่ำ ช่วงอุณหภูมิที่ต้องปั๊มยิ่งกว้าง COP ยิ่งต่ำ แอร์จึงกินไฟมากขึ้นตอนบ่าย ตั้งแอร์สูงขึ้น 1 °C จึงประหยัดไฟได้ราวไม่กี่เปอร์เซ็นต์ คอยล์ร้อนต้องอยู่ที่ลมถ่ายเทได้ ถ้าตั้งในที่อับ ความร้อนวนกลับมา คอยล์ร้อนยิ่งร้อน COP ยิ่งตก</p>
</div>
</div>
</div>
</section>

</div>
</sc-for>
</div>
</section>

      tin: A.Tin.toFixed(1) + ' °C', tout: s.out + ' °C', dots: 'M0,0', hotDots: hotD, coldDots: coldD,
      qc: 'ดูดความร้อน ' + kw(A.Q), qh: 'ทิ้ง ' + kw(A.Q + A.W), w: 'ไฟฟ้า ' + kw(A.W), te: '~' + A.Te.toFixed(0) + ' °C', tc: '~' + A.Tc.toFixed(0) + ' °C',
      badge: A.short ? 'แอร์เล็กเกินไป' : 'เย็นถึง ' + s.set + ' °C', bg: A.short ? '#FCE3CF' : '#DDEFF6', fg: A.short ? '#7E3407' : '#0A4F70',
      loadTxt: kw(A.need),
      bars: parts.map(function (q) { return { n: q.n, w: Math.max(0, q.v / pmax * 100).toFixed(1) + '%', c: q.c, v: Math.round(q.v) + ' W' }; }),
      stats: [
        { k: 'COP จริง (โดยประมาณ)', v: A.COP.toFixed(2), sub: 'สูงสุดตามทฤษฎี (คาร์โนต์) ' + A.carnot.toFixed(1), c: '#0F2A3A' },
        { k: 'ไฟฟ้าที่แอร์ใช้', v: kw(A.W), sub: 'ความเย็น ' + kw(A.Q) + ' ÷ COP', c: '#0F2A3A' },
        { k: 'ค่าไฟต่อเดือน', v: Math.round(kwh * 4.2).toLocaleString('en-US') + ' บาท', sub: 'เปิดวันละ ' + hours + ' ชม. · ' + Math.round(kwh) + ' หน่วย × 4.2 บาท (สมมติ)', c: '#0F2A3A' },
        { k: 'ขนาดแอร์ที่เหมาะ', v: Math.ceil(A.need / 0.293 / 1000) * 1000 > 0 ? (Math.ceil(A.need / 0.293 / 3000) * 3000).toLocaleString('en-US') + ' BTU' : '–', sub: 'คิดจากความร้อนที่เข้าห้องจริง ไม่ใช่แค่พื้นที่', c: '#0F2A3A' }
      ],
      msg: msg, msgBg: A.short ? '#FCE3CF' : '#EAF3F7', msgFg: A.short ? '#7E3407' : '#0F2A3A',
      sliders: [
        { id: 'a-o', name: 'อุณหภูมินอกบ้าน', label: s.out + ' °C', min: 26, max: 42, step: 1, v: s.out, set: function (e) { self.setState({ out: parseFloat(e.target.value) }); } },
        { id: 'a-s', name: 'ตั้งอุณหภูมิแอร์', label: s.set + ' °C', min: 20, max: 28, step: 1, v: s.set, set: function (e) { self.setState({ set: parseFloat(e.target.value) }); } },
        { id: 'a-a', name: 'ขนาดห้อง', label: s.area + ' ตร.ม.', min: 9, max: 60, step: 1, v: s.area, set: function (e) { self.setState({ area: parseFloat(e.target.value) }); } },
        { id: 'a-w', name: 'พื้นที่กระจกหน้าต่าง', label: s.win + ' ตร.ม.', min: 0, max: 12, step: 0.5, v: s.win, set: function (e) { self.setState({ win: parseFloat(e.target.value) }); } },
        { id: 'a-p', name: 'จำนวนคน', label: s.people + ' คน', min: 0, max: 8, step: 1, v: s.people, set: function (e) { self.setState({ people: parseFloat(e.target.value) }); } },
        { id: 'a-e', name: 'เครื่องใช้ไฟฟ้า (ทีวี คอม ไฟ)', label: s.appl + ' W', min: 0, max: 1500, step: 50, v: s.appl, set: function (e) { self.setState({ appl: parseFloat(e.target.value) }); } }
      ],
      dirs: [{ id: 'north', name: 'เหนือ' }, { id: 'east', name: 'ตะวันออก' }, { id: 'south', name: 'ใต้' }, { id: 'west', name: 'ตะวันตก' }].map(function (d) { var q = pill(s.dir === d.id); return { name: d.name, pressed: s.dir === d.id ? 'true' : 'false', bg: q.bg, fg: q.fg, border: q.border, pick: function () { self.setState({ dir: d.id }); } }; }),
      sizes: [9000, 12000, 18000, 24000].map(function (z) { var q = pill(s.size === z); return { name: z.toLocaleString('en-US') + ' BTU', pressed: s.size === z ? 'true' : 'false', bg: q.bg, fg: q.fg, border: q.border, pick: function () { self.setState({ size: z }); } }; }),
      checks: [
        { name: 'แอร์อินเวอร์เตอร์', k: 'inverter' }, { name: 'ผนังและหลังคามีฉนวน', k: 'insul' }, { name: 'กระจก Low-E หรือติดฟิล์มกันร้อน', k: 'lowe' },
        { name: 'ปิดม่านกันแดด', k: 'curtain' }, { name: 'ห้องชั้นบนสุด (ใต้หลังคา)', k: 'roof' }
      ].map(function (x) { return { name: x.name, on: !!s[x.k], toggle: function () { var o = {}; o[x.k] = !self.state[x.k]; self.setState(o); } }; }),
      aria: 'แอร์ ' + s.size + ' บีทียู ห้อง ' + s.area + ' ตารางเมตร ใช้ไฟ ' + kw(A.W)
    };

    var cards = [
      { tag: 'เปลี่ยนสถานะ', t: 'ท่อนำความร้อนและ vapor chamber', d: 'ข้างในมีของเหลวเล็กน้อย ระเหยที่ปลายร้อน แล้วไปควบแน่นที่ปลายเย็น การเปลี่ยนสถานะพาความร้อนได้มากกว่าทองแดงตันหลายสิบเท่า ใช้ในโน้ตบุ๊ก มือถือ และฮีตซิงก์ CPU' },
      { tag: 'รถยนต์', t: 'หม้อน้ำและน้ำยาหล่อเย็น', d: 'เครื่องยนต์เผาเชื้อเพลิง แต่ได้เป็นงานแค่ราว 30–40% ที่เหลือเป็นความร้อน ปั๊มน้ำพาน้ำยาผ่านเครื่องไปหม้อน้ำหน้ารถ วาล์วน้ำเปิดเมื่อร้อนถึงอุณหภูมิทำงาน' },
      { tag: 'รถไฟฟ้า', t: 'แบตเตอรี่ต้องไม่ร้อนและไม่เย็นเกิน', d: 'แบตเตอรี่ลิเธียมเสื่อมเร็วเมื่อร้อน และอาจเกิดความร้อนสะสมจนลุกไหม้ (thermal runaway) จึงมีแผ่นน้ำหล่อเย็นใต้แบต และใช้แอร์ของรถช่วยดึงความร้อนตอนชาร์จเร็ว' },
      { tag: 'ดาต้าเซ็นเตอร์', t: 'ระบายความร้อนชิป AI ด้วยน้ำ', d: 'ตู้เซิร์ฟเวอร์ AI หนึ่งตู้ใช้ไฟหลายสิบถึงร้อยกว่ากิโลวัตต์ ลมพัดไม่ทันแล้ว จึงต่อท่อน้ำเข้าแผ่นเย็นบนชิปโดยตรง วัดประสิทธิภาพด้วย PUE = ไฟทั้งอาคาร ÷ ไฟที่คอมพิวเตอร์ใช้' },
      { tag: 'อาคารสูง', t: 'ชิลเลอร์และหอผึ่งเย็น', d: 'ห้างและคอนโดใหญ่ทำน้ำเย็นจากเครื่องชิลเลอร์ส่วนกลาง แล้วส่งตามท่อไปเครื่องเป่าลมแต่ละชั้น ความร้อนทิ้งที่หอผึ่งเย็นบนดาดฟ้า ซึ่งใช้การระเหยของน้ำช่วยดึงความร้อน' },
      { tag: 'เครื่องจักรโรงงาน', t: 'น้ำมันหล่อลื่นและน้ำหล่อเย็น', d: 'แท่นกลึงและเครื่องตัดโลหะพ่นน้ำหล่อเย็นที่จุดตัด มอเตอร์และระบบไฮดรอลิกมีออยล์คูลเลอร์ ถ้าความร้อนสะสม น้ำมันจะเสื่อม ซีลรั่ว และชิ้นงานขยายตัวจนขนาดเพี้ยน' }
    ];

    return {
      ch: ch, ac: ac, cards: cards, oldPaste: s.oldPaste,
      togglePaste: function () { self.setState({ oldPaste: !self.state.oldPaste }); },
      toggleLoad: function () { self.setState({ load: !self.state.load }); },
      resetChip: function () { self.setState({ Tj: self.state.Ta, Th: self.state.Ta, hist: [], simT: 0 }); }
    };
  }
}
</script>
</body>
</html>
