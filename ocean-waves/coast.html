<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>คลื่นใกล้ฝั่ง ชายหาด และแมงกะพรุน</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../shared/dc-runtime.js" defer></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F3F6F7}
a{color:#0A6A94}a:hover{color:#074E6E}
input[type=range]{width:100%;accent-color:#0A6A94;height:32px;margin:0;cursor:pointer}
a:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid #B04A0C;outline-offset:2px}
</style>
<style>
.ps-bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;
  padding:8px clamp(16px,3vw,40px);background:rgba(255,255,255,.94);backdrop-filter:blur(6px);
  border-bottom:1px solid #D5DEE3;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:15px;color:#4A5D6A}
.ps-bar a{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:999px;
  color:#0A6A94;font-weight:600;text-decoration:none}
.ps-bar a:hover{background:#EAF3F7}
.ps-bar a:focus-visible{outline:3px solid #B04A0C;outline-offset:2px}
.ps-bar .ps-home{background:#0F2A3A;color:#FFFFFF}
.ps-bar .ps-home:hover{background:#163A4F}
.ps-bar [aria-current]{font-weight:600;color:#0F2A3A}
.ps-bar .ps-lang{margin-left:auto;border:1.5px solid #0A6A94}
</style>
<script>document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[data-ps-lang]");if(a){try{localStorage.setItem("ps-lang",a.getAttribute("data-ps-lang"))}catch(_){}}});</script>
</head>
<body>
<nav class="ps-bar" aria-label="เส้นทางนำทาง"><a class="ps-home" href="../index.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path><path d="M10 21v-6h4v6"></path></svg>หน้าหลัก</a><span aria-hidden="true">›</span><a href="index.html">Ocean Wave Simulator</a><span aria-hidden="true">›</span><span aria-current="page">คลื่นใกล้ฝั่งและแมงกะพรุน</span><a class="ps-lang" href="../en/ocean-waves/coast.html" hreflang="en" lang="en" data-ps-lang="en" aria-label="เปลี่ยนเป็นภาษาอังกฤษ"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"></path></svg>English</a></nav>
<div id="dc-root"></div>
<template id="dc-template">
<div style="font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; color: #0F2A3A; background: #F3F6F7; box-sizing: border-box; padding: 40px clamp(16px, 3vw, 40px) 64px">
<div style="max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 36px">

<header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px; max-width: 900px">
<div style="font-size: 14px; font-weight: 600; letter-spacing: 0.08em; color: #0A6A94">OCEAN WAVE SIMULATOR · ใกล้ฝั่ง</div>
<h1 style="margin: 0; font-size: clamp(30px, 4vw, 46px); line-height: 1.2; font-weight: 700">เมื่อคลื่นถึงฝั่ง: การซัด การกัดเซาะ ชีวิตบนหาด และแมงกะพรุน</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #4A5D6A">คลื่นที่เดินทางมาจากกลางทะเลจะสูงขึ้นเมื่อน้ำตื้น แล้วแตกและวิ่งขึ้นหาด พลังงานที่เหลือย้ายทรายไปมา บางฤดูหาดกว้างขึ้น บางฤดูหาดหายไป และคลื่นกับลมชุดเดียวกันนี้ก็พาแมงกะพรุนมาเกยหาด</p>
</div>
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<a href="index.html" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 20px; border-radius: 999px; background: #0F2A3A; color: #FFFFFF; font-weight: 600; text-decoration: none">คลื่นกลางทะเล</a>
<a href="sources.html" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 20px; border-radius: 999px; border: 1.5px solid #0F2A3A; color: #0F2A3A; font-weight: 600; text-decoration: none">แหล่งข้อมูล</a>
</div>
</header>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 26px; font-weight: 700">1. คลื่นเข้าฝั่ง แตก และซัดขึ้นหาด</h2>
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<div style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; overflow: hidden">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid #E3E9EC; flex-wrap: wrap">
<span style="font-weight: 700">ภาพตัดขวางชายหาด</span>
<span style="font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: 999px; background: {{bp.bg}}; color: {{bp.fg}}">{{bp.badge}}</span>
</div>
<svg viewBox="0 0 900 340" style="display: block; width: 100%; height: auto; background: #EEF6FA" role="img" aria-label="{{bp.aria}}">
<rect x="0" y="0" width="900" height="340" fill="#F4F9FC"></rect>
<path d="{{bp.water}}" fill="#9CCBE0" opacity="0.85"></path>
<path d="{{bp.swash}}" fill="#BFE0EE" opacity="0.9"></path>
<path d="{{bp.foam}}" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"></path>
<path d="{{bp.oldSand}}" fill="none" stroke="#B9A57A" stroke-width="1.5" stroke-dasharray="5 4"></path>
<path d="{{bp.sand}}" fill="#E8D7A8" stroke="#B89B5E" stroke-width="2"></path>
<rect x="{{bp.wallX}}" y="{{bp.wallY}}" width="16" height="{{bp.wallH}}" fill="#8A97A0" opacity="{{bp.wallO}}"></rect>
<line x1="0" y1="{{bp.swlY}}" x2="900" y2="{{bp.swlY}}" stroke="#0A6A94" stroke-dasharray="4 5" stroke-width="1"></line>
<text x="8" y="{{bp.swlY}}" dy="-6" font-size="12" fill="#0A4F70">ระดับน้ำ (รวมน้ำขึ้นน้ำลง)</text>
<line x1="{{bp.ruX}}" y1="{{bp.ruY}}" x2="{{bp.ruX}}" y2="{{bp.ruY2}}" stroke="#B04A0C" stroke-width="2"></line>
<text x="{{bp.ruX}}" y="{{bp.ruY}}" dy="-8" font-size="12" text-anchor="middle" fill="#B04A0C" font-weight="600">ขอบน้ำซัดสูงสุด</text>
<line x1="{{bp.brX}}" y1="40" x2="{{bp.brX}}" y2="{{bp.swlY}}" stroke="#4A5D6A" stroke-dasharray="3 4"></line>
<text x="{{bp.brX}}" y="34" font-size="12" text-anchor="middle" fill="#4A5D6A">คลื่นแตก</text>
<sc-for list="{{bp.life}}" as="l" hint-placeholder-count="5">
<g opacity="{{l.o}}"><circle cx="{{l.x}}" cy="{{l.y}}" r="7" fill="{{l.fill}}" stroke="#0F2A3A" stroke-width="1.5"></circle><text x="{{l.x}}" y="{{l.ty}}" font-size="11" text-anchor="middle" fill="#0F2A3A" font-weight="600">{{l.n}}</text></g>
</sc-for>
<text x="10" y="328" font-size="12" fill="#4A5D6A">ทะเลลึก ←</text>
<text x="890" y="328" font-size="12" text-anchor="end" fill="#4A5D6A">→ แผ่นดิน · ความสูงขยาย 10 เท่า</text>
</svg>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px">
<sc-for list="{{bp.stats}}" as="r" hint-placeholder-count="6">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px">
<div style="font-size: 13px; font-weight: 600; color: #4A5D6A">{{r.k}}</div>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 19px; color: {{r.c}}">{{r.v}}</div>
<div style="font-size: 13px; line-height: 1.5; color: #4A5D6A">{{r.sub}}</div>
</div>
</sc-for>
</div>
<div style="background: {{bp.msgBg}}; border-radius: 14px; padding: 14px 18px; font-size: 15px; line-height: 1.7; color: {{bp.msgFg}}">{{bp.msg}}</div>
</div>

<div style="flex: 1 1 330px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; font-weight: 600">สถานการณ์ตัวอย่าง</span>
<div role="group" aria-label="สถานการณ์ตัวอย่าง" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{bp.presets}}" as="p" hint-placeholder-count="3">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="flex: 1 1 140px; min-height: 44px; padding: 4px 12px; border-radius: 10px; border: 1.5px solid {{p.border}}; background: {{p.bg}}; color: {{p.fg}}; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; text-align: left; line-height: 1.35">{{p.name}}</button>
</sc-for>
</div>
<sc-for list="{{bp.sliders}}" as="x" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; justify-content: space-between; gap: 8px"><label for="{{x.id}}" style="font-size: 14px; font-weight: 600">{{x.name}}</label><span style="font-family: 'IBM Plex Mono', monospace; color: #0A6A94; white-space: nowrap">{{x.label}}</span></div>
<input id="{{x.id}}" type="range" min="{{x.min}}" max="{{x.max}}" step="{{x.step}}" value="{{x.v}}" onChange="{{x.set}}">
</div>
</sc-for>
<label style="display: flex; align-items: center; gap: 10px; min-height: 40px; font-size: 14px; font-weight: 600; cursor: pointer"><input type="checkbox" checked="{{wall}}" onChange="{{toggleWall}}" style="width: 20px; height: 20px; accent-color: #0A6A94">สร้างกำแพงกันคลื่นบนหาด</label>
<div style="display: flex; gap: 8px">
<button type="button" onClick="{{resetBeach}}" style="flex: 1 1 0; min-height: 44px; border-radius: 999px; border: 1.5px solid #0A6A94; background: #FFFFFF; color: #0A6A94; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">คืนหาดเป็นแบบเดิม</button>
<button type="button" onClick="{{pauseBeach}}" style="flex: 1 1 0; min-height: 44px; border-radius: 999px; border: 1.5px solid #0A6A94; background: #0A6A94; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{bp.pauseTxt}}</button>
</div>
</div>
<div style="background: #0F2A3A; color: #FFFFFF; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: #9FD0E6">สูตรที่ใช้</div>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 1.9">L0 = g·T²/2π<br>Hb = 0.39·g^0.2·(T·H0²)^0.4<br>ξ = tanβ / √(H0/L0)<br>R2% = 1.1·(0.35·tanβ·√(H0·L0) + ½·√(H0·L0·(0.563·tan²β + 0.004)))<br>Ω = Hb / (ws·T)</div>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #B9D3DF">Hb คือความสูงคลื่นตอนแตก (Komar & Gaudiano) ξ คือเลขอิริบาร์เรนที่บอกชนิดคลื่นแตก R2% คือระยะน้ำซัดขึ้นที่คลื่น 2% สูงกว่านี้ (Stockdon และคณะ 2006) Ω คือเลขดีนที่บอกว่าหาดจะถูกกัดเซาะหรือสะสมทราย ws คือความเร็วตกตะกอนของทราย ราว 0.04 ม./วินาทีสำหรับทรายขนาดกลาง</p>
</div>
</div>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 26px; font-weight: 700">2. ชีวิตบนชายหาดได้รับผลอย่างไร</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px">
<sc-for list="{{lifeCards}}" as="c" hint-placeholder-count="5">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; gap: 8px; align-items: baseline"><span style="font-size: 17px; font-weight: 700">{{c.name}}</span><span style="font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: {{c.bg}}; color: {{c.fg}}; white-space: nowrap">{{c.state}}</span></div>
<div style="font-size: 13px; font-weight: 600; color: #0A6A94">{{c.zone}}</div>
<p style="margin: 0; font-size: 14px; line-height: 1.7; color: #34495A">{{c.text}}</p>
</div>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 26px; font-weight: 700">3. ทำไมแมงกะพรุนเกยหาด: ลอยตามลม หรือว่ายมาเอง</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4A5D6A; max-width: 960px">แมงกะพรุนส่วนใหญ่ว่ายน้ำได้อ่อน จึงไปตามกระแสน้ำ ลม และคลื่น แต่ไม่ใช่ทุกชนิด ลองเปลี่ยนลมและอาหารใกล้ฝั่ง แล้วดูว่าแต่ละชนิดไปจบที่ไหน ภาพมองจากด้านบน ฝั่งอยู่ด้านล่าง</p>
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<div style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; overflow: hidden">
<div style="display: flex; flex-wrap: wrap; gap: 14px; padding: 10px 16px; border-bottom: 1px solid #E3E9EC; font-size: 14px; justify-content: space-between">
<div style="display: flex; flex-wrap: wrap; gap: 14px">
<sc-for list="{{jf.legend}}" as="l" hint-placeholder-count="3">
<span style="display: inline-flex; align-items: center; gap: 6px"><svg width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="{{l.c}}"></circle></svg>{{l.n}}</span>
</sc-for>
</div>
<span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600">{{jf.clock}}</span>
</div>
<svg viewBox="0 0 900 320" style="display: block; width: 100%; height: auto" role="img" aria-label="{{jf.aria}}">
<rect x="0" y="0" width="900" height="320" fill="#CFE6F0"></rect>
<path d="{{jf.beach}}" fill="#EAD9AA"></path>
<path d="M660,320 C670,286 700,270 720,262 L760,262 C780,270 800,290 810,320 Z" fill="#B7D3C4"></path>
<text x="735" y="300" font-size="12" text-anchor="middle" fill="#2F5E46" font-weight="600">ปากแม่น้ำ</text>
<path d="{{jf.food}}" fill="#6E8B3D" opacity="0.6"></path>
<path d="{{jf.waves}}" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"></path>
<g transform="translate(60,54)"><circle r="26" fill="#FFFFFF" opacity="0.85"></circle><path d="{{jf.arrow}}" fill="none" stroke="#0F2A3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path><text y="44" font-size="12" text-anchor="middle" fill="#0F2A3A" font-weight="600">{{jf.windTxt}}</text></g>
<path d="{{jf.pPhys}}" fill="#5B4FC4"></path>
<path d="{{jf.pAur}}" fill="#E6A6C0" stroke="#B5527D" stroke-width="1"></path>
<path d="{{jf.pBox}}" fill="#B04A0C"></path>
<path d="{{jf.pStr}}" fill="#7A6A55" opacity="0.75"></path>
<text x="16" y="{{jf.shoreTxtY}}" font-size="12" fill="#6B5A35">ชายหาด · จุดสีน้ำตาล = แมงกะพรุนที่เกยแล้ว</text>
</svg>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<sc-for list="{{jf.counts}}" as="r" hint-placeholder-count="3">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px">
<div style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #4A5D6A"><svg width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="5" fill="{{r.c}}"></circle></svg>{{r.k}}</div>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 19px">{{r.v}}</div>
<div style="font-size: 13px; line-height: 1.5; color: #4A5D6A">{{r.sub}}</div>
</div>
</sc-for>
</div>
<div style="background: #EAF3F7; border-radius: 14px; padding: 14px 18px; font-size: 15px; line-height: 1.7">{{jf.msg}}</div>
</div>

<div style="flex: 1 1 330px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; font-weight: 600">สถานการณ์ตัวอย่าง</span>
<div role="group" aria-label="สถานการณ์แมงกะพรุน" style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{jf.presets}}" as="p" hint-placeholder-count="3">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="min-height: 44px; padding: 6px 12px; border-radius: 10px; border: 1.5px solid {{p.border}}; background: {{p.bg}}; color: {{p.fg}}; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; text-align: left; line-height: 1.4">{{p.name}}</button>
</sc-for>
</div>
<sc-for list="{{jf.sliders}}" as="x" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; justify-content: space-between; gap: 8px"><label for="{{x.id}}" style="font-size: 14px; font-weight: 600">{{x.name}}</label><span style="font-family: 'IBM Plex Mono', monospace; color: #0A6A94; white-space: nowrap">{{x.label}}</span></div>
<input id="{{x.id}}" type="range" min="{{x.min}}" max="{{x.max}}" step="{{x.step}}" value="{{x.v}}" onChange="{{x.set}}">
</div>
</sc-for>
<label style="display: flex; align-items: center; gap: 10px; min-height: 40px; font-size: 14px; font-weight: 600; cursor: pointer"><input type="checkbox" checked="{{food}}" onChange="{{toggleFood}}" style="width: 20px; height: 20px; accent-color: #0A6A94">มีกุ้งและปลาเล็กใกล้ปากแม่น้ำ (หลังฝนตก)</label>
<div style="display: flex; gap: 8px">
<button type="button" onClick="{{jfReset}}" style="flex: 1 1 0; min-height: 44px; border-radius: 999px; border: 1.5px solid #0A6A94; background: #FFFFFF; color: #0A6A94; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">เริ่มใหม่</button>
<button type="button" onClick="{{jfPause}}" style="flex: 1 1 0; min-height: 44px; border-radius: 999px; border: 1.5px solid #0A6A94; background: #0A6A94; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{jf.pauseTxt}}</button>
</div>
</div>
</div>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 26px; font-weight: 700">4. แมงกะพรุนพิษในทะเลไทยมาจากไหน</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px">

      presets: presets.map(function (p) { var q = pill(s.preset === p.id); return { name: p.name, pressed: s.preset === p.id ? 'true' : 'false', bg: q.bg, fg: q.fg, border: q.border, pick: function () { var o = Object.assign({ preset: p.id }, p.v); self.setState(o); } }; }),
      sliders: [
        { id: 'b-h', name: 'ความสูงคลื่นนอกฝั่ง H0', label: s.H0.toFixed(1) + ' ม.', min: 0.2, max: 4, step: 0.1, v: s.H0, set: function (e) { self.setState({ H0: parseFloat(e.target.value), preset: '' }); } },
        { id: 'b-t', name: 'คาบคลื่น T', label: s.T + ' วินาที', min: 4, max: 16, step: 1, v: s.T, set: function (e) { self.setState({ T: parseFloat(e.target.value), preset: '' }); } },
        { id: 'b-s', name: 'ความชันหาด', label: '1 : ' + s.slope, min: 8, max: 50, step: 1, v: s.slope, set: function (e) { self.setState({ slope: parseFloat(e.target.value) }); } },
        { id: 'b-w', name: 'ระดับน้ำขึ้นน้ำลง', label: (s.tide >= 0 ? '+' : '') + s.tide.toFixed(1) + ' ม.', min: -1, max: 1.5, step: 0.1, v: s.tide, set: function (e) { self.setState({ tide: parseFloat(e.target.value), preset: '' }); } }
      ],
      aria: 'ภาพตัดขวางชายหาด คลื่นสูง ' + s.H0 + ' เมตร ' + badge
    };
    var lsTxt = { ok: 'ปลอดภัย', wet: 'น้ำซัดถึง', lost: 'ทรายถูกกัดหาย' };
    var lsCol = { ok: ['#DDEFF6', '#0A4F70'], wet: ['#FFF1CC', '#6B4A00'], lost: ['#FCE3CF', '#7E3407'] };
    var cards = [
      { id: 'clam', name: 'หอยเสียบและปูทราย', zone: 'เขตน้ำซัด', text: 'ฝังตัวในทรายที่เปียกตลอด แล้วโผล่ขึ้นมากรองอาหารเมื่อน้ำซัดขึ้น ย้ายตัวขึ้นลงตามน้ำได้ แต่ถ้าหน้าหาดถูกกัดจนเหลือแต่กำแพง ที่อยู่ของพวกมันจะหายไป' },
      { id: 'crab', name: 'ปูลม', zone: 'หาดตอนบน', text: 'ขุดรูในทรายแห้งเหนือแนวน้ำขึ้น ออกหากินกลางคืน ปูลมเป็นตัวชี้วัดสุขภาพหาด เพราะจำนวนลดลงเมื่อหาดแคบ มีคนเหยียบ หรือมีแสงไฟและรถวิ่งบนหาด' },
      { id: 'plover', name: 'นกหัวโตมลายู', zone: 'สันหาดและเนินทราย', text: 'วางไข่บนพื้นทรายโล่ง ไข่สีกลืนกับทรายจึงถูกเหยียบง่าย ถ้าน้ำซัดสูงกว่าสันหาดช่วงคลื่นลมแรง ไข่จะถูกพัดหาย' },
      { id: 'turtle', name: 'เต่าทะเล', zone: 'เหนือแนวน้ำขึ้นสูงสุด', text: 'แม่เต่าขึ้นมาวางไข่บนหาดทรายฝั่งอันดามันและบางเกาะในอ่าวไทย ไข่ต้องอยู่ในทรายราว 2 เดือน ถ้าน้ำทะเลท่วมรังไข่อาจไม่ฟัก และหาดที่มีกำแพงกันคลื่นมักไม่มีทรายแห้งให้วางไข่' },
      { id: 'vine', name: 'ผักบุ้งทะเลและพืชเนินทราย', zone: 'เนินทรายด้านหลัง', text: 'รากยึดทรายไว้และดักทรายที่ลมพัดมา ทำให้เนินทรายสูงขึ้นเป็นแนวกันคลื่นตามธรรมชาติ ช่วงมรสุมเนินทรายจะเสียทรายให้หาด แล้วได้คืนช่วงลมสงบ' }
    ];
    var lifeCards = cards.map(function (c) { var st = lifeState[c.id] || 'ok'; return { name: c.name, zone: c.zone, text: c.text, state: lsTxt[st], bg: lsCol[st][0], fg: lsCol[st][1] }; });

    // ---------- 3. jellyfish ----------
    var jf = this.jf, shoreY = 262 - s.tide * 10, pP = '', pA = '', pB = '', pS = '';
    jf.J.forEach(function (q) {
      if (q.k === 'phys') pP += 'M' + f1(q.x - 6) + ',' + f1(q.y + 3) + ' q6,-12 12,0 z ' + circ(q.x, q.y + 3, 3);
      else if (q.k === 'aur') pA += circ(q.x, q.y, 6);
      else pB += 'M' + f1(q.x - 5) + ',' + f1(q.y - 5) + ' h10 v10 h-10 z ';
    });
    jf.stranded.forEach(function (q) { pS += circ(q.x, q.y, 3.5); });
    var beachPath = 'M0,320 L0,' + f1(shoreY) + ' C200,' + f1(shoreY - 4) + ' 500,' + f1(shoreY + 4) + ' 900,' + f1(shoreY) + ' L900,320 Z';
    var waves = '';
    var nW = Math.round(2 + s.wind / 2);
    for (var w = 0; w < nW; w++) { var wy = shoreY - 10 - w * 14, off = (jf.t * 20 * (s.wdir === 'on' ? 1 : 0.3)) % 60; waves += 'M' + f1(20 + off + w * 37) + ',' + f1(wy) + ' q20,-5 40,0 M' + f1(330 + off - w * 23) + ',' + f1(wy + 3) + ' q20,-5 40,0 M' + f1(600 + off + w * 11) + ',' + f1(wy - 2) + ' q20,-5 40,0 '; }
    var food = '';
    if (s.food) for (var k = 0; k < 26; k++) { var a = k * 2.4, r = 20 + (k * 7) % 55; food += circ(735 + r * Math.cos(a) * 1.3, 232 + r * Math.sin(a) * 0.3, 2.2); }
    var dirs = { on: [0, 1], off: [0, -1], along: [1, 0.25] }, dv = dirs[s.wdir], L = Math.hypot(dv[0], dv[1]);
    var ax = dv[0] / L * 18, ay = dv[1] / L * 18;
    var arrow = s.wind < 0.5 ? 'M-4,0 L4,0' : 'M' + f1(-ax) + ',' + f1(-ay) + ' L' + f1(ax) + ',' + f1(ay) + ' M' + f1(ax - ay * 0.4 - ax * 0.4) + ',' + f1(ay + ax * 0.4 - ay * 0.4) + ' L' + f1(ax) + ',' + f1(ay) + ' L' + f1(ax + ay * 0.4 - ax * 0.4) + ',' + f1(ay - ax * 0.4 - ay * 0.4);
    var nBoxNear = jf.J.filter(function (q) { return q.k === 'box' && q.y > shoreY - 60; }).length;
    var jmsg;
    if (s.wind > 9 && s.wdir === 'on') jmsg = 'ลมแรงพัดเข้าฝั่งแบบลมมรสุม เรือรบโปรตุเกสที่มีถุงลมเป็นใบเรือถูกลมพัดเข้าหาดเป็นกลุ่ม แมงกะพรุนที่ว่ายน้ำได้อ่อนถูกคลื่นดันเข้าฝั่ง ส่วนแมงกะพรุนกล่องว่ายหนีออกไปที่น้ำลึกกว่า';
    else if (s.wdir === 'off') jmsg = 'ลมพัดออกจากฝั่ง แมงกะพรุนที่ลอยตามลมถูกพาออกทะเล แทบไม่มีตัวไหนเกยหาด นี่คือเหตุที่บางหาดเจอแมงกะพรุนเฉพาะบางฤดู';
    else if (s.food && nBoxNear > 2) jmsg = 'น้ำค่อนข้างนิ่งและมีกุ้งกับปลาเล็กใกล้ปากแม่น้ำ แมงกะพรุนกล่องว่ายเข้ามาหากินในน้ำตื้นเอง ไม่ได้ถูกพัดมา ช่วงนี้จึงเสี่ยงที่สุดสำหรับคนลงเล่นน้ำ แม้หาดจะดูสงบ';
    else jmsg = 'ลมเบา แมงกะพรุนลอยไปมาช้า ๆ ลองเลือกลมมรสุมพัดเข้าฝั่ง หรือเปิดอาหารใกล้ปากแม่น้ำ แล้วดูว่าแต่ละชนิดเคลื่อนที่ต่างกันอย่างไร';
    var jPresets = [
      { id: 'monsoon', name: 'ลมมรสุมพัดเข้าฝั่ง (เช่นอันดามันช่วงมรสุมตะวันตกเฉียงใต้)', v: { wind: 12, wdir: 'on', food: false, tide: 0.8 } },
      { id: 'calmfood', name: 'ลมสงบหลังฝนตก มีอาหารใกล้ปากแม่น้ำ', v: { wind: 2, wdir: 'along', food: true, tide: 0.2 } },
      { id: 'offshore', name: 'ลมพัดออกจากฝั่ง', v: { wind: 7, wdir: 'off', food: false, tide: 0 } }
    ];
    var wdTxt = { on: 'เข้าฝั่ง', off: 'ออกจากฝั่ง', along: 'ขนานฝั่ง' };
    var jfo = {
      legend: [{ n: 'เรือรบโปรตุเกส (ลอยตามลม)', c: '#5B4FC4' }, { n: 'แมงกะพรุนพระจันทร์ (ว่ายได้อ่อน)', c: '#E6A6C0' }, { n: 'แมงกะพรุนกล่อง (ว่ายเก่ง)', c: '#B04A0C' }],
      clock: '≈ ' + Math.floor(jf.t / 6) + ' ชม.',
      beach: beachPath, waves: waves || 'M0,0', food: food || 'M0,0', arrow: arrow,
      windTxt: s.wind.toFixed(0) + ' ม./วิ ' + wdTxt[s.wdir],
      pPhys: pP || 'M0,0', pAur: pA || 'M0,0', pBox: pB || 'M0,0', pStr: pS || 'M0,0', shoreTxtY: f1(shoreY + 52),
      counts: [
        { k: 'เรือรบโปรตุเกสเกยหาด', v: jf.cnt.phys + ' ตัว', sub: 'ว่ายไม่ได้ ไปตามลมราว 3–4% ของความเร็วลม', c: '#5B4FC4' },
        { k: 'แมงกะพรุนพระจันทร์เกยหาด', v: jf.cnt.aur + ' ตัว', sub: 'ว่ายได้แต่สู้คลื่นและกระแสน้ำไม่ได้', c: '#E6A6C0' },
        { k: 'แมงกะพรุนกล่องใกล้ชายฝั่ง', v: nBoxNear + ' ตัว', sub: 'ว่ายเลือกทิศได้ จึงไม่ค่อยเกยหาด แต่เข้ามาในน้ำตื้นเอง', c: '#B04A0C' }
      ],
      msg: jmsg, pauseTxt: s.jPaused ? 'เล่นต่อ' : 'หยุดชั่วคราว',
      presets: jPresets.map(function (p) { var q = pill(s.jPreset === p.id); return { name: p.name, pressed: s.jPreset === p.id ? 'true' : 'false', bg: q.bg, fg: q.fg, border: q.border, pick: function () { self.setState(Object.assign({ jPreset: p.id }, p.v)); } }; }),
      sliders: [
        { id: 'j-w', name: 'ความเร็วลม', label: s.wind.toFixed(0) + ' ม./วินาที', min: 0, max: 15, step: 1, v: s.wind, set: function (e) { self.setState({ wind: parseFloat(e.target.value), jPreset: '' }); } },
        { id: 'j-d', name: 'ทิศลม: เข้าฝั่ง · ขนานฝั่ง · ออกจากฝั่ง', label: wdTxt[s.wdir], min: 0, max: 2, step: 1, v: { on: 0, along: 1, off: 2 }[s.wdir], set: function (e) { self.setState({ wdir: ['on', 'along', 'off'][parseInt(e.target.value, 10)], jPreset: '' }); } }
      ],
      aria: 'ภาพมุมบนของอ่าว ลม ' + s.wind + ' เมตรต่อวินาที แมงกะพรุนเกยหาด ' + (jf.cnt.phys + jf.cnt.aur) + ' ตัว'
    };

    var facts = [
      { tag: 'สัตว์ประจำถิ่น', c: '#B04A0C', title: 'แมงกะพรุนกล่องในอ่าวไทย', text: 'การสำรวจปี 2009–2016 ใน 15 จังหวัดรอบอ่าวไทยพบแมงกะพรุนกล่อง 3 ชนิด รวมถึง Chironex indrasaksajiae ที่ตั้งชื่อใหม่จากไทย สกุล Chironex พบเฉพาะตั้งแต่สุราษฎร์ธานี (ราวละติจูด 9° เหนือ) ขึ้นไป พบมากเดือนกรกฎาคมถึงกันยายน และผู้ที่บาดเจ็บรุนแรงหรือเสียชีวิตทุกรายอยู่ในพื้นที่ที่พบ Chironex แปลว่าพวกมันอาศัยและเติบโตในอ่าวไทยเอง ไม่ได้ถูกพัดมาจากที่ไกล' },
      { tag: 'ลอยตามลม', c: '#5B4FC4', title: 'เรือรบโปรตุเกส (Physalia)', text: 'อาศัยอยู่ที่ผิวมหาสมุทรเปิด ว่ายน้ำไม่ได้เลย มีถุงลมทำหน้าที่เหมือนใบเรือ ลมจึงเป็นตัวกำหนดว่าจะไปทางไหน เมื่อมรสุมตะวันตกเฉียงใต้พัดเข้าฝั่งอันดามัน จึงเกยหาดภูเก็ตและหาดใกล้เคียงเป็นช่วง ๆ และบางปีพบที่ชายฝั่งอ่าวไทยตอนล่างช่วงมรสุม' },
      { tag: 'ตามอาหาร', c: '#3F7A4F', title: 'ว่ายมาหาอาหารและน้ำตื้น', text: 'แมงกะพรุนกล่องมีตาที่ซับซ้อนและว่ายเลือกทิศได้ จับกุ้งและปลาเล็กเป็นอาหาร หลังฝนตก น้ำจากแม่น้ำพาธาตุอาหารลงทะเล แพลงก์ตอน กุ้ง และปลาเล็กเพิ่มขึ้นใกล้ฝั่ง ผู้ล่าจึงตามเข้ามาด้วย บริเวณน้ำตื้นใกล้ปากแม่น้ำและหาดที่น้ำนิ่งจึงต้องระวังเป็นพิเศษ' },
      { tag: 'ทำไมพบบ่อยขึ้น', c: '#0A6A94', title: 'แมงกะพรุนสะพรั่ง (bloom)', text: 'งานทบทวนงานวิจัยพบว่าการบานสะพรั่งของแมงกะพรุนเกี่ยวกับน้ำทะเลอุ่นขึ้น ธาตุอาหารจากน้ำเสียและการเกษตร (ทำให้แพลงก์ตอนเพิ่ม) การจับปลามากเกินจนคู่แข่งและผู้ล่าแมงกะพรุนลดลง และสิ่งก่อสร้างชายฝั่งที่เป็นที่เกาะของระยะตัวอ่อน เมื่อมีแมงกะพรุนในทะเลมาก ลมและคลื่นก็พาขึ้นหาดมากตามไปด้วย' }
    ];

    return {
      bp: bp, lifeCards: lifeCards, jf: jfo, facts: facts,
      wall: s.wall, toggleWall: function () { self.setState({ wall: !self.state.wall }); },
      resetBeach: function () { self.setState({ storm: 0, days: 0 }); },
      pauseBeach: function () { self.setState({ beachPaused: !self.state.beachPaused }); },
      food: s.food, toggleFood: function () { self.setState({ food: !self.state.food, jPreset: '' }); },
      jfReset: function () { self.jfInit(); self.setState({ jPaused: false }); },
      jfPause: function () { self.setState({ jPaused: !self.state.jPaused }); }
    };
  }
}
</script>
</body>
</html>
