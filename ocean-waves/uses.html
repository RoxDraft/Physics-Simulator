<div id="dc-root"></div>
<template id="dc-template">
<div style="font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; color: #0F2A3A; background: #F3F6F7; box-sizing: border-box; padding: 40px clamp(16px, 3vw, 40px) 64px">
<div style="max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px">

<header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px; max-width: 800px">
<div style="font-size: 14px; font-weight: 600; letter-spacing: 0.08em; color: #0A6A94">WHAT WAVES GIVE US</div>
<h1 style="margin: 0; font-size: clamp(30px, 4vw, 46px); line-height: 1.2; font-weight: 700">เราใช้ประโยชน์จากคลื่นทะเลอะไรบ้าง</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #4A5D6A">คลื่นคือพลังงานที่เดินทางบนผิวน้ำ มนุษย์ใช้ประโยชน์ทั้งจากตัวพลังงาน จากรูปแบบการเคลื่อนที่ และจากข้อมูลของคลื่น ตั้งแต่ผลิตไฟฟ้าไปจนถึงเตือนภัยพิบัติ</p>
</div>
<a href="index.html" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 20px; border-radius: 999px; border: 1.5px solid #0F2A3A; color: #0F2A3A; font-weight: 600; font-size: 16px; text-decoration: none">← กลับไปที่ตัวจำลอง</a>
</header>

<div style="position: sticky; top: 64px; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 14px; padding: 10px 16px">
<span style="font-size: 15px; color: #34495A">ภาพทุกช่องเคลื่อนไหวตามหลักการทำงานจริง (ทำให้ง่ายลง ไม่ตามสเกล)</span>
<div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap">
<button type="button" onClick="{{togglePlay}}" aria-pressed="{{playPressed}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #0A6A94; background: {{playBg}}; color: {{playFg}}; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">{{playLabel}}</button>
<button type="button" onClick="{{slower}}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #C9D4DA; background: #FFFFFF; color: #0F2A3A; font-family: inherit; font-size: 14px; cursor: pointer">ช้าลง</button>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #0A6A94; min-width: 44px; text-align: center">{{speedLabel}}</span>
<button type="button" onClick="{{faster}}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #C9D4DA; background: #FFFFFF; color: #0F2A3A; font-family: inherit; font-size: 14px; cursor: pointer">เร็วขึ้น</button>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 16px">

<div style="flex: 1 1 280px; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column">
<svg viewBox="0 0 240 140" style="display: block; width: 100%; height: auto; background: #EAF3F7" role="img" aria-label="ภาพเคลื่อนไหว: ทุ่นลอยขึ้นลงตามคลื่น ขับเครื่องกำเนิดไฟฟ้าใต้น้ำ ส่งไฟฟ้าไปบ้านบนฝั่ง">
<path d="{{s1.sea}}" fill="#2580AD"></path>
<rect x="0" y="132" width="240" height="8" fill="#D8C39C"></rect>
<path d="M165,82 L240,70 L240,140 L150,140 Z" fill="#D8C39C"></path>
<rect x="196" y="52" width="30" height="20" fill="#FFFFFF" stroke="#0F2A3A" stroke-width="2"></rect>
<path d="M192,54 L211,38 L230,54" fill="none" stroke="#0F2A3A" stroke-width="2"></path>
<circle cx="211" cy="62" r="5" fill="#F5C77A" opacity="{{s1.bulb}}"></circle>
<circle cx="211" cy="62" r="11" fill="#F5C77A" opacity="{{s1.glow}}"></circle>
<path d="M80,126 L172,126 L204,72" fill="none" stroke="#F5A15B" stroke-width="2.5" stroke-dasharray="6 6" stroke-dashoffset="{{s1.dash}}"></path>
<line x1="70" y1="{{s1.tetherY}}" x2="70" y2="118" stroke="#0F2A3A" stroke-width="2"></line>
<rect x="58" y="118" width="24" height="14" rx="2" fill="#0F2A3A"></rect>
<rect x="58" y="{{s1.buoyY}}" width="24" height="12" rx="5" fill="#F08A3C" stroke="#0F2A3A" stroke-width="1.5"></rect>
</svg>
<div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 8px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #B04A0C">01 · พลังงาน</div>
<h2 style="margin: 0; font-size: 19px; font-weight: 700">ผลิตไฟฟ้าจากพลังงานคลื่น</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #34495A">คลื่นเป็นพลังงานหมุนเวียนที่หนาแน่นกว่าลมและแสงแดด และพยากรณ์ล่วงหน้าได้หลายวัน เพราะสเวลล์เดินทางมาจากพายุที่อยู่ไกล การประเมินที่มักถูกอ้างถึงให้ศักยภาพทั่วโลกราว 2 เทราวัตต์</p>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #4A5D6A">ในภาพ: หลอดไฟสว่างมากเมื่อทุ่นเคลื่อนที่เร็ว และหรี่ลงที่ยอดและท้องคลื่นที่ทุ่นหยุดชั่วขณะ</p>
</div>
</div>

<div style="flex: 1 1 280px; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column">
<svg viewBox="0 0 240 140" style="display: block; width: 100%; height: auto; background: #EAF3F7" role="img" aria-label="ภาพเคลื่อนไหว: ทุ่นขับปั๊มอัดน้ำทะเลผ่านเยื่อกรอง ได้น้ำจืดลงถัง และน้ำเค็มเข้มข้นกลับสู่ทะเล">
<path d="{{s2.sea}}" fill="#2580AD"></path>
<rect x="0" y="132" width="240" height="8" fill="#D8C39C"></rect>
<path d="M140,74 L240,64 L240,140 L130,140 Z" fill="#D8C39C"></path>
<path d="M60,121 L150,121 L165,108" fill="none" stroke="#4A5D6A" stroke-width="5" stroke-linejoin="round"></path>
<path d="M168,114 L150,128 L130,128" fill="none" stroke="#9AAAB4" stroke-width="3"></path>
<rect x="160" y="92" width="36" height="22" rx="3" fill="#FFFFFF" stroke="#0F2A3A" stroke-width="2"></rect>
<line x1="178" y1="94" x2="178" y2="112" stroke="#0A6A94" stroke-width="2" stroke-dasharray="3 2"></line>
<line x1="196" y1="103" x2="208" y2="103" stroke="#4A5D6A" stroke-width="3"></line>
<rect x="208" y="70" width="24" height="40" rx="2" fill="#FFFFFF" stroke="#0F2A3A" stroke-width="2"></rect>
<rect x="210" y="{{s2.tankY}}" width="20" height="{{s2.tankH}}" fill="#9FD0E6"></rect>
<path d="{{s2.press}}" fill="#FFFFFF"></path>

<path d="{{s2.brine}}" fill="#9AAAB4"></path>
<line x1="50" y1="{{s2.tetherY}}" x2="50" y2="{{s2.rodY}}" stroke="#0F2A3A" stroke-width="2"></line>
<rect x="40" y="108" width="20" height="24" rx="2" fill="#FFFFFF" stroke="#0F2A3A" stroke-width="2"></rect>
<rect x="42" y="{{s2.rodY}}" width="16" height="5" fill="#0F2A3A"></rect>
<rect x="38" y="{{s2.buoyY}}" width="24" height="12" rx="5" fill="#F08A3C" stroke="#0F2A3A" stroke-width="1.5"></rect>
</svg>
<div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 8px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #B04A0C">02 · น้ำจืด</div>
<h2 style="margin: 0; font-size: 19px; font-weight: 700">ผลิตน้ำจืดจากน้ำทะเล</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #34495A">มีโครงการต้นแบบที่ใช้แรงดันจากคลื่นขับระบบกรองน้ำทะเล (reverse osmosis) โดยตรง ไม่ต้องแปลงเป็นไฟฟ้าก่อน เหมาะกับเกาะและชุมชนชายฝั่งที่ขาดน้ำจืด</p>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #4A5D6A">ในภาพ: น้ำทะเลถูกอัดผ่านเยื่อกรอง (เส้นประ) น้ำจืดสีฟ้าไหลลงถัง ส่วนน้ำเค็มเข้มข้นสีเทาไหลกลับทะเล</p>
</div>
</div>

<div style="flex: 1 1 280px; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column">
<svg viewBox="0 0 240 140" style="display: block; width: 100%; height: auto; background: #EAF3F7" role="img" aria-label="ภาพเคลื่อนไหว: นักโต้คลื่นไถลบนหน้าคลื่นที่เคลื่อนเข้าหาฝั่ง">

<path d="{{s3.sea}}" fill="#2580AD"></path>
<path d="{{s3.foam}}" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"></path>

<g transform="{{s3.surfer}}">
<ellipse cx="0" cy="0" rx="13" ry="2.6" fill="#F08A3C" stroke="#0F2A3A" stroke-width="1"></ellipse>
<path d="M-3,-2 L-1,-10 L3,-17 M-1,-10 L4,-3 M3,-15 L-5,-13 M3,-15 L10,-17" fill="none" stroke="#0F2A3A" stroke-width="2.2" stroke-linecap="round"></path>
<circle cx="4" cy="-20" r="3" fill="#0F2A3A"></circle>
</g>
</svg>
<div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 8px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #B04A0C">03 · ท่องเที่ยว</div>
<h2 style="margin: 0; font-size: 19px; font-weight: 700">กีฬาทางน้ำและการท่องเที่ยว</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #34495A">การโต้คลื่น บอดี้บอร์ด และวินด์เซิร์ฟพึ่งพาสเวลล์ที่มาเป็นชุดสม่ำเสมอ ชายหาดที่มีคลื่นดีกลายเป็นแหล่งรายได้ของชุมชน ตั้งแต่ร้านเช่าบอร์ดไปจนถึงโรงเรียนสอนเซิร์ฟ</p>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #4A5D6A">ในภาพ: นักโต้คลื่นอยู่บนหน้าคลื่นที่ชัน แรงโน้มถ่วงดึงลงตามความลาด ขณะที่คลื่นยกตัวไปข้างหน้าด้วยความเร็วเท่ากัน</p>
</div>
</div>

<div style="flex: 1 1 280px; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column">
<svg viewBox="0 0 240 140" style="display: block; width: 100%; height: auto; background: #CFE6F0" role="img" aria-label="ภาพเคลื่อนไหวมุมบน: คลื่นเข้าหาฝั่งเป็นมุมเฉียง เม็ดทรายถูกพาขึ้นหาดเฉียงแล้วไหลกลับตรง จึงเคลื่อนไปตามแนวชายฝั่งแบบซิกแซก">
<path d="{{s4.crests}}" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"></path>
<path d="{{s4.beach}}" fill="#E9D8B4"></path>
<path d="{{s4.trail}}" fill="none" stroke="#B89B74" stroke-width="1.5" stroke-dasharray="3 3"></path>
<circle cx="{{s4.gx}}" cy="{{s4.gy}}" r="4.5" fill="#B04A0C" stroke="#FFFFFF" stroke-width="1.5"></circle>
<path d="M150,132 L200,132 M192,127 L200,132 L192,137" fill="none" stroke="#7E3407" stroke-width="2"></path>
</svg>
<div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 8px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #B04A0C">04 · ชายฝั่ง</div>
<h2 style="margin: 0; font-size: 19px; font-weight: 700">สร้างและหล่อเลี้ยงชายหาด</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #34495A">คลื่นพัดพาทรายขึ้น-ลงหาด และพาไปตามแนวชายฝั่ง (longshore drift) จนเกิดหาดทราย สันทราย และแหลม การเข้าใจกระบวนการนี้ช่วยวางแผนแก้ปัญหาการกัดเซาะชายฝั่ง</p>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #4A5D6A">ในภาพ (มองจากด้านบน): น้ำซัดขึ้นหาดตามทิศคลื่นที่เฉียง แต่ไหลกลับตรงตามความลาด เม็ดทรายสีส้มจึงขยับไปทางขวาทีละนิด</p>
</div>
</div>

<div style="flex: 1 1 280px; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column">
<svg viewBox="0 0 240 140" style="display: block; width: 100%; height: auto; background: #EAF3F7" role="img" aria-label="ภาพเคลื่อนไหว: คลื่นแตกตีฟองอากาศลงไปในน้ำ แพลงก์ตอนลอยวนอยู่ในน้ำที่ถูกกวน">
<path d="{{s5.sea}}" fill="#2580AD"></path>
<path d="{{s5.foam}}" fill="#FFFFFF" opacity="0.85"></path>
<path d="{{s5.bubbles}}" fill="none" stroke="#FFFFFF" stroke-width="1.3"></path>
<path d="{{s5.plankton}}" fill="#8FD18B"></path>
<rect x="0" y="128" width="240" height="12" fill="#D8C39C"></rect>
<path d="M170,128 L172,112 L176,120 L180,106 L184,118 L188,110 L190,128 Z" fill="#F08A3C"></path>
<path d="M30,128 C30,118 36,114 40,120 C44,110 52,114 50,128 Z" fill="#E07A9B"></path>
</svg>
<div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 8px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #B04A0C">05 · ระบบนิเวศ</div>
<h2 style="margin: 0; font-size: 19px; font-weight: 700">เติมออกซิเจนและผสมสารอาหาร</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #34495A">คลื่นแตกตีอากาศลงไปในน้ำ เพิ่มออกซิเจนและการแลกเปลี่ยนก๊าซกับบรรยากาศ การกวนของคลื่นยังผสมสารอาหารให้แพลงก์ตอน ปะการัง และสัตว์ชายฝั่ง</p>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #4A5D6A">ในภาพ: ฟองอากาศถูกดันลงไปใต้ผิวน้ำแล้วลอยกลับขึ้น ระหว่างนั้นออกซิเจนละลายเข้าสู่น้ำ</p>
</div>
</div>

<div style="flex: 1 1 280px; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column">
<svg viewBox="0 0 240 140" style="display: block; width: 100%; height: auto; background: #EAF3F7" role="img" aria-label="ภาพเคลื่อนไหว: เขื่อนกันคลื่นรับคลื่นใหญ่ด้านนอก เรือในท่าด้านในโคลงเพียงเล็กน้อย">
<path d="{{s6.seaOut}}" fill="#2580AD"></path>
<path d="{{s6.seaIn}}" fill="#2580AD"></path>
<path d="M114,140 L122,46 L140,46 L148,140 Z" fill="#9AAAB4" stroke="#4A5D6A" stroke-width="2"></path>
<path d="M118,70 l6,-4 l6,4 l6,-4 l6,4" fill="none" stroke="#4A5D6A" stroke-width="1.5"></path>

<div style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #B04A0C">06 · วิศวกรรม</div>
<h2 style="margin: 0; font-size: 19px; font-weight: 700">ออกแบบท่าเรือและโครงสร้างในทะเล</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #34495A">ข้อมูลความสูงและคาบคลื่นใช้กำหนดขนาดเขื่อนกันคลื่น ท่าเรือ แท่นขุดเจาะ และฟาร์มกังหันลมนอกชายฝั่ง รวมถึงวางเส้นทางเดินเรือให้ปลอดภัยและประหยัดเชื้อเพลิง</p>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #4A5D6A">ในภาพ: เขื่อนกันคลื่นสะท้อนและสลายพลังงานคลื่น เรือด้านนอกโคลงแรง ส่วนเรือในท่าแทบนิ่ง</p>
</div>
</div>

<div style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #B04A0C">07 · เตือนภัย</div>
<h2 style="margin: 0; font-size: 19px; font-weight: 700">พยากรณ์พายุและเตือนภัยสึนามิ</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #34495A">สเวลล์มักมาถึงชายฝั่งก่อนพายุ จึงเป็นสัญญาณล่วงหน้า ส่วนทุ่นเตือนภัยสึนามิวัดความดันน้ำที่พื้นทะเล ตรวจจับระดับน้ำที่เปลี่ยนเพียงไม่กี่เซนติเมตรกลางมหาสมุทรได้</p>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #4A5D6A">ในภาพ: เมื่อคลื่นสึนามิผ่าน เซนเซอร์พื้นทะเลวัดความดันที่เพิ่มขึ้น ทุ่นส่งข้อมูลผ่านดาวเทียม แล้วหอเตือนภัยบนฝั่งเริ่มกะพริบ ก่อนคลื่นจะมาถึง</p>
</div>
</div>

<div style="flex: 1 1 280px; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column">

<div style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #B04A0C">08 · นำทาง</div>
<h2 style="margin: 0; font-size: 19px; font-weight: 700">อ่านคลื่นเพื่อนำทาง</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #34495A">นักเดินเรือชาวโพลินีเซียในอดีตสังเกตรูปแบบสเวลล์ที่สะท้อนและหักเหรอบเกาะ เพื่อหาทิศทางและตำแหน่งของเกาะที่ยังมองไม่เห็น โดยไม่ต้องใช้เข็มทิศ</p>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #4A5D6A">ในภาพ (มองจากด้านบน): สเวลล์สีขาวโค้งอ้อมเกาะ ส่วนคลื่นสะท้อนสีน้ำเงินกระจายออกมาด้านหน้า เรือแคนูรับรู้ได้จากการโคลงที่เปลี่ยนไป</p>

<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4A5D6A">แต่ละแบบจับการเคลื่อนที่ของน้ำคนละส่วน ซึ่งตรงกับสิ่งที่เห็นในตัวจำลอง ทั้งการขึ้น-ลงของผิวน้ำ และการแกว่งไป-มาในน้ำตื้น</p>
<div style="display: flex; flex-wrap: wrap; gap: 14px">

<h3 style="margin: 0; font-size: 17px; font-weight: 700">คอลัมน์น้ำแกว่ง (OWC)</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.65; color: #34495A">คลื่นดันน้ำในห้องปิดให้ขึ้น-ลง อากาศด้านบนถูกอัดและดูดสลับกัน ไหลผ่านกังหันอากาศที่หมุนทางเดียว มักสร้างเป็นส่วนหนึ่งของเขื่อนกันคลื่น</p>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #4A5D6A">สังเกต: ลูกศรอากาศกลับทิศทุกครึ่งคาบ แต่กังหัน Wells หมุนทางเดียวตลอด</p>
</div>

<h3 style="margin: 0; font-size: 17px; font-weight: 700">ทุ่นลอยดูดซับ (Point absorber)</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.65; color: #34495A">ทุ่นลอยขึ้น-ลงตามคลื่น ดึงสายหรือแกนที่ยึดกับพื้นทะเล ขับเครื่องกำเนิดไฟฟ้าหรือปั๊มไฮดรอลิก ติดตั้งเป็นกลุ่มได้หลายตัว</p>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #4A5D6A">สังเกต: ลูกสูบในกระบอกเลื่อนตามทุ่น และเฟืองเครื่องกำเนิดไฟฟ้าหมุนไป-กลับตามการขึ้นลง</p>
</div>

<h3 style="margin: 0; font-size: 17px; font-weight: 700">แผ่นโยกใต้น้ำ (Oscillating surge)</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.65; color: #34495A">แผ่นบานพับติดพื้นทะเลในน้ำตื้นโยกไป-มาตามการแกว่งแนวนอนของน้ำ ตรงกับวงโคจรแบนที่เห็นในตัวจำลองเมื่อน้ำตื้น</p>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #4A5D6A">สังเกต: จุดน้ำแกว่งไป-มาในแนวนอน ดันแผ่นให้โยก แล้วแผ่นอัดกระบอกไฮดรอลิกที่ยึดกับพื้น</p>
</div>

<h3 style="margin: 0; font-size: 17px; font-weight: 700">น้ำล้นข้ามสันกั้น (Overtopping)</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.65; color: #34495A">ทางลาดพาคลื่นซัดน้ำขึ้นไปเก็บในอ่างที่สูงกว่าระดับทะเล แล้วปล่อยน้ำไหลกลับผ่านกังหันน้ำ คล้ายเขื่อนผลิตไฟฟ้าขนาดเล็ก</p>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #4A5D6A">สังเกต: คลื่นซัดเป็นจังหวะ แต่อ่างเก็บน้ำช่วยให้น้ำไหลผ่านกังหันสม่ำเสมอ กังหันจึงหมุนต่อเนื่อง</p>

<aside style="flex: 1 1 320px; min-width: 0; background: #0F2A3A; color: #FFFFFF; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 14px">

<h2 style="margin: 0; font-size: 22px; font-weight: 700; line-height: 1.35">คลื่นลูกหนึ่งมีพลังงานเท่าไร</h2>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 500; background: #163A4F; border-radius: 10px; padding: 14px 16px">P ≈ 0.5 × H² × T</div>
<p style="margin: 0; font-size: 15px; line-height: 1.7; color: #D9E8EF">ได้กำลังเป็นกิโลวัตต์ ต่อความกว้างหน้าคลื่น 1 เมตร (ใช้กับคลื่นน้ำลึก) H คือความสูงคลื่นเป็นเมตร T คือคาบเป็นวินาที</p>
<div style="border-top: 1px solid #2E5468; padding-top: 14px; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 15px; line-height: 1.7; color: #FFFFFF">ตัวอย่าง: สเวลล์สูง 2 ม. คาบ 10 วินาที</div>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 17px; color: #FFC79A">0.5 × 2² × 10 ≈ 20 kW ต่อเมตร</div>
<div style="font-size: 15px; line-height: 1.7; color: #D9E8EF">หน้าคลื่นกว้าง 100 ม. จึงพาพลังงานราว 2 เมกะวัตต์ ก่อนหักประสิทธิภาพของเครื่องแปลงพลังงาน</div>
</div>
<div style="font-size: 14px; line-height: 1.7; color: #D9E8EF">ลองเลือก “คลื่นยาว (สเวลล์)” ในตัวจำลอง แล้วดูช่อง “กำลังคลื่น” เพื่อเทียบกับสูตรนี้</div>

<section style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; padding: clamp(18px, 3vw, 32px); display: flex; flex-direction: column; gap: 18px">
<h2 style="margin: 0; font-size: 26px; font-weight: 700">คลื่นกับประเทศไทย</h2>
<div style="display: flex; flex-wrap: wrap; gap: 24px">
<div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 6px">
<h3 style="margin: 0; font-size: 17px; font-weight: 700; color: #0A6A94">ฝั่งอันดามัน</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.7; color: #34495A">ภูเก็ตและพังงามีคลื่นสำหรับโต้คลื่นช่วงมรสุมตะวันตกเฉียงใต้ ราวพฤษภาคมถึงตุลาคม เพราะสเวลล์จากมหาสมุทรอินเดียเดินทางเข้ามาถึง</p>
</div>
