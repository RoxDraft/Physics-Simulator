<div style="max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 36px">

<header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px; max-width: 900px">
<div style="font-size: 14px; font-weight: 600; letter-spacing: 0.08em; color: #0A6A94">QUANTUM LAB · ฟิสิกส์ยุคใหม่</div>
<h1 style="margin: 0; font-size: clamp(30px, 4vw, 46px); line-height: 1.2; font-weight: 700">ควอนตัมรอบตัวเรา: แสง อิเล็กตรอน และคิวบิต</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #4A5D6A">ในโลกเล็กระดับอะตอม แสงมาเป็นก้อนพลังงาน อิเล็กตรอนทะลุกำแพงได้ และสิ่งของอยู่หลายสถานะพร้อมกันได้จนกว่าจะถูกวัด ฟังดูแปลก แต่หลักเหล่านี้ทำงานอยู่ในกล้องมือถือ SSD จอทีวี สายอินเทอร์เน็ต และคอมพิวเตอร์ควอนตัม</p>
</div>
<a href="sources.html" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 20px; border-radius: 999px; border: 1.5px solid #0F2A3A; color: #0F2A3A; font-weight: 600; text-decoration: none">แหล่งข้อมูล</a>
</header>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 26px; font-weight: 700">1. ปรากฏการณ์โฟโตอิเล็กทริก: แสงมาเป็นก้อน</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4A5D6A; max-width: 960px">ถ้าแสงเป็นแค่คลื่น แสงจ้าพอก็น่าจะเตะอิเล็กตรอนออกจากโลหะได้ แต่การทดลองพบว่าแสงแดงจ้าแค่ไหนก็ไม่หลุด ส่วนแสงม่วงสลัว ๆ หลุดทันที ไอน์สไตน์อธิบายว่าแสงมาเป็นโฟตอน แต่ละก้อนมีพลังงาน E = h·f อิเล็กตรอนหนึ่งตัวรับได้ทีละก้อน ต้องได้ก้อนที่ใหญ่พอจึงจะหลุด (รางวัลโนเบล 1921)</p>
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<div style="flex: 999 1 640px; min-width: 0; display: flex; flex-wrap: wrap; gap: 14px">
<div style="flex: 1 1 380px; min-width: 0; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; overflow: hidden">
<svg viewBox="0 0 440 280" style="display: block; width: 100%; height: auto; background: #0F2A3A" role="img" aria-label="{{pe.aria}}">
<rect x="300" y="40" width="40" height="200" fill="#9AAAB4"></rect>
<text x="320" y="262" font-size="12" text-anchor="middle" fill="#D9E8EF">{{pe.metal}}</text>
<path d="{{pe.photons}}" fill="none" stroke="{{pe.col}}" stroke-width="2.5"></path>
<path d="{{pe.elec}}" fill="#9FD0E6"></path>
<circle cx="22" cy="20" r="6" fill="{{pe.col}}"></circle><text x="34" y="24" font-size="12" fill="#FFFFFF" font-weight="700">{{pe.lamTxt}}</text>
<text x="16" y="262" font-size="12" fill="#D9E8EF">{{pe.status}}</text>
</svg>
</div>
<div style="flex: 1 1 260px; min-width: 0; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
<span style="font-weight: 700; font-size: 14px">พลังงานจลน์ของอิเล็กตรอนเทียบความถี่แสง</span>
<svg viewBox="0 0 300 200" style="display: block; width: 100%; height: auto" role="img" aria-label="กราฟพลังงานอิเล็กตรอนเทียบความถี่แสง">
<line x1="36" y1="170" x2="290" y2="170" stroke="#9AAAB4"></line>
<line x1="36" y1="10" x2="36" y2="170" stroke="#9AAAB4"></line>
<path d="{{pe.line}}" fill="none" stroke="#0A6A94" stroke-width="2.5"></path>
<line x1="{{pe.f0x}}" y1="20" x2="{{pe.f0x}}" y2="170" stroke="#B04A0C" stroke-dasharray="4 4"></line>
<text x="{{pe.f0x}}" y="186" font-size="10" text-anchor="middle" fill="#B04A0C">f₀</text>
<circle cx="{{pe.px}}" cy="{{pe.py}}" r="6" fill="#B04A0C"></circle>
<text x="290" y="196" font-size="10" text-anchor="end" fill="#4A5D6A">ความถี่ →</text>
<text x="40" y="18" font-size="10" fill="#4A5D6A">KE (eV)</text>
</svg>
<span style="font-size: 13px; line-height: 1.6; color: #4A5D6A">ความชันของเส้นคือค่าคงที่ของพลังค์ h ทุกโลหะได้ความชันเท่ากัน ต่างกันแค่จุดเริ่ม f₀</span>
</div>
</div>
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{pe.sliders}}" as="x" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; justify-content: space-between; gap: 8px"><label for="{{x.id}}" style="font-size: 14px; font-weight: 600">{{x.name}}</label><span style="font-family: 'IBM Plex Mono', monospace; color: #0A6A94; white-space: nowrap">{{x.label}}</span></div>
<input id="{{x.id}}" type="range" min="{{x.min}}" max="{{x.max}}" step="{{x.step}}" value="{{x.v}}" onChange="{{x.set}}">
</div>
</sc-for>
<span style="font-size: 14px; font-weight: 600">โลหะ</span>
<div role="group" aria-label="โลหะ" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{pe.metals}}" as="p" hint-placeholder-count="4">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="flex: 1 1 100px; min-height: 44px; padding: 4px 10px; border-radius: 10px; border: 1.5px solid {{p.border}}; background: {{p.bg}}; color: {{p.fg}}; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; line-height: 1.3">{{p.name}}</button>
</sc-for>
</div>
<sc-for list="{{pe.stats}}" as="r" hint-placeholder-count="3">
<div style="display: flex; justify-content: space-between; gap: 10px; font-size: 14px; border-top: 1px solid #E3E9EC; padding-top: 6px"><span>{{r.k}}</span><span style="font-family: 'IBM Plex Mono', monospace; color: {{r.c}}">{{r.v}}</span></div>
</sc-for>
</div>
<div style="background: #0F2A3A; color: #FFFFFF; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: #9FD0E6">ใช้ที่ไหน</div>
<p style="margin: 0; font-size: 14px; line-height: 1.7; color: #D9E8EF">เซนเซอร์กล้องมือถือและโฟโตไดโอดปลายสายใยแก้วใช้หลักเดียวกันในสารกึ่งตัวนำ: โฟตอนที่มีพลังงานเกินช่องว่างแถบพลังงาน (ซิลิคอน 1.12 eV) ปล่อยอิเล็กตรอนออกมาเป็นสัญญาณ ซิลิคอนจึงรับแสงได้ถึงราว 1,100 นาโนเมตร ส่วนเซลล์แสงอาทิตย์ใช้อิเล็กตรอนที่ปล่อยออกมาเป็นไฟฟ้า</p>
</div>
</div>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 26px; font-weight: 700">2. การทะลุผ่านทางควอนตัม: อิเล็กตรอนเดินทะลุกำแพง</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4A5D6A; max-width: 960px">อิเล็กตรอนมีพฤติกรรมเป็นคลื่น เมื่อชนกำแพงพลังงานที่สูงกว่าตัวมันเอง คลื่นไม่ได้หยุดทันที แต่ลดลงแบบเอกซ์โพเนนเชียลในกำแพง ถ้ากำแพงบางพอ คลื่นยังเหลือออกไปอีกฝั่ง แปลว่าอิเล็กตรอนมีโอกาสโผล่อีกด้านโดยไม่ต้องข้ามกำแพง โอกาสนี้ไวต่อความหนามาก หนาขึ้นนิดเดียว โอกาสลดลงหลายเท่า</p>
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<div style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; overflow: hidden">
<svg viewBox="0 0 900 260" style="display: block; width: 100%; height: auto; background: #FBFCFD" role="img" aria-label="{{tn.aria}}">
<rect x="{{tn.bx}}" y="40" width="{{tn.bw}}" height="180" fill="#FCE3CF"></rect>
<text x="{{tn.bcx}}" y="34" font-size="12" text-anchor="middle" fill="#7E3407" font-weight="700">{{tn.bTxt}}</text>
<line x1="20" y1="130" x2="880" y2="130" stroke="#E3E9EC"></line>
<path d="{{tn.wave}}" fill="none" stroke="#0A6A94" stroke-width="2.5"></path>
<path d="{{tn.env}}" fill="none" stroke="#B04A0C" stroke-width="1.5" stroke-dasharray="5 4"></path>
<text x="40" y="236" font-size="12" fill="#4A5D6A">คลื่นเข้ามาและสะท้อน</text>
<text x="860" y="236" font-size="12" text-anchor="end" fill="#4A5D6A">{{tn.outTxt}}</text>
</svg>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px">
<sc-for list="{{tn.stats}}" as="r" hint-placeholder-count="4">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px">
<div style="font-size: 13px; font-weight: 600; color: #4A5D6A">{{r.k}}</div>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 19px; color: {{r.c}}">{{r.v}}</div>
<div style="font-size: 13px; line-height: 1.5; color: #4A5D6A">{{r.sub}}</div>
</div>
</sc-for>
</div>
<div style="background: #EAF3F7; border-radius: 14px; padding: 14px 18px; font-size: 15px; line-height: 1.7">{{tn.msg}}</div>
</div>
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 600">ตัวอย่างจริง</span>
<div role="group" aria-label="ตัวอย่างการทะลุผ่าน" style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{tn.presets}}" as="p" hint-placeholder-count="3">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="min-height: 44px; padding: 4px 12px; border-radius: 10px; border: 1.5px solid {{p.border}}; background: {{p.bg}}; color: {{p.fg}}; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; text-align: left; line-height: 1.35">{{p.name}}</button>
</sc-for>
</div>
<sc-for list="{{tn.sliders}}" as="x" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; justify-content: space-between; gap: 8px"><label for="{{x.id}}" style="font-size: 14px; font-weight: 600">{{x.name}}</label><span style="font-family: 'IBM Plex Mono', monospace; color: #0A6A94; white-space: nowrap">{{x.label}}</span></div>
<input id="{{x.id}}" type="range" min="{{x.min}}" max="{{x.max}}" step="{{x.step}}" value="{{x.v}}" onChange="{{x.set}}">
</div>
</sc-for>
</div>
<div style="background: #0F2A3A; color: #FFFFFF; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: #9FD0E6">สมการ</div>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 1.9">T ≈ e^(−2κd)<br>κ = √(2m(V₀ − E)) / ħ<br>κ ≈ 5.12 · √(V₀ − E [eV]) ต่อนาโนเมตร</div>
</div>
</div>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 26px; font-weight: 700">3. ควอนตัมดอต: ขนาดกำหนดสี</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4A5D6A; max-width: 960px">อิเล็กตรอนที่ถูกขังในกล่องเล็กมีพลังงานได้เฉพาะบางระดับ (E ∝ n²/L²) เหมือนเชือกกีตาร์ที่สั่นได้เฉพาะบางความถี่ กล่องยิ่งเล็ก ระดับพลังงานยิ่งห่างกัน เมื่ออิเล็กตรอนตกลงระดับล่าง ก็ปล่อยโฟตอนสีตามช่องว่างพลังงานนั้นออกมา ผลึกสารกึ่งตัวนำขนาดไม่กี่นาโนเมตร (ควอนตัมดอต) จึงเปลี่ยนสีได้เพียงแค่เปลี่ยนขนาด ใช้ในจอทีวี QLED (รางวัลโนเบลเคมี 2023)</p>
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<div style="flex: 999 1 640px; min-width: 0; display: flex; flex-wrap: wrap; gap: 14px">
<div style="flex: 1 1 380px; min-width: 0; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; overflow: hidden">
<div style="padding: 10px 16px; border-bottom: 1px solid #E3E9EC; font-weight: 700; font-size: 14px">อนุภาคในกล่อง: ระดับพลังงานและรูปคลื่น</div>
<svg viewBox="0 0 420 280" style="display: block; width: 100%; height: auto; background: #FBFCFD" role="img" aria-label="{{qd.aria}}">
<line x1="{{qd.x0}}" y1="20" x2="{{qd.x0}}" y2="260" stroke="#0F2A3A" stroke-width="4"></line>
<line x1="{{qd.x1}}" y1="20" x2="{{qd.x1}}" y2="260" stroke="#0F2A3A" stroke-width="4"></line>
<sc-for list="{{qd.levels}}" as="l" hint-placeholder-count="3">
<line x1="{{l.x0}}" y1="{{l.y}}" x2="{{l.x1}}" y2="{{l.y}}" stroke="#C9D4DA" stroke-dasharray="4 4"></line>
<path d="{{l.psi}}" fill="none" stroke="{{l.c}}" stroke-width="2.5"></path>
<text x="{{l.tx}}" y="{{l.y}}" dy="4" font-size="11" fill="#4A5D6A">n = {{l.n}}</text>
</sc-for>
<path d="{{qd.jump}}" fill="none" stroke="{{qd.col}}" stroke-width="3"></path>
<text x="{{qd.x1}}" y="272" font-size="11" text-anchor="end" fill="#4A5D6A">{{qd.wTxt}}</text>
</svg>
</div>
<div style="flex: 1 1 240px; min-width: 0; background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; align-items: center">
<svg viewBox="0 0 240 200" style="display: block; width: 100%; max-width: 280px; height: auto" role="img" aria-label="{{qd.dotAria}}">
<rect x="0" y="0" width="240" height="200" rx="12" fill="#0F2A3A"></rect>
<circle cx="120" cy="92" r="{{qd.glowR}}" fill="{{qd.col}}" opacity="0.35"></circle>
<circle cx="120" cy="92" r="{{qd.dotR}}" fill="{{qd.col}}"></circle>
<text x="120" y="186" font-size="12" text-anchor="middle" fill="#D9E8EF">{{qd.lamTxt}}</text>
</svg>
<svg viewBox="0 0 240 30" style="display: block; width: 100%; max-width: 280px; height: auto" aria-hidden="true">
<defs><linearGradient id="spec" x1="0" x2="1"><stop offset="0" stop-color="#7A00FF"></stop><stop offset="0.17" stop-color="#2050FF"></stop><stop offset="0.33" stop-color="#00C0FF"></stop><stop offset="0.5" stop-color="#20D040"></stop><stop offset="0.67" stop-color="#FFE000"></stop><stop offset="0.83" stop-color="#FF8000"></stop><stop offset="1" stop-color="#E00000"></stop></linearGradient></defs>
<rect x="0" y="6" width="240" height="14" rx="4" fill="url(#spec)"></rect>
<path d="{{qd.mark}}" fill="#0F2A3A"></path>
</svg>
</div>
</div>
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="background: #FFFFFF; border: 1px solid #D5DEE3; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">

        { id: 'f-d', name: 'ระยะทาง', label: s.dist + ' กม.', min: 1, max: 400, step: 1, v: s.dist, set: function (e) { self.setState({ dist: parseFloat(e.target.value) }); } },
        { id: 'f-t', name: 'การลดทอนของสาย', label: s.atten.toFixed(2) + ' dB/กม.' + (s.atten <= 0.22 ? ' (1550 nm)' : s.atten <= 0.4 ? ' (1310 nm)' : ' (850 nm)'), min: 0.15, max: 3, step: 0.05, v: s.atten, set: function (e) { self.setState({ atten: parseFloat(e.target.value) }); } },
        { id: 'f-c', name: 'จำนวนช่องสี (DWDM)', label: s.ch + ' ช่อง', min: 1, max: 96, step: 1, v: s.ch, set: function (e) { self.setState({ ch: parseInt(e.target.value, 10) }); } }
      ],
      rates: [10, 100, 400, 800].map(function (r) { var q = pill(s.rate === r); return { name: r + 'G', pressed: s.rate === r ? 'true' : 'false', bg: q.bg, fg: q.fg, border: q.border, pick: function () { self.setState({ rate: r }); } }; }),
      aria: 'แสงในใยแก้ว มุม ' + s.rayA + ' องศา ' + (trapped ? 'ถูกนำไปตามแกน' : 'รั่วออก') + ' NA ' + NA.toFixed(3)
    };

    return {
      pe: pe, tn: tn, qd: qd, qb: qb, fb: fb, L: s.L, amp: s.amp,
      setL: function (e) { self.setState({ L: parseFloat(e.target.value) }); },
      toggleAmp: function () { self.setState({ amp: !self.state.amp }); },
      measure1: function () {
        var st = self.state, pz = st.re0 * st.re0 + st.im0 * st.im0, r = self.rnd() < pz ? 0 : 1;
        var prev = st.shots || [0, 0]; prev = [prev[0] + (r === 0 ? 1 : 0), prev[1] + (r === 1 ? 1 : 0)];
        self.setState({ re0: r === 0 ? 1 : 0, im0: 0, re1: r === 1 ? 1 : 0, im1: 0, shots: prev, log: 'วัดได้ ' + r + ' สถานะยุบเป็น |' + r + '⟩ (วัดซ้ำจะได้ ' + r + ' เสมอ)' });
      },
      measure100: function () {
        var st = self.state, pz = st.re0 * st.re0 + st.im0 * st.im0, n0 = 0;
        for (var i = 0; i < 1000; i++) if (self.rnd() < pz) n0++;
        self.setState({ shots: [n0, 1000 - n0], log: 'เตรียมสถานะเดิม 1,000 ครั้ง แล้ววัดครั้งละครั้ง ผลกระจายตามโอกาส |α|² และ |β|²' });
      },
      qReset: function () { self.setState({ re0: 1, im0: 0, re1: 0, im1: 0, shots: null, log: 'สถานะเริ่มต้น |0⟩' }); }
    };
  }
}
</script>
